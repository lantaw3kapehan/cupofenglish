<h1>Verify a payment confirmation<small>付款确认单验证</small></h1>
<p class="i">Enter the number and the security code printed on the PAID stamp.<br>请输入付款确认单编号及“已付款”印章上的防伪码。</p>
<label>Confirmation no. <span>编号</span></label><input id="no" inputmode="numeric" placeholder="1748" autocomplete="off">
<label>Security code <span>防伪码</span></label><input id="cd" placeholder="7F3A-91C2" maxlength="9" autocomplete="off" style="text-transform:uppercase">
<button id="go">Verify · 验证</button>
<div class="r" id="r"></div>
</div><div class="f">CupOfEnglish Online Tutorial Services OPC · Philippines</div></div>
<script>
const U = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/coe-invoice', $ = id => document.getElementById(id);
const BIZ = '<div class="biz"><b>Business Registration Verification · 企业税务登记核验</b><span>CupOfEnglish Online Tutorial Services OPC · Philippines<br>RSN 006RC20240000005450 · TIN 609-400-950-00000</span><a href="https://verify.bir.gov.ph/correspondence/ae812a0e1bbe40709272184bf7c10411" target="_blank" rel="noopener">Open the official registration check →<br><small>打开菲律宾税务局官方核验页面</small></a></div>';
const fmt = n => (+n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dmy = d => { const [y, m, dd] = String(d).slice(0, 10).split('-'); return m + '/' + dd + '/' + y; };
async function go(){ const no = $('no').value.trim(), cd = $('cd').value.trim().toUpperCase().replace(/[^0-9A-F]/g, ''), r = $('r');
  if(!no || cd.length !== 8){ r.className = 'r on no'; r.innerHTML = '<b>Please enter both · 请填写编号和防伪码</b>The security code has 8 characters. 防伪码为 8 位。'; return; }
  $('go').disabled = true; $('go').textContent = 'Checking… 正在验证…'; r.className = 'r'; r.innerHTML = '';
  try{ const x = await (await fetch(U, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'verify', no, code: cd }) })).json();
    if(x && x.valid && x.status !== 'void'){ r.className = 'r on ok'; r.innerHTML = '<b>✓ Genuine · 真实有效</b>This payment confirmation was issued by CupOfEnglish. 本付款确认单由一杯英语开具。<dl><dt>No. 编号</dt><dd>' + x.no + '</dd><dt>Date 日期</dt><dd>' + dmy(x.day) + '</dd><dt>Amount paid 已付金额</dt><dd>' + (x.currency || 'CNY') + ' ' + fmt(x.total) + '</dd></dl>' + BIZ; }
    else if(x && x.valid){ r.className = 'r on vd'; r.innerHTML = '<b>Void · 已作废</b>This payment confirmation was cancelled and is no longer valid. 本付款确认单已作废，不再有效。'; }
    else { r.className = 'r on no'; r.innerHTML = '<b>✕ Not found · 未找到</b>The number and security code do not match our records. Please check them, or contact CupOfEnglish. 编号与防伪码不匹配，请核对或联系一杯英语。'; }
  }catch(e){ r.className = 'r on no'; r.innerHTML = '<b>Could not check · 无法验证</b>Please check your internet connection and try again. 请检查网络后重试。'; }
  const t = new Date(), hm = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
  r.insertAdjacentHTML('beforeend', '<div class="ts">Checked at ' + hm + ' · 验证时间 ' + hm + '</div>');
  $('go').disabled = false; $('go').textContent = 'Verify again · 重新验证'; try{ r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }catch(e){} }
$('go').onclick = go; ['no', 'cd'].forEach(i => $(i).addEventListener('keydown', e => { if(e.key === 'Enter') go(); }));
const q = new URLSearchParams(location.search); if(q.get('no')) $('no').value = q.get('no'); if(q.get('c')) $('cd').value = q.get('c'); if(q.get('no') && q.get('c')) go();
</script>
