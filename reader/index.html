<!-- 16 Nov 2026 · 2277 · The CupOfEnglish book reader (Misty 18:49–18:54): book PDFs open in their own CupOfEnglish tab, never Google Drive.
     Our own copy first (Supabase Storage, book-media), then the Drive stream (coe-audio) · zoom · drawing tools the student sees ·
     Present (full screen, only the CupOfEnglish header, the page and the drawings) · the unit's lessons and videos on the left.
     Opened from the app (needs the app's sign-in on this browser). PDF.js 4.10 (Apache-2.0) in ./pdfjs. -->
<style>
@font-face{font-family:Inter;src:url(../fonts/card-inter-var.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Fredoka One";src:url(../fonts/card-fredoka-one.woff2) format("woff2");font-display:swap}
:root{--ink:#2B2450;--mute:#6B6880;--line:#ECEAF2;--teal:#13636B;--teal2:#E8F3F3;--bg:#EEEDF3;--coral:#B4513B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
header{height:64px;flex:none;background:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line)}
header .logo{height:32px}
header .sep{width:1px;height:30px;background:var(--line)}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;align-items:center;gap:4px;background:#F3F2F7;border-radius:12px;padding:4px}
.ib{min-width:36px;height:36px;border:0;border-radius:9px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:14px;font-weight:600}
.ib:hover{background:#F7F7FB}.ib:disabled{opacity:.4;cursor:default}
.num{font-size:14px;font-weight:600;padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 2307: go to a page */
.pgb{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;height:36px;border-radius:9px;cursor:pointer}.pgb:hover{background:#fff}
.jump{position:fixed;z-index:30;background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(30,26,60,.18);padding:14px;width:300px;display:none}
.jump.on{display:block}.jump h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.jump form{display:flex;gap:8px;margin-bottom:12px}.jump input{flex:1;min-width:0;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:600 16px Inter,sans-serif;color:var(--ink)}
.jump input:focus{outline:0;border-color:#00B5B9}.jump form button{height:40px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:600 14px Inter,sans-serif;padding:0 16px;cursor:pointer}
.jump .secs{display:flex;flex-wrap:wrap;gap:6px}.jump .secs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:500 13px Inter,sans-serif;color:var(--ink);cursor:pointer}
.jump .secs button:hover,.jump .secs button.on{background:var(--teal2);border-color:transparent;color:#0E4C52}
.jump .hint{font-size:12px;color:var(--mute);margin-top:10px}
.btn{height:40px;padding:0 14px;border:1px solid #E3E1EA;border-radius:12px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.pr{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.x{width:40px;padding:0;justify-content:center;border:0;background:#F3F2F7;border-radius:999px}
.main{flex:1;display:flex;min-height:0}
aside{width:260px;flex:none;border-right:1px solid var(--line);background:#FBFBFD;overflow:auto;padding:14px 10px}
aside .h{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;padding:12px 8px 6px}
aside .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border:0;border-radius:12px;background:transparent;cursor:pointer;font-size:14px}
aside .it:hover{background:#F1F0F6}
aside .it.on{background:var(--teal2);color:#0E4C52;font-weight:600}
aside .it svg{flex:none}
aside .uh{display:flex;align-items:center;gap:6px;padding:4px 4px 2px}
aside .uh b{flex:1;font-size:14px}
aside .note{font-size:12px;color:var(--mute);padding:14px 8px;line-height:1.5}
.stage{flex:1;position:relative;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:24px}
.stage.fit{align-items:center}
.pagewrap{position:relative;background:#fff;box-shadow:0 8px 28px rgba(30,26,60,.16);border-radius:4px;flex:none}
.pagewrap canvas{display:block}
#ink{position:absolute;inset:0;touch-action:none}
.tools{position:absolute;left:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 6px 20px rgba(30,26,60,.14);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;z-index:5}
.tb{width:44px;height:44px;border:0;border-radius:12px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.tb.on{background:var(--teal2);color:#0E4C52}
.tb.red{color:var(--coral);font-size:12px;font-weight:600}
.dot{width:22px;height:22px;border-radius:999px;border:0;cursor:pointer;margin:4px 0}
.dot.on{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.dots{display:grid;grid-template-columns:22px 22px;gap:6px 10px;padding:4px 0}.dots .dot{margin:0}
.ur{display:flex;gap:2px}.ur .tb{width:30px;height:36px}.lab{font-size:9.5px;color:var(--mute);margin-top:-4px;white-space:nowrap}
.shw{position:relative}.shp{display:none;position:absolute;left:52px;top:-6px;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(30,26,60,.18);padding:6px;grid-template-columns:repeat(3,64px);gap:4px;z-index:9}
.shp.on{display:grid}.shp button{border:0;background:transparent;border-radius:10px;height:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);font:500 11px Inter,sans-serif}
.shp button:hover,.shp button.on{background:var(--teal2);color:#0E4C52}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#2B2450;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;display:none;align-items:center;gap:12px;z-index:12;box-shadow:0 6px 18px rgba(0,0,0,.2)}.toast.on{display:flex}.toast button{border:0;background:#fff;color:#2B2450;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}
.tools{max-height:calc(100% - 24px);overflow-y:auto;overflow-x:visible}
.sz{width:44px;height:32px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-weight:700;color:#2B2450;display:flex;align-items:center;justify-content:center}.sz.on{background:var(--teal2);color:#0E4C52}
.hr{width:28px;height:1px;background:var(--line);margin:4px 0}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--mute);font-size:15px;text-align:center;padding:30px}
.spin{width:34px;height:34px;border:3px solid #DDDBE6;border-top-color:var(--teal);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:none;position:fixed;bottom:44px;left:50%;transform:translateX(-50%);align-items:center;gap:4px;background:rgba(43,36,80,.9);color:#fff;border-radius:999px;padding:6px 8px;z-index:6;transition:opacity .3s}
.pill button{height:40px;min-width:40px;border:0;border-radius:999px;background:transparent;color:#fff;cursor:pointer;font-size:14px;font-weight:600;padding:0 12px}
.tag{display:none;height:30px;flex:none;align-items:center;justify-content:center;font-size:12.5px;color:var(--mute);background:#fff;letter-spacing:.02em}
.txtin{position:absolute;z-index:7;font:600 20px Inter,sans-serif;border:1.5px dashed var(--teal);background:rgba(255,255,255,.9);padding:2px 6px;outline:0;min-width:60px;line-height:1.1;border-radius:6px}
/* Present: what the student sees on the shared screen */
body.present header .grp,body.present header .btn,body.present header .sep{display:none}
body.present header{justify-content:center;border-bottom:0;background:#fff linear-gradient(90deg,#00C4AF,#00B5B9 50%,#00ACC4) no-repeat left bottom/100% 3px}   /* 2296: the logo's own teal */
body.present header .tt{text-align:center}
body.present aside,body.noside aside{display:none}
body.present #sideBt{display:none}
body.present .pill{display:flex}
body.present .tag{display:flex}
/* 2701 (Misty 22 Nov 16:51, option A): the time and the minutes left in the class header while presenting */
header{position:relative}.clk{display:none;position:absolute;right:20px;top:50%;transform:translateY(-50%);align-items:center;gap:10px;font-family:'COE Card Inter',Inter,sans-serif}
body.present .clk{display:flex}.clk b{font-size:20px;color:#2B2253;font-variant-numeric:tabular-nums}.clk span{font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;background:#E4F6F6;color:#0E6F68}
.clk span.warn{background:#FFF3DC;color:#8A5A00}.clk span.over{background:#FCEBEB;color:#A32D2D}.clk span:empty{display:none}
body.present .pill{bottom:18px}   /* 2715 (Misty 22 Nov 18:49, option A): the bar sits under the page, always clear */
/* 2287: the toolbar stays out of the way: compact, can fold into one button, and fades while the teacher is not using it */
.tools{transition:opacity .25s}.tools .tb{height:38px}.tools .sz{height:28px}.tools .sz{display:none!important}.tools .sz + .sz + .sz + .hr{display:none}
body.idle .tools:not(:hover){opacity:.35}
.tfold{width:44px;height:22px;border:0;background:transparent;color:var(--mute);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}.tfold:hover{background:var(--teal2)}
.tmini{display:none;position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:5;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.97);border-radius:14px;box-shadow:0 6px 20px rgba(30,26,60,.14);padding:6px;border:0;cursor:pointer;color:var(--ink)}
.tmini .cur{width:36px;height:36px;border-radius:10px;background:var(--teal2);color:#0E4C52;display:flex;align-items:center;justify-content:center;font-weight:700}
.tmini small{font-size:9.5px;color:var(--mute)}
.tools,.tmini{position:fixed;left:var(--tlx,16px);top:var(--tly,50%)}   /* 2606: tools stay on screen while zoomed or scrolled */
.bbar{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);align-items:center;gap:4px;background:#fff;border:1px solid #E3E1EA;border-radius:14px;padding:5px;z-index:7;box-shadow:0 4px 14px rgba(43,36,80,.12);transition:opacity .3s;max-width:calc(100vw - 24px);overflow-x:auto}
body.board .bbar{display:flex}body.present .bbar{display:none!important}.pill .bo{display:none}body.board .pill .bo{display:inline-block}.smenu{display:none;position:fixed;z-index:8;background:#2B2450;border-radius:14px;padding:6px;flex-direction:column;gap:2px;box-shadow:0 6px 18px rgba(0,0,0,.25)}.smenu.on{display:flex}.smenu button{height:38px;border:0;border-radius:10px;background:transparent;color:#fff;font-size:14px;font-weight:600;text-align:left;padding:0 14px;cursor:pointer;white-space:nowrap}.smenu button.on{background:rgba(255,255,255,.18)}.pill button{white-space:nowrap}   /* 2620: presenting: style bar at the top (over the page header), the writing space stays free */body.present.idle .bbar{opacity:.15}
.bbar button{height:34px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;color:#2B2450;padding:0 11px;white-space:nowrap}.bbar button.on{background:var(--teal2);color:#0E4C52}.bbar i{width:1px;height:22px;background:#E3E1EA;margin:0 4px}
body.bonly #bback,body.bonly #pboard,body.bonly #boardBt,body.bonly #sideBt{display:none!important}   /* 2634 */
#cl2636{position:fixed;inset:0;background:rgba(43,36,80,.35);z-index:50;display:flex;align-items:center;justify-content:center}#cl2636 .cl36{background:#fff;border-radius:16px;padding:18px 20px;width:min(420px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.2)}#cl2636 .cl36s{font-size:13px;color:var(--mute);margin:6px 0 10px;line-height:1.5}#cl2636 .cl36r{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #EEECF3;padding:8px 0;font-size:14px}#cl2636 .cl36b{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}   /* 2636 */
.txdrag{cursor:move!important}.txsize{cursor:nwse-resize!important}   /* 2614 */
body.tmin .tools{display:none}body.tmin .tmini{display:flex}body.idle .tmini:not(:hover){opacity:.35}
.vid{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
.vid.on{display:flex}
.vid .top{width:min(1100px,100%);display:flex;align-items:center;gap:10px;color:#fff;margin-bottom:10px}
.vid .top b{flex:1;font-size:16px}
.vid .top button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600}
.vid video{width:min(1100px,100%);max-height:calc(100vh - 110px);background:#000;border-radius:12px}
@media (max-width:900px){aside{display:none}body.side aside{display:block;position:absolute;z-index:8;top:64px;bottom:0;left:0;box-shadow:0 10px 30px rgba(0,0,0,.2)}header .hide-s{display:none}.tools{left:8px}}
</style>
</head>
<body>
<div class="app">
<header>
<img class="logo" src="logo.png" alt="CupOfEnglish">
<div class="sep"></div>
<button class="btn x" id="sideBt" aria-label="Show or hide the list of lessons" title="Show or hide the list">≡</button>
<div class="tt"><b id="bk">Book</b><span id="fl"></span></div>
<div class="clk" id="clk" aria-live="off"><b id="clkT"></b><span id="clkL"></span></div>
<div class="grp"><button class="ib" id="prev" aria-label="Previous page">‹</button><button class="num pgb" id="pg" title="Go to a page or a section" aria-haspopup="dialog">–</button><button class="ib" id="next" aria-label="Next page">›</button></div>
<div class="grp hide-s"><button class="ib" id="zo" aria-label="Zoom out">−</button><button class="ib" id="zf" aria-label="Fit page">Fit</button><button class="ib" id="zi" aria-label="Zoom in">+</button></div>
<button class="btn" id="copyPg" title="Copy this page as the homework picture, then paste it in the WeChat group. Hidden while you present."><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span class="hide-s">Copy for homework</span></button>
<button class="btn" id="wrPg" hidden title="Correct a student's writing like in Word: red strike-through, blue corrections, band scores, then Copy picture or PDF"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="hide-s">Writing correction</span></button>
<button class="btn" id="boardBt" title="A blank CupOfEnglish page to draw and write on, like the VooV whiteboard (key B · cleared when the book is closed)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9h6M7 13h9"/></svg><span class="hide-s" id="boardBtT">Blank board</span></button>
<button class="btn pr" id="present"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Present</button>

</header>
<div class="main">
<aside id="side"></aside>
<div class="stage fit" id="stage">
<div class="tools" id="tools">
<button class="tfold" id="tfold" title="Hide the tools (they fold into one small button)" aria-label="Hide the tools"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<button class="tb on" data-t="hand" aria-label="Move and scroll" title="Move (V or Esc)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V11"/><path d="M16 11V8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 6 17.5L4.3 13a1.5 1.5 0 0 1 2.7-1.3L8 14"/></svg></button>
<button class="tb" data-t="pen" aria-label="Pen" title="Pen (P)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg></button>
