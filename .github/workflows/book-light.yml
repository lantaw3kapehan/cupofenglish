name: Book light copies (2548)
# Misty 20 Nov 22:50: make lighter book copies to a fixed clarity standard (text stays real text; pictures 150 dpi),
# first 3 samples with side-by-side pictures for her to check. Nothing is switched for teachers here.
on:
  schedule:
    - cron: '7 17 * * *'   # 01:07 Manila every night, long after classes
  workflow_dispatch:
    inputs:
      mode:
        description: 'sample (pictures) or batch'
        default: 'batch'
      limit:
        description: 'batch: how many files'
        default: '40'
      ids:
        description: 'sample: Drive ids, comma-separated'
        default: ''
      pages:
        description: 'sample: page for each id, comma-separated'
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: book-light
  cancel-in-progress: false
jobs:
  batch:
    if: github.event_name == 'schedule' || inputs.mode == 'batch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript poppler-utils >/dev/null
      - name: Make light copies
        env:
          LIMIT: ${{ inputs.limit || '60' }}
          IDS: ${{ inputs.mode == 'batch' && inputs.ids || '' }}
          DPI: '150'
          BUDGET_MIN: '300'
        run: bash tools/book-light-batch.sh
  light:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sample'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript poppler-utils imagemagick >/dev/null
      - name: Storage key (never printed)
        env:
          SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/k.json -w '%{http_code}' -H "Authorization: Bearer $SAT" "https://api.supabase.com/v1/projects/rlxkiahqjsabopmuhern/api-keys?reveal=true")
          echo "keys answer: $code"
          K=$(python3 -c 'import json; d=json.load(open("/tmp/k.json")); print([k.get("api_key","") for k in d if k.get("name")=="service_role"][0])' 2>/dev/null || true); rm -f /tmp/k.json
          if [ -n "$K" ]; then echo "::add-mask::$K"; echo "SRK=$K" >> "$GITHUB_ENV"; else echo "no storage key: light copies are not uploaded this run"; fi
      - name: Make light copies and pictures
        env:
          IDS: ${{ inputs.ids }}
          PAGES: ${{ inputs.pages }}
          DPI: '150'
        run: bash tools/book-light.sh
      - uses: actions/upload-artifact@v4
        with:
          name: compare
          path: out/*.png
          retention-days: 3
      - name: Sizes
        run: cat out/sizes.txt
      - name: Pictures for Claude (encrypted, only Claude's private key opens them)
        run: |
          cd out && for f in *.png; do convert "$f" -quality 82 "${f%.png}.jpg"; done && tar cf ../p.tar *.jpg sizes.txt && cd ..
          openssl rand -out k.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tar -out p.enc -pass file:k.bin
          openssl pkeyutl -encrypt -pubin -inkey tools/book-light-pub.pem -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.enc
          echo "==KEY=="; base64 -w 0 k.enc; echo; echo "==DATA=="; base64 -w 4000 p.enc; echo "==END=="
