name: Apply screen changes
on:
  push:
    branches: [main]
    paths: ['patches/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: screens
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply new change files
        run: |
          touch patches/applied.txt
          for f in $(ls patches/*.js 2>/dev/null | sort); do
            if ! grep -qx "$f" patches/applied.txt; then
              echo "Applying $f"
              node "$f" app.html
              echo "$f" >> patches/applied.txt
            fi
          done
      - name: Check the screens and write version.txt
        run: node tools/check.js app.html
      - name: Save to GitHub
        run: |
          git config user.name "CupOfEnglish changes"
          git config user.email "actions@users.noreply.github.com"
          git add app.html version.txt patches/applied.txt
          git diff --cached --quiet && echo "No change" && exit 0
          V=$(cat version.txt)
          git commit -m "Screens updated (COE_V $V)"
          git push
