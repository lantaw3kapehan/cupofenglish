name: Copy screens from Apps Script
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the latest screens
        run: |
          curl -sSfL "https://script.google.com/macros/s/AKfycbyqAYrjEQ3CdeTzogP8mZ8tMRx59nV0vMvOHtoQ0wudTBNNXV7YeE_mJPYcqIRhmRbu/exec?app=1" -o app.new.html
          grep -q "COE_API" app.new.html
          grep -q "COE_V" app.new.html
          test "$(wc -c < app.new.html)" -gt 200000
          mv app.new.html app.html
      - name: Save to GitHub
        run: |
          git config user.name "CupOfEnglish sync"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git diff --cached --quiet && echo "No change" && exit 0
          V=$(grep -o "COE_V = [0-9]*" app.html | head -1)
          git commit -m "Screens from Apps Script ($V)"
          git push
