# Deploy one Supabase edge function exactly from the files saved in this repository (nothing retyped).
# Run from GitHub › Actions › "Deploy server function" › Run workflow, or by Claude with: gh workflow run deploy-function.yml -f name=coe-student -f dir=server/coe-student-v31 -f jwt=false
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase › Account › Access Tokens), added by Misty on 14 Nov 2026.
name: Deploy server function
on:
  workflow_dispatch:
    inputs:
      name: { description: "Function name (e.g. coe-student)", required: true }
      dir: { description: "Folder in this repository with index.ts and its files", required: true }
      jwt: { description: "Require a Supabase JWT (true/false)", required: true, default: "false" }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Stage the files
        run: |
          test -f "${{ inputs.dir }}/index.ts"
          mkdir -p "supabase/functions/${{ inputs.name }}"
          cp -r "${{ inputs.dir }}"/. "supabase/functions/${{ inputs.name }}/"
          ls -la "supabase/functions/${{ inputs.name }}"
      - name: Deploy
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          FLAG=""; if [ "${{ inputs.jwt }}" = "false" ]; then FLAG="--no-verify-jwt"; fi
          supabase functions deploy "${{ inputs.name }}" --project-ref rlxkiahqjsabopmuhern --use-api --yes $FLAG
