function crisp(im, w){ let s = im, sw = im.width, sh = im.height; while(sw / 2 >= w * 1.4){ const c2 = document.createElement('canvas'); c2.width = Math.round(sw / 2); c2.height = Math.round(sh / 2); const g2 = c2.getContext('2d'); g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = 'high'; g2.drawImage(s, 0, 0, c2.width, c2.height); s = c2; sw = c2.width; sh = c2.height; } return s; }   /* 18 Nov: logo shrunk in halves, high-quality smoothing (one big step looked pixelated) */
