<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupOfEnglish · Homework check</title>
<link rel="icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* 2308 · Homework check (Misty 17 Nov 15:44): paste the homework the student sent on WeChat (text or a picture), correct it in class,
   show it on screen, save it to the student's record and copy a bilingual picture for the parent/student. */
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--teal:#00707A;--teal2:#00616A;--tint:#E6F5F6;--navy:#2F2753;--ink:#1F2937;--ink2:#4B5563;--line:#E5E7EB;--soft:#F4F6F8;--out:#CFCBDD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 'COE Card Inter',Inter,system-ui,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}a:hover{color:#004E55}
.wrap{max-width:1240px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .l{display:flex;align-items:center;gap:14px;min-width:0}
.top img.logo{height:38px;width:auto}
.crumb{font-size:14px;color:var(--ink2)}
h1{margin:0;font:400 28px/1.2 'COE Card Fredoka','Fredoka One',sans-serif;color:var(--navy)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#B42318;background:#FEF3F2;border:1px solid #FECDCA;border-radius:999px;padding:3px 10px;margin-left:10px;vertical-align:middle}
.live i{width:8px;height:8px;border-radius:50%;background:#D92D20}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--out);background:#fff;font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:#F8F9FB}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}.btn.pri:hover{background:#005E66}
.btn.out{border-color:var(--teal);color:var(--teal2)}
.btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.red{color:#B42318;border-color:#FDA29B}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.tb:focus-visible{outline:3px solid #7FC8CD;outline-offset:2px}
.grid{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.main{flex:999 1 600px;min-width:0}
.side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.pad{padding:16px 18px}
.h2{font-size:18px;font-weight:600;color:var(--navy);margin:0 0 10px}
.mute{color:var(--ink2)}.small{font-size:14px}.xs{font-size:13px}
.bar1{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid #EEF0F3}
.seg{display:flex;gap:4px;background:#F1F3F5;border-radius:10px;padding:4px}
.seg button{height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink2);font-weight:500;font-size:14px}
.seg button.on{background:var(--tint);border-color:#99D5D9;color:var(--teal2);font-weight:600}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;background:#FAFBFC;border-bottom:1px solid #EEF0F3}
.chip{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--out);background:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip kbd{font:600 11px 'COE Card Inter',sans-serif;opacity:.6}
.sep{width:1px;height:24px;background:var(--line);margin:0 2px}
.flex1{flex:1}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--out);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ib svg,.tb svg{width:18px;height:18px}
/* the essay */
.body{position:relative;padding:26px 30px 30px}
.ttl{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#6B7280;margin-bottom:8px}
#essay{font-size:20px;line-height:2.3;color:#111827;max-width:820px;word-wrap:break-word;user-select:text;-webkit-user-select:text;cursor:text}
#essay .w{border-radius:3px;padding:1px 0}
#essay .w.sel{background:#FDE68A;box-shadow:0 0 0 2px #FDE68A}
#essay .w:hover{background:#F3F4F6}
.mk{border-radius:3px;padding:0 2px;cursor:pointer}
.mk s{color:#6B7280;text-decoration-thickness:2px}
.mk b{font-weight:600}
.mk sup{font:700 11px 'COE Card Inter',sans-serif;color:#fff;border-radius:999px;padding:1px 5px;margin-left:2px;vertical-align:super}
.mk.on{outline:2px solid #FBBF24;outline-offset:1px}
.why{margin-top:18px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;max-width:820px}
.why div{font-size:15px;color:#374151}
.why .n{display:inline-block;min-width:20px;height:20px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:20px;margin-right:8px}
.ed{position:absolute;z-index:5;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(16,24,40,.16);padding:12px;display:flex;flex-direction:column;gap:8px}
.ed label{font-size:13px;color:var(--ink2)}
.ed input,.ed textarea{width:100%;font-size:15px;border:1px solid var(--out);border-radius:8px;padding:8px 10px}
.ed .pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;align-self:flex-start}
.ed .r{display:flex;gap:6px;flex-wrap:wrap}
.cats{display:flex;gap:4px;flex-wrap:wrap}
.cats button{height:28px;padding:0 8px;font-size:12px;border-radius:6px;border:1px solid var(--line);background:#fff}
/* empty state */
.empty{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.drop{width:100%;max-width:620px;border:2px dashed #B8C4CC;border-radius:16px;padding:30px 20px;background:#FAFCFC;display:flex;flex-direction:column;align-items:center;gap:10px}
.drop.on{border-color:var(--teal);background:var(--tint)}
.drop .big{font-size:20px;font-weight:600;color:var(--navy)}
.keys{display:inline-flex;gap:4px;align-items:center;white-space:nowrap}.keys kbd{font:600 14px 'COE Card Inter',sans-serif;border:1px solid var(--out);border-bottom-width:2px;border-radius:6px;padding:1px 7px;background:#fff}
#pasteTa{width:100%;max-width:620px;min-height:150px;border:1px solid var(--out);border-radius:12px;padding:12px;font-size:16px}
/* picture */
.pic{display:flex;align-items:stretch;min-height:420px}
.rail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-right:1px solid #EEF0F3;background:#FAFBFC}
.tb{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;font-weight:700;font-size:16px;color:#374151}
.tb.on{border-color:#99D5D9;background:var(--tint);color:var(--teal2)}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0}
.dot.on{box-shadow:0 0 0 2px #fff,0 0 0 4px currentColor}
.rail .ln{width:24px;height:1px;background:var(--line);margin:3px 0}
/* 2408 (Misty 19 Nov 12:04): the tools and the stamps stay in view while the teacher scrolls a long picture; marks can be dragged */
#tools{position:sticky;top:0;z-index:6;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 1px 0 var(--line)}
.rail{position:sticky;top:var(--tb,0px);align-self:flex-start;max-height:calc(100vh - var(--tb,0px));overflow-y:auto;z-index:4}
#pcv.mv{cursor:move}#pcv.mving{cursor:grabbing}
#selb{position:absolute;z-index:5;display:flex;gap:4px;background:#fff;border:1px solid #D7DCE2;border-radius:10px;padding:3px;box-shadow:0 4px 12px rgba(16,24,40,.12)}#selb button{border:0;background:#F4F6F8;border-radius:7px;padding:5px 9px;font:600 13px Inter,sans-serif;cursor:pointer;color:#2B2253}#selb button:hover{background:#E6F5F6}
#tools .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}#tools .tools>*{flex:none}#tools .tools>.xs{white-space:nowrap}
#pwrap{flex:1;min-width:0;background:#EEF0F3;padding:16px;display:flex;justify-content:center;align-items:flex-start;position:relative;overflow:auto}
#pcv{display:block;background:#fff;box-shadow:0 6px 18px rgba(16,24,40,.18);touch-action:none}
#pcv.hand{touch-action:auto;cursor:grab}
#ptxt{position:absolute;z-index:4;min-width:180px;font-size:15px;border:2px solid var(--teal);border-radius:8px;padding:6px 8px}
/* side */
.cnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.cnt div{border-radius:10px;padding:9px 4px}
.cnt b{display:block;font-size:22px;line-height:1.2}
.cnt span{font-size:12px;color:var(--ink)}
.step{display:flex;align-items:center;gap:6px;justify-content:center;margin-top:4px}
.step button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:#fff;padding:0;font-weight:700;line-height:1}
textarea.note{width:100%;min-height:96px;border:1px solid var(--out);border-radius:10px;padding:10px 12px;font-size:15px;resize:vertical}
input.tt{width:100%;height:42px;border:1px solid var(--out);border-radius:10px;padding:0 12px;font-size:15px}
.zh{font-size:14px;color:#374151;background:#F7F6FB;border-radius:8px;padding:8px 10px;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
.hist{display:flex;flex-direction:column}
.hist .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F0F1F4}
.hist .it:first-child{border-top:0}
.hist .it .g{flex:1;min-width:0}
.hist .it .g div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kd{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:#F1F3F5;color:#374151}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.modal .box .sc{overflow:auto;padding:16px;background:#F3F6F7;text-align:center}
.modal .box .sc img{max-width:100%;border-radius:8px}
.modal .box .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pick{max-width:640px;margin:30px auto}
.pick input{width:100%;height:46px;border:1px solid var(--out);border-radius:10px;padding:0 14px;font-size:16px;margin-bottom:10px}
.pick .row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:0;border-top:1px solid #F0F1F4;background:#fff;text-align:left;font-size:16px}
.pick .row:hover{background:#F8F9FB}
/* show on screen */
#work:fullscreen{background:#fff;overflow:auto;border-radius:0}
#work:fullscreen #essay{font-size:30px;max-width:1200px;margin:0 auto}
#work:fullscreen .why{max-width:1200px;margin:18px auto 0}
#work:fullscreen .why div{font-size:22px}
#work:fullscreen .body{padding:40px 60px}
@media(max-width:640px){.wrap{padding:12px 12px 40px}#essay{font-size:18px}.body{padding:18px 16px}.cnt b{font-size:18px}.top img.logo{height:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="l"><img class="logo" src="../reader/logo.png" alt="CupOfEnglish">
      <div><div class="crumb" id="crumb">Homework check</div><h1 id="h1">Homework check</h1></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <nav class="seg" aria-label="Homework" style="background:#E9ECEF"><a id="toGive" href="give.html" style="height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;color:var(--ink2);font-weight:500;font-size:14px;text-decoration:none">Give homework</a><a href="#" aria-current="page" style="height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;background:#fff;border:1px solid #99D5D9;color:var(--teal2);font-weight:600;font-size:14px;text-decoration:none">Check homework</a><a id="toWrite" href="writing.html" style="height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;color:var(--ink2);font-weight:500;font-size:14px;text-decoration:none">Writing correction</a></nav>
      <button class="btn" id="bNew" type="button">New check</button>
      <button class="btn pri" id="bShow" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Show on screen</button>
    </div>
  </div>
  <div id="root"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
function crisp(im, w){ let s = im, sw = im.width, sh = im.height; while(sw / 2 >= w * 1.4){ const c2 = document.createElement('canvas'); c2.width = Math.round(sw / 2); c2.height = Math.round(sh / 2); const g2 = c2.getContext('2d'); g2.imageSmoothingEnabled = true; g2.imageSmoothingQuality = 'high'; g2.drawImage(s, 0, 0, c2.width, c2.height); s = c2; sw = c2.width; sh = c2.height; } return s; }   /* 18 Nov: logo shrunk in halves, high-quality smoothing (one big step looked pixelated) */
(function(){
'use strict';
const SB = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TOKEN = (() => { try{ return localStorage.getItem('coe.token') || ''; }catch(e){ return ''; } })();
const Q = new URLSearchParams(location.search);
{ const g = document.getElementById('toGive'); if(g) g.href = 'give.html' + location.search; } { const w = document.getElementById('toWrite'); if(w) w.href = 'writing.html' + location.search; }   /* 2326 */
let CODE = String(Q.get('code') || '').toUpperCase(), NAME = Q.get('n') || '', CLS = Q.get('cls') || '', DAY = Q.get('day') || '', CTIME = Q.get('t') || '', CEND = Q.get('e') || '';
let ME = { name: '', mgmt: false };
let tT = 0; function toast(t, ms){ const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => el.classList.remove('on'), ms || 2600); }
async function api(op, body, ms){
  const ac = new AbortController(), tid = setTimeout(() => ac.abort(), ms || 20000);
  try{ const r = await fetch(SB + 'coe-hw', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ op, token: TOKEN }, body || {})), signal: ac.signal });
    const j = await r.json().catch(() => ({ ok: false, error: 'No answer' })); if(j.error === 'AUTH') throw new Error('Please sign in to the app again, then reopen this page.'); return j; }
  finally{ clearTimeout(tid); } }
const CAT = {
  grammar: { en: 'Grammar', zh: '语法', c: '#1D4ED8', bg: '#EEF2FF', bd: '#C7D2FE', k: '1' },
  spelling: { en: 'Spelling', zh: '拼写', c: '#C2410C', bg: '#FFF7ED', bd: '#FED7AA', k: '2' },
  words: { en: 'Word choice', zh: '用词', c: '#6D28D9', bg: '#F5F3FF', bd: '#DDD6FE', k: '3' },
  punct: { en: 'Punctuation', zh: '标点', c: '#0F766E', bg: '#F0FDFA', bd: '#99F6E4', k: '4' },
  good: { en: 'Well done', zh: '做得好', c: '#15803D', bg: '#F0FDF4', bd: '#BBF7D0', k: '5' },
  note: { en: 'Comment', zh: '批注', c: '#374151', bg: '#fff', bd: '#CFCBDD', k: '6' } };
const ERR = ['grammar', 'spelling', 'words', 'punct'];
const MAC = /Mac|iPhone|iPad|iPod/i.test(navigator.platform || navigator.userAgent || '');   /* 2310: show only this computer's keys */
const KEY = MAC ? '<kbd>⌘ Cmd</kbd> + <kbd>V</kbd>' : '<kbd>Ctrl</kbd> + <kbd>V</kbd>', UNDOK = MAC ? '⌘ Cmd + Z' : 'Ctrl + Z';
const tName = n => { n = String(n || '').replace(/^teacher\s+/i, '').trim(); return n ? 'Teacher ' + n.charAt(0).toUpperCase() + n.slice(1) : ''; };

if(!TOKEN){ $('root').innerHTML = '<div class="card pad" style="max-width:560px;margin:40px auto;text-align:center">Please open Homework check from the CupOfEnglish app on this browser.<br><br><a class="btn pri" href="../">Open the app</a></div>'; return; }

/* ---------- state ---------- */
let MODE = 'text', DIRTY = false, CUR = { id: null }, HIST = [];
const TX = { body: '', parts: [], marks: [], stamps: [] };
const PIC = { base: null, items: [], origSaved: false, cats: { grammar: 0, spelling: 0, words: 0, punct: 0 } };
let SEL = null, EDK = -1, UNDO = [], REDO = [], ZH = { src: '', zh: '' };
const snap = () => JSON.stringify(MODE === 'text' ? TX.marks : PIC.items);
function push(){ UNDO.push({ m: MODE, s: snap() }); if(UNDO.length > 80) UNDO.shift(); REDO = []; dirty(); }
function undo(){ const u = UNDO.pop(); if(!u || u.m !== MODE){ if(u) UNDO.push(u); return; } REDO.push({ m: MODE, s: snap() }); if(MODE === 'text'){ TX.marks = JSON.parse(u.s); closeEd(); renderText(); } else { PIC.items = JSON.parse(u.s); draw(); } side(); }
function redo(){ const u = REDO.pop(); if(!u || u.m !== MODE){ if(u) REDO.push(u); return; } UNDO.push({ m: MODE, s: snap() }); if(MODE === 'text'){ TX.marks = JSON.parse(u.s); closeEd(); renderText(); } else { PIC.items = JSON.parse(u.s); draw(); } side(); }
function dirty(){ DIRTY = true; saveDraft(); }
window.addEventListener('beforeunload', e => { if(DIRTY){ e.preventDefault(); e.returnValue = ''; } });
const DK = () => 'coe.hw.draft.' + CODE;
function saveDraft(){ try{ if(!CODE) return; if(MODE !== 'text' || !TX.body){ return; } localStorage.setItem(DK(), JSON.stringify({ at: Date.now(), id: CUR.id, body: TX.body, marks: TX.marks, stamps: TX.stamps, note: ($('note') || {}).value || '', title: ($('ttl') || {}).value || '' })); }catch(e){} }
function clearDraft(){ try{ localStorage.removeItem(DK()); }catch(e){} }

/* ---------- start ---------- */
(async function start(){
  await Promise.resolve();   /* 2317: run after the whole script has loaded (the stamp and tool lists are defined further down) */
  if(CODE){ layout(); api('me').then(m => { if(m && m.ok) ME = m; else if(m && m.error) toast(m.error, 5000); }).catch(e => toast(e.message, 5000)); return; }   /* 2312: the page opens at once; who you are arrives in the background */
  try{ const m = await api('me'); if(!m.ok) throw new Error(m.error || 'No answer'); ME = m; }catch(e){ $('root').innerHTML = '<div class="card pad" style="max-width:560px;margin:40px auto">' + esc(e.message) + '</div>'; return; }
  picker();
})();

async function picker(){
  $('bNew').style.display = 'none'; $('bShow').style.display = 'none';
  $('root').innerHTML = '<div class="pick card pad"><div class="h2">Whose homework are you checking?</div><input id="pq" placeholder="Search a student or code" autocomplete="off"><div id="pl" class="mute small">Loading your students…</div></div>';
  let L = []; try{ const r = await api('students'); L = r.students || []; }catch(e){ $('pl').textContent = e.message; return; }
  const paint = () => { const q = $('pq').value.trim().toLowerCase(); const M = L.filter(s => !q || s.student.toLowerCase().includes(q) || s.code.toLowerCase().includes(q)).slice(0, 60);
    $('pl').innerHTML = M.length ? M.map(s => '<button class="row" type="button" data-c="' + esc(s.code) + '" data-n="' + esc(s.student) + '"><span><b>' + esc(s.student) + '</b> <span class="mute small">' + esc(s.code) + '</span></span><span class="mute">›</span></button>').join('') : '<div class="mute small" style="padding:10px 0">No student found.</div>';
    $('pl').querySelectorAll('.row').forEach(b => b.onclick = () => { CODE = b.dataset.c; NAME = b.dataset.n; const u = new URL(location.href); u.searchParams.set('code', CODE); u.searchParams.set('n', NAME); history.replaceState(null, '', u); $('bNew').style.display = ''; $('bShow').style.display = ''; layout(); }); };
  $('pq').oninput = paint; paint(); $('pq').focus();
}

function layout(){

    c.fillStyle = '#6F6B85'; c.font = '400 22px ' + F; c.fillText('Student / 学生', 80, y + 22);
    c.fillStyle = '#2B2253'; { const nm = NAME || CODE; let fs = 54; c.font = '400 54px ' + B; while(fs > 26 && c.measureText(nm).width > W - 160){ fs -= 2; c.font = '400 ' + fs + 'px ' + B; } c.fillText(nm, 80, y + 82); }
    c.fillStyle = '#4C4868'; c.font = '400 28px ' + F; c.fillText(idLine, 80, y + 126);
    y += 130 + 44;
    blocks.forEach(b => { b.draw(c, y); y += b.h; });
    const fy = H - 40 - 100; c.fillStyle = '#EEF0F4'; c.fillRect(80, fy + 14, W - 160, 2);
    if(tag){ const tw = 190, th = tw * tag.height / tag.width; c.drawImage(tag, (W - tw) / 2, fy + 16 + (84 - th) / 2, tw, th); }
    c.restore();
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    let copied = false; try{ if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){ await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copied = true; } }catch(e){}
    showPic(blob, copied);
  }catch(e){ toast('The picture could not be made: ' + e.message, 4000); }
  finally{ btn.disabled = false; btn.textContent = lab; } }
function showPic(blob, copied){
  const url = URL.createObjectURL(blob), m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box" role="dialog" aria-label="Picture for the parent/student"><div class="pad" style="padding:14px 16px;border-bottom:1px solid var(--line)"><b>${copied ? 'Picture copied · paste it in WeChat for the parent/student' : 'Picture for the parent/student'}</b></div><div class="sc"><img src="${url}" alt="Homework feedback picture"></div>
<div class="ft"><button type="button" class="btn" id="mX">Close</button><a class="btn" href="${url}" download="Homework-${esc(NAME || CODE)}.png">Save picture</a><button type="button" class="btn pri" id="mC">Copy picture</button></div></div>`;
  document.body.appendChild(m); const close = () => { m.remove(); URL.revokeObjectURL(url); };
  m.onclick = e => { if(e.target === m) close(); }; m.querySelector('#mX').onclick = close;
  m.querySelector('#mC').onclick = async () => { try{ await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('Picture copied · paste it in WeChat'); }catch(e){ toast('Copy is blocked here · use Save picture'); } };
  if(copied) toast('Picture copied · paste it in WeChat'); }
})();
