<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>CupOfEnglish</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CupOfEnglish">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Rockwell,"Rockwell Nova",Georgia,serif;color:#2D2A4A}
.s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.s img{width:96px;height:96px;animation:p 1.4s ease-in-out infinite}
.s b{font-size:18px;letter-spacing:.3px}.s span{font-size:13px;color:#9E9E9E}
@keyframes p{50%{transform:scale(.94);opacity:.8}}
</style>
</head>
<body>
<div class="s" id="s"><img src="icon-192.png" alt=""><b>CupOfEnglish</b><span id="m">Opening…</span></div>
<script>
/* CupOfEnglish app: the screens live here (app.html); data still comes from Apps Script. Kept on the phone so it opens instantly. */
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyqAYrjEQ3CdeTzogP8mZ8tMRx59nV0vMvOHtoQ0wudTBNNXV7YeE_mJPYcqIRhmRbu/exec';
  var KEY = 'coe.app', CK = 'coe-4', CU = 'app-copy.html', cached = null, painted = false;
  try { cached = localStorage.getItem(KEY); } catch (e) {}
  function paint(h) { if (painted) return; painted = true; document.open(); document.write(h); document.close(); }
  function ver(x) { var m = /const COE_V = (\d+);/.exec(x || ''); return m ? +m[1] : 0; }
  function get(u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('bad'); return r.text(); }).then(function (h) { if (h.indexOf('COE_API') < 0) throw new Error('bad'); return h; }); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  /* 20 Oct · the app is ~2.5 million characters: Safari and iPhones allow a site only about 5 MB of this storage, so the saved copy did not
     fit and those browsers stayed on an old version. The copy now goes to the browser's file storage (Cache Storage, much larger) when it
     does not fit; if neither works, no copy is kept and the newest loads from the internet each time. */
  function cGet() { try { return caches.open(CK).then(function (c) { return c.match(CU); }).then(function (r) { return r ? r.text() : null; }).catch(function () { return null; }); } catch (e) { return Promise.resolve(null); } }
  function cPut(h) { try { return caches.open(CK).then(function (c) { return c.put(CU, new Response(h, { headers: { 'Content-Type': 'text/html;charset=utf-8' } })); }).catch(function () {}); } catch (e) { return Promise.resolve(); } }
  function save(h) {
    try { localStorage.setItem(KEY, h); return true; } catch (e) {}
    try { localStorage.removeItem(KEY); localStorage.setItem(KEY, h); return true; } catch (e) {}
    try { localStorage.removeItem(KEY); } catch (e) {}
    cPut(h); return false;
  }
  var net = get('app.html').catch(function () { return get(API + '?app=1'); });   // backup: the old Apps Script copy
  function boot(have) {
    net.then(function (h) {
      if (h !== have && ver(h) >= ver(have)) { save(h); if (!have) paint(h); }   // a newer version shows next time · never step back to an older copy (stale CDN or the old backup)
    }).catch(function () { if (!have && !painted) document.getElementById('m').textContent = 'No connection. Check your internet and reopen.'; });
    if (have) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { paint(have); }); else paint(have); }
  }
  if (cached) boot(cached);
  else cGet().then(function (c) { boot(c && c.indexOf('COE_API') > -1 ? c : null); });
})();
</script>
</body>
</html>
