<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>CupOfEnglish</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CupOfEnglish">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:Rockwell,"Rockwell Nova",Georgia,serif;color:#2D2A4A}
.s{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.s img{width:96px;height:96px;animation:p 1.4s ease-in-out infinite}
.s b{font-size:18px;letter-spacing:.3px}.s span{font-size:13px;color:#9E9E9E}
@keyframes p{50%{transform:scale(.94);opacity:.8}}
</style>
</head>
<body>
<div class="s" id="s"><img src="icon-192.png" alt=""><b>CupOfEnglish</b><span id="m">Opening…</span></div>
<script>
/* CupOfEnglish app: the screens come from Apps Script (always the latest), kept on the phone so it opens instantly. */
var API = 'https://script.google.com/macros/s/AKfycbyqAYrjEQ3CdeTzogP8mZ8tMRx59nV0vMvOHtoQ0wudTBNNXV7YeE_mJPYcqIRhmRbu/exec';
var KEY = 'coe.app', cached = null;
try { cached = localStorage.getItem(KEY); } catch (e) {}
function show(h) { document.open(); document.write(h); document.close(); }
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
fetch(API + '?app=1', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (h) {
  if (h.indexOf('COE_API') < 0) throw new Error('bad');
  if (h !== cached) { try { localStorage.setItem(KEY, h); } catch (e) {} if (!cached) show(h); }   // new version shows next time
}).catch(function () { if (!cached) document.getElementById('m').textContent = 'No connection. Check your internet and reopen.'; });
if (cached) show(cached);
</script>
</body>
</html>
