<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk of the Day · CupOfEnglish</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--ink:#2B2253;--mute:#6B6880;--line:#ECEAF2;--bg:#F7F6FA;--teal:#2E6E77;--teal2:#E6F2F3;--coral:#D4705A;--card:#fff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'COE Card Inter',Inter,system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#00838C}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:5}
header img{height:32px}
header .sep{width:1px;height:30px;background:var(--line)}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16px}
header .tt span{display:block;font-size:13px;color:var(--mute)}
.btn{height:40px;padding:0 18px;border-radius:999px;border:1px solid #CFE3E5;background:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#F6FAFA}
.btn.pr{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pr:hover{background:#255C64}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
h1{font-family:'COE Card Fredoka',Fredoka,sans-serif;font-weight:400;font-size:30px;margin:0}
.sub{font-size:14px;color:var(--mute);margin:4px 0 0}
.lb{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap}
.lb.new{background:var(--coral);color:#fff;font-weight:700;font-size:11px}
.s-china{background:#E4F4F1;color:#1E6F5C}.s-stem{background:#E6EEFB;color:#2B4C8C}.s-ai{background:#F0E8FB;color:#5B3A8C}.s-think{background:#FCEDE8;color:#B5432C}.s-world{background:#FFF1D6;color:#8A5A00}.s-culture{background:#FDECEF;color:#9C2F52}.s-education{background:#E9F1E4;color:#3B6326}.s-travel{background:#E3F1FA;color:#1D5A80}.s-daily{background:#F3EFE6;color:#5E4F27}.s-food{background:#FFEDE0;color:#8F4310}.s-sport{background:#E3F4EA;color:#1F6236}.s-nature{background:#EDF6E4;color:#3A6420}
.l-early{background:#FDEDE6;color:#9A4528;font-weight:700}.l-yle{background:#E4F4F1;color:#1E6F5C;font-weight:700}.l-teens{background:#E6EEFB;color:#2B4C8C;font-weight:700}.l-adults{background:#F0E8FB;color:#5B3A8C;font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 16px}
.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button small{font-weight:500;opacity:.7;margin-left:4px}
.seg button.on{background:var(--ink);color:#fff}
.vr{width:1px;height:26px;background:var(--line);margin:0 4px}
.chipb{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.chipb.on{border-color:var(--ink);background:var(--ink);color:#fff}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;width:280px;background:#fff;border:1px solid var(--line);border-radius:12px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:0 1px 2px rgba(43,34,83,.04)}
.tc{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tc:hover{border-color:#CFE3E5}
.tc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tc .dt{margin-left:auto;font-size:12px;color:var(--mute)}
.tc b.t{font-size:16px;line-height:1.35}
.tc .zh{font-size:12px;color:#8A869C}
.tc .ft{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.tc .ft .used{color:#1E6F5C}
.sect{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sect b{font-size:17px}
.cnt{background:var(--coral);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:18px 0}
/* topic */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:22px;align-items:start;margin-top:16px}
.story{font-size:19px;line-height:1.65;margin:0}
.storyzh{font-size:14px;line-height:1.7;color:#7A7690;margin:0}
.zhw{color:#8A869C;font-weight:400;font-size:.85em}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words>span,.wch{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;color:var(--ink)}
.phr{border:1px solid #E6EEFB;background:#F5F8FE;border-radius:12px;padding:5px 12px;font-size:14px}.st .phr{font-size:17px}
.wch:hover{border-color:#9AD3D6;background:#F6FBFB}
.wch.ph{padding:4px 14px 4px 4px}.wch img{width:34px;height:34px;border-radius:999px;object-fit:cover}
.st .wch{font-size:18px}.st .wch.ph img{width:44px;height:44px}
.fl{position:fixed;inset:0;z-index:60;background:rgba(30,26,60,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.flc{background:#fff;border-radius:24px;padding:22px;max-width:640px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 30px 60px -20px rgba(30,26,60,.5)}
.flc img{width:100%;max-height:52vh;object-fit:contain;border-radius:16px;background:#F7F6FA}
.flc b{font-family:'COE Card Fredoka',Fredoka,sans-serif;font-weight:400;font-size:64px;line-height:1.1;margin-top:6px}
.flc .zhw{font-size:22px}.flc small{font-size:9.5px;color:#B9B6C6;letter-spacing:.01em}
.fln{display:flex;gap:8px;align-items:center;margin-top:8px}.fln span{font-size:13px;color:var(--mute);min-width:44px;text-align:center}
.lvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px;background:#F4F2F8;border-radius:16px;padding:4px}
.lvg button{border:0;border-radius:12px;background:transparent;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;font-size:14px;color:var(--ink)}
.lvg button small{font-weight:500;font-size:11.5px;opacity:.7}
.lvg button.on{background:var(--ink);color:#fff}
.use{display:grid;grid-template-columns:1fr 1fr;gap:8px}.use .full{grid-column:1/-1}.use select{max-width:none;width:100%}.use .btn{justify-content:center;width:100%}
.libh{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.libh .search{margin-left:auto}
.qs{display:flex;flex-direction:column;gap:10px}
.q{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.5}
.q i{flex:none;width:26px;height:26px;border-radius:999px;background:#E4F4F1;color:#1E6F5C;font-size:13px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center}
.think{background:#FDF5F2;border:1px solid #F1D9D2;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.5}
.tryh{background:#EEF6F7;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.5}
.k{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mute)}
.src{font-size:13px;color:var(--mute);line-height:1.6}
.src a{word-break:break-word}
.facts{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.45;color:#4A4566;margin-top:8px}
.facts .f{display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.facts .src{font-size:11.5px}.facts .src a{color:#2E6E77;text-decoration:none}.facts .src a:hover{text-decoration:underline}
details.fs summary{cursor:pointer;font-size:13px;font-weight:600;color:#4A4566;list-style:none;display:flex;align-items:center;gap:8px}
details.fs summary::-webkit-details-marker{display:none}
details.fs summary .chev{margin-left:auto;color:#8A869C;transition:transform .2s}
details.fs[open] summary .chev{transform:rotate(90deg)}
.facts .f.bad{background:#FCEDE8;color:#B5432C}
.draftbar{display:flex;gap:12px;align-items:center;background:#FFF8EA;border:1px solid #F3DFB2;border-radius:14px;padding:8px 10px 8px 14px;margin-top:6px;flex-wrap:wrap}
.media{border-radius:12px;overflow:hidden;background:#EEF6F7}
.media video{width:100%;display:block}
select{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:14px;max-width:240px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
/* student page and class (full screen) */
.st{max-width:1180px;margin:0 auto;padding:26px 28px 40px}
.st h2{font-family:'COE Card Fredoka',Fredoka,sans-serif;font-weight:400;font-size:38px;line-height:1.15;margin:8px 0 4px}
.st .zt{font-size:15px;color:#8A869C;margin:0 0 16px}
.st .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.st .story{font-size:21px}
.foot{max-width:1180px;margin:0 auto;padding:14px 28px 30px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line)}
body.present header .ctl{display:none}
@media (max-width:860px){.tp,.st .cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.search{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
  <img src="../reader/logo.png" alt="CupOfEnglish">
  <div class="sep"></div>
  <div class="tt"><b id="hT">Talk of the Day / 今日话题</b><span id="hS">Class openers for YLE, Teens and Adults</span></div>
  <div class="ctl" id="hBtns" style="display:flex;gap:8px"></div>
</header>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="../homework/hdr.js"></script>
<script>
(function(){
const API = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/';
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id), app = $('app');
const TOKEN = (() => { try{ return localStorage.getItem('coe.token') || ''; }catch(e){ return ''; } })();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ST = { china: 'Today in China', stem: 'STEM / STEAM', ai: 'AI literacy', think: 'Critical thinking', world: 'Real-world talk', culture: 'Culture & festivals', education: 'Education', travel: 'Travel', daily: 'Daily life', food: 'Food', sport: 'Sport', nature: 'Nature & animals' };
const LV = { early: 'Early years', yle: 'YLE', teens: 'Teens', adults: 'Adults' }, LVZ = { early: '幼儿', yle: '少儿', teens: '青少年', adults: '成人' };
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const mnl = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dShort = d => { const x = new Date(d + 'T00:00:00Z'); return isNaN(x) ? '' : WD[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + MO[x.getUTCMonth()]; };
const age = d => Math.round((Date.parse(mnl() + 'T00:00:00Z') - Date.parse(d + 'T00:00:00Z')) / 864e5);
const fresh = d => { const a = age(d); return a <= 7 ? 'week' : a <= 30 ? 'month' : 'earlier'; };
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); }
async function call(fn, body){ const r = await fetch(API + fn, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({ ok: false, error: 'No answer. Try again.' })); if(!j.ok) throw new Error(j.error || 'Not saved'); return j; }
const AGE = { early: 'ages 3–7', yle: 'ages 7–12' };
const CE = ['Pre-A1','A1','A2','B1','B2','C1','C2'];
const ceRange = c => { const p = String(c || '').split('–').map(x => CE.indexOf(x.trim())).filter(i => i >= 0); return p.length ? [Math.min(...p), Math.max(...p)] : null; };
const ceOf = (t, k) => (t.cefr && t.cefr[k]) || '';
const phOf = (t, L) => L === 'early' ? (t.phrases_early || []) : (t.phrases || []);
const phrHtml = (t, L) => !phOf(t, L).length ? '' : '<div class="k">' + (L === 'early' ? 'SAY IT TOGETHER · 一起说' : 'USEFUL PHRASES · 常用短语') + '</div><div class="words">' + phOf(t, L).map(w => '<span class="phr"><b>' + esc(w.en) + '</b>' + (w.zh ? ' <span class="zhw">' + esc(w.zh) + '</span>' : '') + '</span>').join('') + '</div>';
const chipsHtml = (t, L) => wordsOf(t, L).map((w, i) => '<button type="button" class="wch' + (w.img ? ' ph' : '') + '" data-wi="' + i + '" aria-label="Show ' + esc(w.en) + '">' + (w.img ? '<img src="' + esc(w.img) + '" alt="" loading="lazy">' : '') + '<b>' + esc(w.en) + '</b>' + (w.zh ? ' <span class="zhw">' + esc(w.zh) + '</span>' : '') + '</button>').join('');
function flash(L0, i){ let k = i; const box = document.createElement('div'); box.className = 'fl'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); document.body.appendChild(box);
  const paint = () => { const w = L0[k]; box.innerHTML = '<div class="flc">' + (w.img ? '<img src="' + esc(w.img) + '" alt="' + esc(w.en) + '">' : '') + '<b>' + esc(w.en) + '</b>' + (w.zh ? '<span class="zhw">' + esc(w.zh) + '</span>' : '') + (w.credit ? '<small>' + esc(w.credit) + '</small>' : '')
    + '<div class="fln"><button type="button" class="btn sm" data-m="-1"' + (k ? '' : ' disabled') + '>‹ Back</button><span>' + (k + 1) + ' / ' + L0.length + '</span><button type="button" class="btn sm" data-m="1"' + (k < L0.length - 1 ? '' : ' disabled') + '>Next ›</button><button type="button" class="btn sm pr" data-x="1">Close</button></div></div>';
    box.querySelectorAll('[data-m]').forEach(b => b.onclick = e => { e.stopPropagation(); k = Math.max(0, Math.min(L0.length - 1, k + +b.dataset.m)); paint(); }); box.querySelector('[data-x]').onclick = close; };
  const key = e => { if(e.key === 'Escape') close(); else if(e.key === 'ArrowRight' && k < L0.length - 1){ k++; paint(); } else if(e.key === 'ArrowLeft' && k){ k--; paint(); } };
  function close(){ box.remove(); document.removeEventListener('keydown', key, true); }
  box.onclick = e => { if(e.target === box) close(); }; document.addEventListener('keydown', key, true); paint(); }
function bindChips(root, t, L){ root.querySelectorAll('.wch').forEach(b => b.onclick = () => flash(wordsOf(t, L), +b.dataset.wi)); }
const wordsOf = (t, k) => (k === 'early' && (t.words_early || []).length) ? t.words_early : (t.words || []);
const lvChips = (L, t) => (L || []).map(k => '<span class="lb l-' + k + '">' + LV[k] + (t && ceOf(t, k) ? ' · ' + esc(ceOf(t, k)) : '') + '</span>').join('');
const stChip = s => '<span class="lb s-' + esc(s) + '">' + esc(ST[s] || s) + '</span>';
const srcLine = S => (S || []).filter((s, i, a) => a.findIndex(x => x.outlet === s.outlet) === i).map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.outlet) + (s.date ? ', ' + esc(s.date) : '') + '</a>').join(' · ');

let D = null, F = { fresh: 'week', lv: '', st: '', q: '', ce: '' }, STU = null;

/* ── Student page (shared link) and class view: no sign-in needed ── */
function studentHtml(t, lv, who){
  const L = (t.levels || []).includes(lv) ? lv : (t.levels || ['yle'])[0], qs = (t.q && t.q[L]) || [], th = t.think && t.think[L];
  return '<div class="st"><div style="display:flex;gap:6px;flex-wrap:wrap">' + stChip(t.strand) + '<span class="lb l-' + L + '">' + LV[L] + ' · ' + LVZ[L] + (ceOf(t, L) ? ' · CEFR ' + esc(ceOf(t, L)) : '') + '</span></div>'
    + '<h2>' + esc(t.title) + '</h2>' + (t.title_zh ? '<p class="zt">' + esc(t.title_zh) + '</p>' : '')
    + '<div class="cols"><div class="card" style="display:flex;flex-direction:column;gap:14px;padding:22px 26px">'
    + (t.media_url ? mediaHtml(t) : '')
    + (L === 'early' ? (t.phonics ? '<div class="k">SOUND OF THE DAY · 今日发音</div><div style="font-size:30px;font-weight:700">' + esc(t.phonics) + '</div>' : '') : '<p class="story">' + esc(t.story) + '</p>' + (t.story_zh ? '<p class="storyzh">' + esc(t.story_zh) + '</p>' : ''))
    + (wordsOf(t, L).length ? '<div class="k">' + (L === 'early' ? 'SAY IT · 跟我说' : 'NEW WORDS · 新单词') + '</div><div class="words">' + chipsHtml(t, L) + '</div>' + phrHtml(t, L) : '')
    + '</div><div style="display:flex;flex-direction:column;gap:14px">'
    + (qs.length ? '<div class="card qs"><b style="font-size:18px">' + (L === 'early' ? 'Point and say · 指一指，说一说' : 'Let\'s talk · 一起聊聊') + '</b>' + qs.map((x, i) => '<div class="q"><i>' + (i + 1) + '</i><span>' + esc(x) + '</span></div>').join('') + '</div>' : '')
    + (th ? '<div class="think"><span class="lb s-think" style="align-self:flex-start;font-weight:700">THINK · 想一想</span><span>' + esc(th) + '</span></div>' : '')
    + (t.try_home ? '<div class="tryh"><span class="lb" style="background:#fff;color:#2E6E77;font-weight:700;align-self:flex-start">TRY AT HOME · 在家试试</span><span>' + esc(t.try_home) + '</span>' + (t.try_home_zh ? '<span style="color:#8A869C;font-size:13px">' + esc(t.try_home_zh) + '</span>' : '') + '</div>' : '')
    + '</div></div></div>'
    + '<div class="foot"><span>Source / 来源: ' + srcLine(t.sources) + '</span></div>';
}
function mediaHtml(t){ const u = t.media_url; if(/\.(mp4|webm)(\?|$)/i.test(u)) return '<div class="media"><video src="' + esc(u) + '" controls playsinline preload="metadata"></video></div>';
  return '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener" style="align-self:flex-start"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Watch the video</a>'; }

/* ── Picture for WeChat: same letterhead as the homework pictures ── */
let LOGO = null; { const im = new Image(); im.onload = () => { LOGO = im; }; im.src = '../reader/logo.png'; }
function wrap(g, text, maxW){ const out = []; String(text || '').split(/\n/).forEach(par => { const toks = par.match(/[㐀-鿿　-〿＀-￯]|[^\s㐀-鿿　-〿＀-￯]+|\s+/g) || []; let line = '';
  toks.forEach(tk => { const t2 = line + tk; if(g.measureText(t2).width > maxW && line.trim()){ out.push(line.trim()); line = /^\s+$/.test(tk) ? '' : tk; } else line = t2; }); if(line.trim()) out.push(line.trim()); }); return out; }
const PC = { china: ['#E4F4F1', '#1E6F5C'], stem: ['#E6EEFB', '#2B4C8C'], ai: ['#F0E8FB', '#5B3A8C'], think: ['#FCEDE8', '#B5432C'], world: ['#FFF1D6', '#8A5A00'], culture: ['#FDECEF', '#9C2F52'], education: ['#E9F1E4', '#3B6326'], travel: ['#E3F1FA', '#1D5A80'], daily: ['#F3EFE6', '#5E4F27'], food: ['#FFEDE0', '#8F4310'], sport: ['#E3F4EA', '#1F6236'], nature: ['#EDF6E4', '#3A6420'] };
const LC = { early: ['#FDEDE6', '#9A4528'], yle: ['#E4F4F1', '#1E6F5C'], teens: ['#E6EEFB', '#2B4C8C'], adults: ['#F0E8FB', '#5B3A8C'] };
function picture(t, lv, who){

    + '</div></div></main>';
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { CLV = b.dataset.l; paintTopic(); });
  bindChips(app, t, L);
  if($('bAp')) $('bAp').onclick = async () => { const b = $('bAp'); b.disabled = true; try{ await call('coe-talk', { token: TOKEN, op: 'approve', id: t.id }); t.status = 'approved'; toast('Approved. Teachers see it now.'); paintTopic(); }catch(e){ b.disabled = false; toast(e.message); } };
  if($('bRet')) $('bRet').onclick = async () => { if(!confirm('Take this topic out of the library? It is kept, not deleted.')) return; try{ await call('coe-talk', { token: TOKEN, op: 'retire', id: t.id }); D.topics = D.topics.filter(x => x.id !== t.id); toast('Taken out of the library.'); history.pushState({}, '', location.pathname); paintLib(); }catch(e){ toast(e.message); } };
  if($('stuSel')){ students().then(L2 => { const s = $('stuSel'); if(!s) return; s.innerHTML = '<option value="">Choose your student</option>' + L2.map(x => '<option value="' + esc(x.code) + '">' + esc(x.student) + ' · ' + esc(x.code) + '</option>').join(''); const k = sessionStorage.getItem('coe.talk.stu'); if(k) s.value = k; s.onchange = () => sessionStorage.setItem('coe.talk.stu', s.value); }); }
  const pick = () => { const s = $('stuSel'), code = s ? s.value : '', nm = s && s.value ? s.options[s.selectedIndex].text.split(' · ')[0] : ''; return { code, nm }; };
  const mark = p => { if(!p.code) return; call('coe-talk', { token: TOKEN, op: 'use', id: t.id, code: p.code, student: p.nm }).then(() => { D.used = (D.used || []).filter(u => !(u.topic === t.id && u.code === p.code)).concat([{ topic: t.id, code: p.code, student: p.nm, at: new Date().toISOString() }]); }).catch(() => {}); };
  if($('bCopy')) $('bCopy').onclick = async () => { const p = pick(); await copyPic(t, CLV, p.nm); mark(p); };
  if($('bLink')) $('bLink').onclick = async () => { const p = pick(), u = location.origin + location.pathname + '?id=' + t.id + '&lv=' + CLV + (p.nm ? '&s=' + encodeURIComponent(p.nm) : '');
    try{ await navigator.clipboard.writeText(u); toast('Link copied.'); }catch(e){ prompt('Copy this link', u); } mark(p); };
  if($('bPres')) $('bPres').onclick = () => { const p = pick(); mark(p); present(t, CLV, p.nm); };
}
function present(t, lv, who){ document.body.classList.add('present'); $('hT').textContent = 'Talk of the Day / 今日话题'; $('hS').textContent = (who ? 'For / 学生: ' + who + ' · ' : '') + dShort(t.day);
  $('hBtns').innerHTML = '<button class="btn sm" id="bX" type="button">Close</button>'; app.innerHTML = studentHtml(t, lv, who); bindChips(app, t, (t.levels || []).includes(lv) ? lv : (t.levels || ['yle'])[0]);
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }catch(e){}
  const close = () => { document.body.classList.remove('present'); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} paintTopic(); document.removeEventListener('keydown', esc1); };
  const esc1 = e => { if(e.key === 'Escape') close(); }; document.addEventListener('keydown', esc1); $('bX').onclick = close; }

/* ── start ── */
async function start(){
  const pid = Q.get('id');
  if(pid){ document.body.classList.add('present');
    try{ const j = await call('coe-talk', { op: 'pub', id: pid }), t = j.topic, who = Q.get('s') || ''; $('hS').textContent = (who ? 'For / 学生: ' + who + ' · ' : '') + dShort(t.day); const lv0 = Q.get('lv') || 'yle'; app.innerHTML = studentHtml(t, lv0, who); bindChips(app, t, (t.levels || []).includes(lv0) ? lv0 : (t.levels || ['yle'])[0]); document.title = t.title + ' · CupOfEnglish'; }
    catch(e){ app.innerHTML = '<main><div class="empty">This topic is not available.</div></main>'; } return; }
  if(!TOKEN){ app.innerHTML = '<main><h1>Talk library</h1><p class="sub">Open it from the CupOfEnglish app (you need to be signed in).</p><p><a class="btn pr" href="../app.html">Open the app</a></p></main>'; return; }
  app.innerHTML = '<main><div class="empty">Loading…</div></main>';
  try{ D = await call('coe-talk', { token: TOKEN, op: 'list' }); }catch(e){ app.innerHTML = '<main><div class="empty">' + (/AUTH/.test(e.message) ? 'Please sign in to the app again, then reopen this page.' : esc(e.message)) + '</div></main>'; return; }
  const tid = Q.get('t'); if(tid) openTopic(tid, false); else paintLib(); }
window.addEventListener('popstate', () => { const tid = new URLSearchParams(location.search).get('t'); if(D){ if(tid) openTopic(tid, false); else paintLib(); } });
start();
})();
</script>
