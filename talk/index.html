    if(x.k === 'assess') return '<div style="grid-column:1/-1"><div class="kk" style="margin-bottom:8px">Assessment · 评分标准</div><div class="krow4">' + RUB.map(r => '<div><b>' + esc(r[0]) + '</b>' + r[1].map(q => '<p>' + esc(q) + '</p>').join('') + '</div>').join('') + '</div></div>';
    if(x.k === 'p1') return '<div class="kpanel"><div class="kk">Part 1 · ' + esc(x.it.topic) + ' · question ' + (x.n + 1) + ' of ' + x.of + '</div><div class="kq"><span style="font-size:clamp(24px,2vw,34px);font-weight:600">' + esc(x.it.q) + '</span></div>' + str('a') + usedLine(x.it.ph) + mbtn() + model('a', x.it.m) + '</div><div class="kpanel"><div class="kk">Words and phrases to use · 可用表达 <span style="text-transform:none;letter-spacing:0;font-weight:400">· tap one to explain</span></div>' + ph(x.it.ph, x) + '</div>';
    if(x.k === 'p2') return '<div class="kpanel"><div class="kk">Part 2 · cue card' + (x.of > 1 ? ' ' + (x.n + 1) + ' of ' + x.of + (x.n ? ' · spare card' : '') : '') + ' · 1 min to prepare, up to 2 min to speak</div><div class="kcue"><b>' + esc(x.it.task) + '</b><div style="margin-top:8px">You should say:</div><ul>' + x.it.points.map(p => '<li>' + esc(p) + '</li>').join('') + '</ul><div>' + esc(x.it.explain) + '</div></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn pr" type="button" id="kPrep">1 min to prepare</button><button class="btn" type="button" id="kSpeak">Speak · 2 min</button><span class="ktm" id="kMini"></span></div></div>'
      + '<div class="kpanel"><div class="kk">Plan your 2 minutes · P–P–F</div><div class="kmod f" style="border:0;padding:0"><b style="color:#3C3489">P</b><span><b>Past</b> · ' + esc(x.it.ppf[0]) + '</span><b style="color:#3C3489">P</b><span><b>Present</b> · ' + esc(x.it.ppf[1]) + '</span><b style="color:#3C3489">F</b><span><b>Future</b> · ' + esc(x.it.ppf[2]) + '</span></div><div class="kk" style="margin-top:6px">Useful language · 可用表达 <span style="text-transform:none;letter-spacing:0;font-weight:400">· tap one to explain</span></div>' + ph(x.it.ph, x) + '</div>';
    if(x.k === 'p3') return '<div class="kpanel"><div class="kk">Part 3 · discussion · question ' + (x.n + 1) + ' of ' + x.of + '</div><div class="kq"><span style="font-size:clamp(24px,2vw,34px);font-weight:600">' + esc(x.it.q) + '</span></div>' + str('p') + usedLine(x.it.ph) + mbtn() + model('p', x.it.m) + '</div><div class="kpanel"><div class="kk">Words and phrases to use · 可用表达 <span style="text-transform:none;letter-spacing:0;font-weight:400">· tap one to explain</span></div>' + ph(x.it.ph, x) + '</div>';
    return '<div style="grid-column:1/-1"><div class="kk" style="margin-bottom:8px">Feedback · 课堂反馈</div><div class="krow4">' + RUB.map(r => '<div><b>' + esc(r[0]) + '</b>' + r[1].map(q => '<p>' + esc(q) + '</p>').join('') + '</div>').join('') + '</div><div class="kpanel" style="margin-top:12px">' + ['One thing you did well today:', 'One structure to use more (A–R–E, P–P–F or P–R–E–L):', 'One thing to practise before next class:'].map((q, i) => '<div class="kq"><i>' + (i + 1) + '</i><span>' + esc(q) + '</span></div>').join('') + '</div>'
      + (() => { const U = Object.keys(used).filter(p => used[p]), T = Object.keys(seen).filter(p => !used[p]); if(!U.length && !T.length) return ''; return '<div class="kpanel" style="margin-top:12px"><div class="kk">Words and phrases today</div>' + (U.length ? '<div class="sub" style="margin:0">Used well</div><div class="kph">' + U.map(p => '<span class="kpc used">' + esc(p) + '</span>').join('') + '</div>' : '') + (T.length ? '<div class="sub" style="margin:6px 0 0">Practise next class</div><div class="kph">' + T.slice(0, 12).map(p => '<span class="kpc">' + esc(p) + '</span>').join('') + '</div>' : '') + '</div>'; })() + '</div>'; }
  function teacher(){ if(!notes) return ''; return notesHtml(RUB, marks, cmt); }
  function paint(){ const x = S[si], phn = x.ph;
    app.innerHTML = '<div class="kv"><div class="khd"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="lb" style="background:#E6EEFB;color:#2B4C8C">IELTS Speaking · ' + esc(t.theme) + ' · ' + esc(t.zh) + '</span></div><div style="display:flex;align-items:center;gap:10px"><span class="ktm" id="kT">' + mm(left) + '</span><button class="btn sm" type="button" id="kRun">' + (run ? 'Pause' : 'Start') + '</button></div></div>'
      + '<div class="kbar">' + P.map((p, i) => '<i class="' + (i < phn ? 'd' : i === phn ? 'c' : '') + '" style="flex:' + p[2] + '"></i>').join('') + '</div><div class="klab">' + P.map(p => '<span style="flex:' + p[2] + '">' + esc(p[1]) + ' · ' + p[2] + '</span>').join('') + '</div>'
      + '<h2>' + esc(P[phn][1]) + '</h2><p class="zt">' + esc(t.theme) + (t.zh ? ' · ' + esc(t.zh) : '') + '</p>'
      + '<div class="kcols">' + body(x) + '</div>' + teacher() + '</div>'
      + '<div class="knav"><button class="btn" type="button" id="kB"' + (si ? '' : ' disabled') + '>‹ Back</button><span class="sub" style="margin:0;align-self:center">' + (si + 1) + ' of ' + S.length + '</span><button class="btn pr" type="button" id="kN">' + (si < S.length - 1 ? 'Next ›' : 'Finish') + '</button><button class="btn" type="button" id="kNotes">' + (notes ? 'Hide teacher notes' : 'Teacher notes') + '</button><button class="btn" type="button" id="kPic">Copy picture</button></div>';
    $('kRun').onclick = () => { run = !run; paint(); };
    $('kB').onclick = () => go(si - 1); $('kN').onclick = () => { if(si < S.length - 1) go(si + 1); else close(); };
    $('kNotes').onclick = () => { notes = !notes; paint(); if(notes){ const n = $('kNotesP'); if(n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); } };
    $('kPic').onclick = () => copyKitPic(ieltsSpec(t), 'ielts-speaking');
    if($('kCm')) $('kCm').oninput = e => { cmt = e.target.value; };
    try{ window.CoeInk && CoeInk.page(app.querySelector('.kv'), 'ielts:' + t.id + ':' + si); }catch(e){}
    if($('kShow')) $('kShow').onclick = () => { show = !show; paint(); };
    app.querySelectorAll('[data-pi]').forEach(b => b.onclick = () => { const i = +b.dataset.pi; open = open === i ? -1 : i; paint(); });
    app.querySelectorAll('[data-pclose]').forEach(b => b.onclick = () => { open = -1; paint(); });
    if($('kUsed')) $('kUsed').onclick = () => { const p = S[si].it.ph[open]; used[p] = !used[p]; paint(); };
    app.querySelectorAll('[data-rb]').forEach(b => b.onclick = () => { const [i, n] = b.dataset.rb.split(':').map(Number); marks[i] = marks[i] === n ? 0 : n; paint(); });
    if($('kPrep')) $('kPrep').onclick = () => miniRun(60, 'Speak now');
    if($('kSpeak')) $('kSpeak').onclick = () => miniRun(120, 'Time');
    const el = $('kT'); if(el) el.style.color = left < 0 ? '#B5432C' : ''; }
  function miniRun(sec, endTxt){ clearInterval(mini); let s = sec; const sh = () => { const el = $('kMini'); if(el) el.textContent = s > 0 ? mm(s) : endTxt; }; sh(); mini = setInterval(() => { s--; sh(); if(s <= 0) clearInterval(mini); }, 1000); }
  function go(i){ if(i < 0 || i >= S.length) return; const ch = S[i].ph !== S[si].ph; si = i; show = false; open = -1; if(ch) left = P[S[i].ph][2] * 60; clearInterval(mini); paint(); window.scrollTo(0, 0); }
  const tick = setInterval(() => { if(!run) return; left--; const el = $('kT'); if(el){ el.textContent = mm(left); el.style.color = left < 0 ? '#B5432C' : ''; } }, 1000);
  const key = e => { if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return; if(e.key === 'ArrowRight') go(si + 1); else if(e.key === 'ArrowLeft') go(si - 1); else if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  function close(){ const SP = Object.keys(seen); saveSpeak({ kind: 'ielts', id: t.id, title: 'IELTS · ' + t.theme + ' · ' + t.p2[0].task.replace(/^Describe /, '').replace(/\.$/, ''), len: +len, marks, comment: cmt, used: SP.filter(p => used[p]), practise: SP.filter(p => !used[p]).slice(0, 12) });
    try{ window.CoeInk && CoeInk.close(); }catch(e){} clearInterval(tick); clearInterval(mini); document.removeEventListener('keydown', key); document.body.classList.remove('present'); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} paintKit('ielts'); }
  try{ window.CoeInk && CoeInk.open(); }catch(e){} paint(); $('bX').onclick = close; }

/* ── start ── */
async function start(){
  const pid = Q.get('id');
  if(pid){ document.body.classList.add('present');
    try{ const j = await call('coe-talk', { op: 'pub', id: pid }), t = j.topic, who = Q.get('s') || ''; $('hS').textContent = (who ? 'For / 学生: ' + who + ' · ' : '') + dShort(t.day); const lv0 = Q.get('lv') || 'yle'; app.innerHTML = studentHtml(t, lv0, who); bindChips(app, t, (t.levels || []).includes(lv0) ? lv0 : (t.levels || ['yle'])[0]); document.title = t.title + ' · CupOfEnglish'; }
    catch(e){ app.innerHTML = '<main><div class="empty">This topic is not available.</div></main>'; } return; }
  if(!TOKEN){ app.innerHTML = '<main><h1>Talk library</h1><p class="sub">Open it from the CupOfEnglish app (you need to be signed in).</p><p><a class="btn pr" href="../app.html">Open the app</a></p></main>'; return; }
  app.innerHTML = '<main><div class="empty">Loading…</div></main>';
  try{ D = await call('coe-talk', { token: TOKEN, op: 'list' }); }catch(e){ app.innerHTML = '<main><div class="empty">' + (/AUTH/.test(e.message) ? 'Please sign in to the app again, then reopen this page.' : esc(e.message)) + '</div></main>'; return; }
  const tid = Q.get('t'), kit = Q.get('kit'); if(tid) openTopic(tid, false); else if(kit === 'free' || kit === 'ielts') paintKit(kit); else if(Q.get('lib')) paintLib(); else paintDash(); }
window.addEventListener('popstate', () => { const P = new URLSearchParams(location.search), tid = P.get('t'); if(D){ document.body.classList.remove('present'); const kit = P.get('kit'); if(tid) openTopic(tid, false); else if(kit === 'free' || kit === 'ielts') paintKit(kit); else if(P.get('lib')) paintLib(); else paintDash(); } });
start();
})();
</script>
