<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talk of the Day · CupOfEnglish</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--ink:#2B2253;--mute:#6B6880;--line:#ECEAF2;--bg:#F7F6FA;--teal:#2E6E77;--teal2:#E6F2F3;--coral:#D4705A;--card:#fff;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'COE Card Inter',Inter,system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:#00838C}
header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:5}
header img{height:32px}
header .sep{width:1px;height:30px;background:var(--line)}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:16px}
header .tt span{display:block;font-size:13px;color:var(--mute)}
.btn{height:40px;padding:0 18px;border-radius:999px;border:1px solid #CFE3E5;background:#fff;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#F6FAFA}
.btn.pr{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pr:hover{background:#255C64}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1180px;margin:0 auto;padding:24px 28px 60px}
h1{font-family:'COE Card Fredoka',Fredoka,sans-serif;font-weight:400;font-size:30px;margin:0}
.sub{font-size:14px;color:var(--mute);margin:4px 0 0}
.lb{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap}
.lb.new{background:var(--coral);color:#fff;font-weight:700;font-size:11px}
.s-china{background:#E4F4F1;color:#1E6F5C}.s-stem{background:#E6EEFB;color:#2B4C8C}.s-ai{background:#F0E8FB;color:#5B3A8C}.s-think{background:#FCEDE8;color:#B5432C}.s-world{background:#FFF1D6;color:#8A5A00}.s-culture{background:#FDECEF;color:#9C2F52}.s-education{background:#E9F1E4;color:#3B6326}.s-travel{background:#E3F1FA;color:#1D5A80}.s-daily{background:#F3EFE6;color:#5E4F27}.s-food{background:#FFEDE0;color:#8F4310}.s-sport{background:#E3F4EA;color:#1F6236}.s-nature{background:#EDF6E4;color:#3A6420}
.l-yle{background:#E4F4F1;color:#1E6F5C;font-weight:700}.l-teens{background:#E6EEFB;color:#2B4C8C;font-weight:700}.l-adults{background:#F0E8FB;color:#5B3A8C;font-weight:700}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 16px}
.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{height:34px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.vr{width:1px;height:26px;background:var(--line);margin:0 4px}
.chipb{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:500;cursor:pointer}
.chipb.on{border-color:var(--ink);background:var(--ink);color:#fff}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;width:280px;background:#fff;border:1px solid var(--line);border-radius:12px}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;box-shadow:0 1px 2px rgba(43,34,83,.04)}
.tc{display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tc:hover{border-color:#CFE3E5}
.tc .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tc .dt{margin-left:auto;font-size:12px;color:var(--mute)}
.tc b.t{font-size:16px;line-height:1.35}
.tc .zh{font-size:13px;color:var(--mute)}
.tc .ft{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.tc .ft .used{color:#1E6F5C}
.sect{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sect b{font-size:17px}
.cnt{background:var(--coral);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:18px 0}
/* topic */
.tp{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start;margin-top:16px}
.story{font-size:19px;line-height:1.65;margin:0}
.storyzh{font-size:16px;line-height:1.7;color:#4A4566;margin:0}
.words{display:flex;gap:8px;flex-wrap:wrap}
.words span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;background:#fff}
.qs{display:flex;flex-direction:column;gap:10px}
.q{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.5}
.q i{flex:none;width:26px;height:26px;border-radius:999px;background:#E4F4F1;color:#1E6F5C;font-size:13px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center}
.think{background:#FDF5F2;border:1px solid #F1D9D2;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:17px;line-height:1.5}
.tryh{background:#EEF6F7;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.5}
.k{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mute)}
.src{font-size:13px;color:var(--mute);line-height:1.6}
.src a{word-break:break-word}
.facts{display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.facts .f{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:#F7F6FA}
.facts .f.bad{background:#FCEDE8;color:#B5432C}
.draftbar{display:flex;gap:12px;align-items:center;background:#FFF8EA;border:1px solid #F3DFB2;border-radius:14px;padding:12px 16px;margin-top:14px;flex-wrap:wrap}
.media{border-radius:12px;overflow:hidden;background:#EEF6F7}
.media video{width:100%;display:block}
select{height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:14px;max-width:240px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
/* student page and class (full screen) */
.st{max-width:1180px;margin:0 auto;padding:26px 28px 40px}
.st h2{font-family:'COE Card Fredoka',Fredoka,sans-serif;font-weight:400;font-size:38px;line-height:1.15;margin:8px 0 4px}
.st .zt{font-size:18px;color:#4A4566;margin:0 0 16px}
.st .cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.st .story{font-size:21px}
.foot{max-width:1180px;margin:0 auto;padding:14px 28px 30px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line)}
body.present header .ctl{display:none}
@media (max-width:860px){.tp,.st .cols{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.search{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
  <img src="../reader/logo.png" alt="CupOfEnglish">
  <div class="sep"></div>
  <div class="tt"><b id="hT">Talk of the Day / 今日话题</b><span id="hS">Class openers for YLE, Teens and Adults</span></div>
  <div class="ctl" id="hBtns" style="display:flex;gap:8px"></div>
</header>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="../homework/hdr.js"></script>
<script>
(function(){
const API = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/';
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id), app = $('app');
const TOKEN = (() => { try{ return localStorage.getItem('coe.token') || ''; }catch(e){ return ''; } })();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ST = { china: 'Today in China', stem: 'STEM / STEAM', ai: 'AI literacy', think: 'Critical thinking', world: 'Real-world talk', culture: 'Culture & festivals', education: 'Education', travel: 'Travel', daily: 'Daily life', food: 'Food', sport: 'Sport', nature: 'Nature & animals' };
const LV = { yle: 'YLE', teens: 'Teens', adults: 'Adults' }, LVZ = { yle: '少儿', teens: '青少年', adults: '成人' };
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const mnl = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dShort = d => { const x = new Date(d + 'T00:00:00Z'); return isNaN(x) ? '' : WD[x.getUTCDay()] + ' ' + x.getUTCDate() + ' ' + MO[x.getUTCMonth()]; };
const age = d => Math.round((Date.parse(mnl() + 'T00:00:00Z') - Date.parse(d + 'T00:00:00Z')) / 864e5);
const fresh = d => { const a = age(d); return a <= 7 ? 'week' : a <= 30 ? 'month' : 'earlier'; };
function toast(t){ const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3200); }
async function call(fn, body){ const r = await fetch(API + fn, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json().catch(() => ({ ok: false, error: 'No answer. Try again.' })); if(!j.ok) throw new Error(j.error || 'Not saved'); return j; }
const CE = ['Pre-A1','A1','A2','B1','B2','C1','C2'];
const ceRange = c => { const p = String(c || '').split('–').map(x => CE.indexOf(x.trim())).filter(i => i >= 0); return p.length ? [Math.min(...p), Math.max(...p)] : null; };
const ceOf = (t, k) => (t.cefr && t.cefr[k]) || '';
const lvChips = (L, t) => (L || []).map(k => '<span class="lb l-' + k + '">' + LV[k] + (t && ceOf(t, k) ? ' · ' + esc(ceOf(t, k)) : '') + '</span>').join('');
const stChip = s => '<span class="lb s-' + esc(s) + '">' + esc(ST[s] || s) + '</span>';
const srcLine = S => (S || []).map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.outlet) + (s.date ? ', ' + esc(s.date) : '') + '</a>').join(' · ');

let D = null, F = { fresh: 'week', lv: '', st: '', q: '', ce: '' }, STU = null;

/* ── Student page (shared link) and class view: no sign-in needed ── */
function studentHtml(t, lv, who){
  const L = (t.levels || []).includes(lv) ? lv : (t.levels || ['yle'])[0], qs = (t.q && t.q[L]) || [], th = t.think && t.think[L];
  return '<div class="st"><div style="display:flex;gap:6px;flex-wrap:wrap">' + stChip(t.strand) + '<span class="lb l-' + L + '">' + LV[L] + ' · ' + LVZ[L] + (ceOf(t, L) ? ' · CEFR ' + esc(ceOf(t, L)) : '') + '</span></div>'
    + '<h2>' + esc(t.title) + '</h2>' + (t.title_zh ? '<p class="zt">' + esc(t.title_zh) + '</p>' : '')
    + '<div class="cols"><div class="card" style="display:flex;flex-direction:column;gap:14px;padding:22px 26px">'
    + (t.media_url ? mediaHtml(t) : '')
    + '<p class="story">' + esc(t.story) + '</p>' + (t.story_zh ? '<p class="storyzh">' + esc(t.story_zh) + '</p>' : '')
    + ((t.words || []).length ? '<div class="k">NEW WORDS · 新单词</div><div class="words">' + t.words.map(w => '<span><b>' + esc(w.en) + '</b>' + (w.zh ? ' · ' + esc(w.zh) : '') + '</span>').join('') + '</div>' : '')
    + '</div><div style="display:flex;flex-direction:column;gap:14px">'
    + (qs.length ? '<div class="card qs"><b style="font-size:18px">Let\'s talk · 一起聊聊</b>' + qs.map((x, i) => '<div class="q"><i>' + (i + 1) + '</i><span>' + esc(x) + '</span></div>').join('') + '</div>' : '')
    + (th ? '<div class="think"><span class="lb s-think" style="align-self:flex-start;font-weight:700">THINK · 想一想</span><span>' + esc(th) + '</span></div>' : '')
    + (t.try_home ? '<div class="tryh"><span class="lb" style="background:#fff;color:#2E6E77;font-weight:700;align-self:flex-start">TRY AT HOME · 在家试试</span><span>' + esc(t.try_home) + '</span>' + (t.try_home_zh ? '<span style="color:#4A4566;font-size:15px">' + esc(t.try_home_zh) + '</span>' : '') + '</div>' : '')
    + '</div></div></div>'
    + '<div class="foot"><span>Source / 来源: ' + srcLine(t.sources) + '</span><span>Learn with us to be the best · 与优秀者同行</span></div>';
}
function mediaHtml(t){ const u = t.media_url; if(/\.(mp4|webm)(\?|$)/i.test(u)) return '<div class="media"><video src="' + esc(u) + '" controls playsinline preload="metadata"></video></div>';
  return '<a class="btn" href="' + esc(u) + '" target="_blank" rel="noopener" style="align-self:flex-start"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Watch the video</a>'; }

/* ── Picture for WeChat: same letterhead as the homework pictures ── */
let LOGO = null; { const im = new Image(); im.onload = () => { LOGO = im; }; im.src = '../reader/logo.png'; }
function wrap(g, text, maxW){ const out = []; String(text || '').split(/\n/).forEach(par => { const cjk = /[㐀-鿿]/.test(par), toks = cjk ? [...par] : par.split(/(\s+)/); let line = '';
  toks.forEach(tk => { const t2 = line + tk; if(g.measureText(t2).width > maxW && line.trim()){ out.push(line.trim()); line = tk.trimStart ? tk.trimStart() : tk; } else line = t2; }); if(line.trim()) out.push(line.trim()); }); return out; }
function picture(t, lv, who){
  const W = 1080, P = coeHdr.pad(W), FT = '"COE Card Fredoka", Fredoka, "Noto Sans SC", sans-serif', FI = '"COE Card Inter", Inter, "Noto Sans SC", "PingFang SC", sans-serif';
  const L = (t.levels || []).includes(lv) ? lv : (t.levels || ['yle'])[0], qs = (t.q && t.q[L]) || [], th = t.think && t.think[L];
  const label = (ST[t.strand] || '') + '  ·  ' + LV[L] + ' · ' + LVZ[L] + (ceOf(t, L) ? '  ·  CEFR ' + ceOf(t, L) : '');
  const run = (g, draw) => { let y = coeHdr.height(W, true) + 34; const room = W - 2 * P;
    const para = (txt, font, size, color, lh, gap) => { g.font = font.replace('#', size); const ls = wrap(g, txt, room); ls.forEach(l => { y += size * lh; if(draw){ g.fillStyle = color; g.fillText(l, P, y); } }); y += gap; };
    para(t.title, '400 #px ' + FT, 52, '#2B2253', 1.15, 8);
    if(t.title_zh) para(t.title_zh, '500 #px ' + FI, 26, '#4A4566', 1.4, 18);
    para(t.story, '400 #px ' + FI, 30, '#2B2253', 1.5, 10);
    if(t.story_zh) para(t.story_zh, '400 #px ' + FI, 26, '#4A4566', 1.6, 22);
    if((t.words || []).length){ para('New words · 新单词', '700 #px ' + FI, 22, '#6B6880', 1.4, 6); para(t.words.map(w => w.en + (w.zh ? ' ' + w.zh : '')).join('   ·   '), '600 #px ' + FI, 26, '#2B2253', 1.5, 22); }
    if(qs.length){ para("Let's talk · 一起聊聊", '700 #px ' + FI, 22, '#6B6880', 1.4, 6); qs.forEach((x, i) => para((i + 1) + '.  ' + x, '500 #px ' + FI, 28, '#2B2253', 1.5, 6)); y += 16; }
    if(th){ const y0 = y; g.font = '500 28px ' + FI; const n = wrap(g, th, room - 40).length, hgt = 22 * 1.4 + 6 + n * 28 * 1.5 + 34;
      if(draw){ g.fillStyle = '#FDF5F2'; g.beginPath(); g.roundRect(P, y0, room, hgt, 18); g.fill(); }
      y = y0 + 14; const P0 = P; const sx = (txt, font, size, color, lh) => { g.font = font.replace('#', size); wrap(g, txt, room - 40).forEach(l => { y += size * lh; if(draw){ g.fillStyle = color; g.fillText(l, P0 + 20, y); } }); };
      sx('THINK · 想一想', '700 #px ' + FI, 22, '#B5432C', 1.4); y += 6; sx(th, '500 #px ' + FI, 28, '#2B2253', 1.5); y = y0 + hgt + 22; }
    if(t.try_home){ para('Try at home · 在家试试', '700 #px ' + FI, 22, '#2E6E77', 1.4, 6); para(t.try_home + (t.try_home_zh ? '\n' + t.try_home_zh : ''), '400 #px ' + FI, 26, '#2B2253', 1.5, 22); }
    para('Source / 来源: ' + (t.sources || []).map(s => s.outlet + (s.date ? ' (' + s.date + ')' : '')).join('; '), '400 #px ' + FI, 18, '#6B6880', 1.5, 0);
    return y + 44; };
  const m = document.createElement('canvas').getContext('2d'), H = Math.ceil(run(m, false));
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  coeHdr.draw(g, W, { logo: LOGO, title: 'Talk of the Day / 今日话题', meta: [who ? 'For / 学生: ' + who : ''], label }); run(g, true); return c; }
async function copyPic(t, lv, who){ try{ await document.fonts.ready; }catch(e){}
  const c = picture(t, lv, who), blobP = new Promise(z => c.toBlob(z, 'image/png'));
  try{ await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobP })]); toast('Picture copied. Paste it in the WeChat group.'); }
  catch(e){ const bl = await blobP, a = document.createElement('a'); a.href = URL.createObjectURL(bl); a.download = 'talk-of-the-day.png'; a.click(); toast('Saved the picture as a file (copy was blocked).'); } }

/* ── Library ── */
function usedOf(id){ return (D.used || []).filter(u => u.topic === id); }
function libHtml(){
  const T = D.topics || [], ap = T.filter(t => t.status !== 'draft'), dr = T.filter(t => t.status === 'draft');
  const ceOk = t => { if(!F.ce) return true; const i = CE.indexOf(F.ce); return (t.levels || []).some(k => { const r = ceRange(ceOf(t, k)); return r && i >= r[0] && i <= r[1]; }); };
  const match = t => ceOk(t) && (!F.lv || (t.levels || []).includes(F.lv)) && (!F.st || t.strand === F.st) && (!F.q || (t.title + ' ' + t.title_zh + ' ' + t.story).toLowerCase().includes(F.q.toLowerCase()));
  const n = k => ap.filter(t => fresh(t.day) === k && match(t)).length, L = ap.filter(t => fresh(t.day) === F.fresh && match(t));
  const card = t => { const U = usedOf(t.id); return '<article class="card tc" data-id="' + t.id + '" tabindex="0" role="button" aria-label="Open ' + esc(t.title) + '">'
    + '<div class="row">' + (t.status === 'draft' ? '<span class="lb" style="background:#FFF1D6;color:#8A5A00;font-weight:700">DRAFT</span>' : age(t.day) <= 7 ? '<span class="lb new">NEW</span>' : '') + stChip(t.strand) + lvChips(t.levels, t) + '<span class="dt">' + dShort(t.day) + '</span></div>'
    + '<b class="t">' + esc(t.title) + '</b>' + (t.title_zh ? '<span class="zh">' + esc(t.title_zh) + '</span>' : '')
    + '<div class="ft">' + (U.length ? '<span class="used">Used with ' + esc(U.slice(0, 3).map(u => u.student || u.code).join(', ')) + (U.length > 3 ? ' +' + (U.length - 3) : '') + '</span>' : '<span>Not used yet</span>')
    + '<span style="margin-left:auto">Source: ' + esc((t.sources || []).map(s => s.outlet.split(' · ')[0]).filter((v, i, a) => a.indexOf(v) === i).slice(0, 2).join(', ')) + '</span></div></article>'; };
  return '<main><h1>Talk library</h1><p class="sub">Open each class with one of these instead of "How are you?" · 3–5 minutes · topics stay here · every fact has a source</p>'
    + (D.mgmt && dr.length ? '<div class="sect"><b>To approve</b><span class="cnt">' + dr.length + '</span><span class="sub" style="margin:0">teachers do not see these until the President approves</span></div><div class="grid">' + dr.map(card).join('') + '</div>' : '')
    + '<div class="bar"><div class="seg" role="tablist" aria-label="How new">' + [['week', 'This week'], ['month', 'This month'], ['earlier', 'Earlier']].map(([k, l]) => '<button type="button" role="tab" data-f="' + k + '" class="' + (F.fresh === k ? 'on' : '') + '" aria-selected="' + (F.fresh === k) + '">' + l + ' · ' + n(k) + '</button>').join('') + '</div>'
    + '<span class="vr"></span>' + [['', 'All levels'], ['yle', 'YLE'], ['teens', 'Teens'], ['adults', 'Adults']].map(([k, l]) => '<button type="button" class="chipb' + (F.lv === k ? ' on' : '') + '" data-lv="' + k + '">' + l + '</button>').join('')
    + '<select id="fce" aria-label="CEFR level"><option value="">Any CEFR</option>' + CE.slice(0, 6).map(k => '<option' + (F.ce === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>'
    + '<span class="vr"></span><select id="fst" aria-label="Topic"><option value="">All topics</option>' + Object.keys(ST).map(k => '<option value="' + k + '"' + (F.st === k ? ' selected' : '') + '>' + ST[k] + '</option>').join('') + '</select>'
    + '<label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6B6880" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="fq" type="search" placeholder="Search a topic" aria-label="Search a topic" value="' + esc(F.q) + '"></label></div>'
    + (L.length ? '<div class="grid">' + L.map(card).join('') + '</div>' : '<div class="empty">' + (ap.length ? 'Nothing here with these filters. Try "This month" or "Earlier".' : 'The first topics are being prepared. They appear here once approved.') + '</div>')
    + '<p class="sub" style="margin-top:18px">News moves from This week to This month after 7 days, and to Earlier after 30. Timeless topics (science, AI, animals) stay useful in Earlier.</p></main>';
}
function paintLib(){ $('hS').textContent = 'Class openers for YLE, Teens and Adults'; $('hBtns').innerHTML = ''; app.innerHTML = libHtml();
  app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { F.fresh = b.dataset.f; paintLib(); });
  app.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { F.lv = b.dataset.lv; paintLib(); });
  const fst = $('fst'); if(fst) fst.onchange = () => { F.st = fst.value; paintLib(); };
  const fce = $('fce'); if(fce) fce.onchange = () => { F.ce = fce.value; paintLib(); };
  const fq = $('fq'); fq.oninput = () => { F.q = fq.value; clearTimeout(paintLib.t); paintLib.t = setTimeout(() => { paintLib(); const e = $('fq'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }, 250); };
  app.querySelectorAll('.tc').forEach(c => { c.onclick = () => openTopic(c.dataset.id); c.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openTopic(c.dataset.id); } }; });
  const AP = (D.topics || []).filter(t => t.status !== 'draft');
  if(!paintLib.auto && F.fresh === 'week' && AP.length && !AP.some(t => fresh(t.day) === 'week')){ paintLib.auto = 1; F.fresh = AP.some(t => fresh(t.day) === 'month') ? 'month' : 'earlier'; paintLib(); } }

/* ── One topic (teacher) ── */
let CUR = null, CLV = 'yle';
async function students(){ if(STU) return STU; try{ const j = await call('coe-hw', { token: TOKEN, op: 'students' }); STU = j.students || []; }catch(e){ STU = []; } return STU; }
function openTopic(id, push = true){ const t = (D.topics || []).find(x => x.id === id); if(!t){ paintLib(); return; } CUR = t; if(!(t.levels || []).includes(CLV)) CLV = (t.levels || ['yle'])[0];
  if(push) history.pushState({ id }, '', '?t=' + id); paintTopic(); }
function paintTopic(){ const t = CUR, L = CLV, qs = (t.q && t.q[L]) || [], th = t.think && t.think[L];
  $('hS').textContent = dShort(t.day) + ' · ' + (ST[t.strand] || '');
  $('hBtns').innerHTML = '<button class="btn sm" id="bBack" type="button">‹ Talk library</button>';
  $('bBack').onclick = () => { history.pushState({}, '', location.pathname); paintLib(); };
  const S = t.sources || [], Fx = t.facts || [];
  app.innerHTML = '<main>'
    + (t.status === 'draft' ? '<div class="draftbar"><span class="lb" style="background:#FFF1D6;color:#8A5A00;font-weight:700">DRAFT</span><span style="flex:1;min-width:240px;font-size:14px">Teachers do not see this yet. Check each fact against its source below' + (D.pres ? ', then approve.' : '. The President approves.') + '</span>'
      + (D.pres ? '<button class="btn pr" id="bAp" type="button">Approve</button>' : '') + '</div>' : '')
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">' + stChip(t.strand) + lvChips(t.levels, t) + '<span class="lb" style="background:#F1F0F6;color:#6B6880">' + dShort(t.day) + '</span></div>'
    + '<h1 style="margin-top:10px">' + esc(t.title) + '</h1>' + (t.title_zh ? '<p class="sub" style="font-size:16px">' + esc(t.title_zh) + '</p>' : '')
    + '<div class="tp"><div style="display:flex;flex-direction:column;gap:14px"><div class="card" style="display:flex;flex-direction:column;gap:12px">'
    + (t.media_url ? mediaHtml(t) : '')
    + '<p class="story" style="font-size:17px">' + esc(t.story) + '</p>' + (t.story_zh ? '<p class="storyzh" style="font-size:15px">' + esc(t.story_zh) + '</p>' : '')
    + ((t.words || []).length ? '<div class="words">' + t.words.map(w => '<span><b>' + esc(w.en) + '</b>' + (w.zh ? ' · ' + esc(w.zh) : '') + '</span>').join('') + '</div>' : '') + '</div>'
    + '<div class="card" style="display:flex;flex-direction:column;gap:10px"><b style="font-size:17px">Facts and sources</b><div class="facts">'
    + Fx.map(f => { const s = S[f.src]; return '<div class="f' + (s ? '' : ' bad') + '"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="' + (s ? '#1E6F5C' : '#B5432C') + '" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:3px">' + (s ? '<path d="M5 12.5l4.5 4.5L19 7.5"/>' : '<path d="M12 7v6M12 17h.01"/>') + '</svg><span>' + esc(f.fact) + '<br><span class="src">' + (s ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.outlet) + ' · ' + esc(s.title) + '</a>' + (s.date ? ' · ' + esc(s.date) : '') : 'No source · cannot be approved') + '</span></span></div>'; }).join('')
    + '</div></div></div>'
    + '<div style="display:flex;flex-direction:column;gap:14px"><div class="card" style="display:flex;flex-direction:column;gap:14px">'
    + '<div class="seg" role="tablist" aria-label="Level" style="align-self:flex-start">' + (t.levels || []).map(k => '<button type="button" role="tab" data-l="' + k + '" class="' + (k === L ? 'on' : '') + '" aria-selected="' + (k === L) + '">' + LV[k] + (ceOf(t, k) ? ' · ' + esc(ceOf(t, k)) : '') + '</button>').join('') + '</div>'
    + '<div class="k">OPEN THE CLASS WITH THIS · INSTEAD OF "HOW ARE YOU?"' + (ceOf(t, L) ? ' · CEFR ' + esc(ceOf(t, L)) : '') + '</div>'
    + '<div class="qs">' + qs.map((x, i) => '<div class="q"><i>' + (i + 1) + '</i><span>' + esc(x) + '</span></div>').join('') + '</div>'
    + (th ? '<div class="think"><span class="lb s-think" style="align-self:flex-start;font-weight:700">THINK</span><span>' + esc(th) + '</span></div>' : '')
    + '</div>'
    + (t.status !== 'draft' ? '<div class="card" style="display:flex;flex-direction:column;gap:10px"><b style="font-size:17px">Use it with</b>'
      + '<select id="stuSel" aria-label="Student"><option value="">Choose your student</option></select>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="bPres" type="button">Open in class · full screen</button><button class="btn pr" id="bCopy" type="button">Copy picture for student</button><button class="btn sm" id="bLink" type="button">Copy link</button></div>'
      + '<span class="src">The picture and the link show our letterhead, the student\'s name, the level you chose and the sources.</span></div>' : '')
    + (D.pres && t.status !== 'draft' ? '<button class="btn sm" id="bRet" type="button" style="align-self:flex-start">Take it out of the library</button>' : '')
    + '</div></div></main>';
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { CLV = b.dataset.l; paintTopic(); });
  if($('bAp')) $('bAp').onclick = async () => { const b = $('bAp'); b.disabled = true; try{ await call('coe-talk', { token: TOKEN, op: 'approve', id: t.id }); t.status = 'approved'; toast('Approved. Teachers see it now.'); paintTopic(); }catch(e){ b.disabled = false; toast(e.message); } };
  if($('bRet')) $('bRet').onclick = async () => { if(!confirm('Take this topic out of the library? It is kept, not deleted.')) return; try{ await call('coe-talk', { token: TOKEN, op: 'retire', id: t.id }); D.topics = D.topics.filter(x => x.id !== t.id); toast('Taken out of the library.'); history.pushState({}, '', location.pathname); paintLib(); }catch(e){ toast(e.message); } };
  if($('stuSel')){ students().then(L2 => { const s = $('stuSel'); if(!s) return; s.innerHTML = '<option value="">Choose your student</option>' + L2.map(x => '<option value="' + esc(x.code) + '">' + esc(x.student) + ' · ' + esc(x.code) + '</option>').join(''); const k = sessionStorage.getItem('coe.talk.stu'); if(k) s.value = k; s.onchange = () => sessionStorage.setItem('coe.talk.stu', s.value); }); }
  const pick = () => { const s = $('stuSel'), code = s ? s.value : '', nm = s && s.value ? s.options[s.selectedIndex].text.split(' · ')[0] : ''; return { code, nm }; };
  const mark = p => { if(!p.code) return; call('coe-talk', { token: TOKEN, op: 'use', id: t.id, code: p.code, student: p.nm }).then(() => { D.used = (D.used || []).filter(u => !(u.topic === t.id && u.code === p.code)).concat([{ topic: t.id, code: p.code, student: p.nm, at: new Date().toISOString() }]); }).catch(() => {}); };
  if($('bCopy')) $('bCopy').onclick = async () => { const p = pick(); await copyPic(t, CLV, p.nm); mark(p); };
  if($('bLink')) $('bLink').onclick = async () => { const p = pick(), u = location.origin + location.pathname + '?id=' + t.id + '&lv=' + CLV + (p.nm ? '&s=' + encodeURIComponent(p.nm) : '');
    try{ await navigator.clipboard.writeText(u); toast('Link copied.'); }catch(e){ prompt('Copy this link', u); } mark(p); };
  if($('bPres')) $('bPres').onclick = () => { const p = pick(); mark(p); present(t, CLV, p.nm); };
}
function present(t, lv, who){ document.body.classList.add('present'); $('hT').textContent = 'Talk of the Day / 今日话题'; $('hS').textContent = (who ? 'For / 学生: ' + who + ' · ' : '') + dShort(t.day);
  $('hBtns').innerHTML = '<button class="btn sm" id="bX" type="button">Close</button>'; app.innerHTML = studentHtml(t, lv, who);
  try{ document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }catch(e){}
  const close = () => { document.body.classList.remove('present'); try{ document.fullscreenElement && document.exitFullscreen(); }catch(e){} paintTopic(); document.removeEventListener('keydown', esc1); };
  const esc1 = e => { if(e.key === 'Escape') close(); }; document.addEventListener('keydown', esc1); $('bX').onclick = close; }

/* ── start ── */
async function start(){
  const pid = Q.get('id');
  if(pid){ document.body.classList.add('present');
    try{ const j = await call('coe-talk', { op: 'pub', id: pid }), t = j.topic, who = Q.get('s') || ''; $('hS').textContent = (who ? 'For / 学生: ' + who + ' · ' : '') + dShort(t.day); app.innerHTML = studentHtml(t, Q.get('lv') || 'yle', who); document.title = t.title + ' · CupOfEnglish'; }
    catch(e){ app.innerHTML = '<main><div class="empty">This topic is not available.</div></main>'; } return; }
  if(!TOKEN){ app.innerHTML = '<main><h1>Talk library</h1><p class="sub">Open it from the CupOfEnglish app (you need to be signed in).</p><p><a class="btn pr" href="../app.html">Open the app</a></p></main>'; return; }
  app.innerHTML = '<main><div class="empty">Loading…</div></main>';
  try{ D = await call('coe-talk', { token: TOKEN, op: 'list' }); }catch(e){ app.innerHTML = '<main><div class="empty">' + (/AUTH/.test(e.message) ? 'Please sign in to the app again, then reopen this page.' : esc(e.message)) + '</div></main>'; return; }
  const tid = Q.get('t'); if(tid) openTopic(tid, false); else paintLib(); }
window.addEventListener('popstate', () => { const tid = new URLSearchParams(location.search).get('t'); if(D){ if(tid) openTopic(tid, false); else paintLib(); } });
start();
})();
</script>
