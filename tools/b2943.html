<script id="b2943">
(function(){
  /* 2943: each Students row: put the source after the teacher and books on the second line; hide the "✓ Agreement" chip
     (only a missing agreement is shown) */
  function fix(){ const v = document.getElementById('v-astudents'); if(!v) return;
    v.querySelectorAll('.li.sa:not([data-x43])').forEach(a => { a.dataset.x43 = 1; const g = a.querySelector('.grow'); if(!g) return;
      const l2 = g.children[1], src = g.querySelector('.sa-src'); if(l2 && src){ l2.classList.add('x43l'); l2.appendChild(document.createTextNode(' · ')); l2.appendChild(src); const w = l2.nextElementSibling; }
      g.querySelectorAll('.tags .chip.green').forEach(c => { if(/^\W*Agreement$/.test(c.textContent.trim())) c.classList.add('x43ok'); });
      g.querySelectorAll(':scope > div').forEach(d => { if(!d.textContent.trim() && !d.querySelector('svg')) d.style.display = 'none'; });
      const t = g.querySelector('.tags'); if(t && ![...t.children].some(c => !c.classList.contains('x43ok'))) t.style.display = 'none'; }); }
  new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
  /* 2943 · student page: the book and Fix buttons use line icons, not 📚 and ✎ */
  const BOOK = '<svg class="x43i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>';
  const PEN = '<svg class="x43i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  function ico(){ if(!document.body.classList.contains('is-mgr')) return; const sh = document.getElementById('sheet'); if(!sh) return;
    sh.querySelectorAll('.shbk button:not([data-x43])').forEach(b => { b.dataset.x43 = 1; const n = [...b.childNodes].find(x => x.nodeType === 3 && /📚/.test(x.nodeValue)); if(n){ n.nodeValue = n.nodeValue.replace(/📚\s*/, ''); b.insertAdjacentHTML('afterbegin', BOOK); } });
    sh.querySelectorAll('button.fx1726:not([data-x43])').forEach(b => { b.dataset.x43 = 1; const n = [...b.childNodes].find(x => x.nodeType === 3 && /✎/.test(x.nodeValue)); if(n){ n.nodeValue = n.nodeValue.replace(/✎\s*/, ''); b.insertAdjacentHTML('afterbegin', PEN); } }); }
  new MutationObserver(ico).observe(document.documentElement, { childList: true, subtree: true });

})();
</script>
