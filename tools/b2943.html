<style id="css2943">
/* 2943 (Misty 25 Nov 21:06): management Students list, best fit. One row per student on a soft grey tile, in two lines:
   name, Chinese name and code; then teacher, books and source. The learner group is the colour of the avatar ring (legend on the
   Learner filter), so the "Young Learners" chip is not repeated on every row. Agreement shows only when it is missing.
   Level, Lessons Left, A Week and Valid Until sit in fixed columns under their headings. */
#app #v-astudents a.li.sa{display:grid!important;grid-template-columns:40px minmax(0,1fr) 560px;align-items:center;gap:14px;background:#FAFAFC!important;border:0!important;border-radius:12px!important;padding:12px 16px!important;margin:0 0 8px!important;box-shadow:none!important}
#app #v-astudents a.li.sa:hover{background:#F3F2F8!important}
#app #v-astudents a.li.sa .av{width:40px;height:40px;border-radius:50%;background:#fff!important;border:2px solid var(--lb,#8C88A3);color:var(--lb,#8C88A3)!important;font-weight:700;display:grid;place-items:center}
#app #v-astudents a.li.sa[data-lb="early"]{--lb:#B0306E}#app #v-astudents a.li.sa[data-lb="young"]{--lb:#2B6CB0}#app #v-astudents a.li.sa[data-lb="teen"]{--lb:#6B46C1}#app #v-astudents a.li.sa[data-lb="adult"]{--lb:#A15C07}
#app #v-astudents a.li.sa .lt1588{display:none!important}
#app #v-astudents a.li.sa b.ell{font-size:15.5px;color:#2B2253}
#app #v-astudents a.li.sa .x43l{margin-top:2px}
#app #v-astudents a.li.sa .x43l .sa-src{display:inline-flex!important;align-items:center;gap:4px;background:none!important;border:0!important;padding:0!important;margin:0!important;font-size:inherit;color:inherit}
#app #v-astudents a.li.sa .x43ok{display:none!important}
#app #v-astudents a.li.sa .tags:empty{display:none}
#app #v-astudents .sa-r{display:grid!important;grid-template-columns:90px 110px 220px 140px;align-items:center;text-align:left!important;gap:0}
#app #v-astudents .sa-r > *{margin:0!important;justify-self:start}
#app #v-astudents .sa-r .sa-l:not(#a2943){background:none!important;border:0!important;padding:0!important;font-size:15px!important;font-weight:700!important;color:#2B2253!important}
#app #v-astudents .sa-r .sa-l.soon:not(#a2943){color:#A15C07!important}
#app #v-astudents .sa-h{display:grid!important;grid-template-columns:minmax(0,1fr) 90px 110px 220px 140px;padding:8px 16px 8px 70px!important;background:none!important;border:0!important}
#app #v-astudents .sa-h > *{text-align:left!important;justify-self:start}
#app #v-astudents .ltf1590 button[data-k]:not([data-k=""])::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#8C88A3;vertical-align:0}
#app #v-astudents .ltf1590 button[data-k="early"]::before{background:#B0306E}#app #v-astudents .ltf1590 button[data-k="young"]::before{background:#2B6CB0}
#app #v-astudents .ltf1590 button[data-k="teen"]::before{background:#6B46C1}#app #v-astudents .ltf1590 button[data-k="adult"]::before{background:#A15C07}
@media (max-width:1100px){#app #v-astudents a.li.sa{grid-template-columns:40px minmax(0,1fr)}#app #v-astudents a.li.sa .sa-r{grid-column:2;grid-template-columns:80px 100px minmax(0,1fr) 120px}#app #v-astudents .sa-h{display:none!important}}
</style>
<script id="b2943">
(function(){
  /* 2943: each Students row: put the source after the teacher and books on the second line; hide the "✓ Agreement" chip
     (only a missing agreement is shown) */
  function fix(){ const v = document.getElementById('v-astudents'); if(!v) return;
    v.querySelectorAll('a.li.sa:not([data-x43])').forEach(a => { a.dataset.x43 = 1; const g = a.querySelector('.grow'); if(!g) return;
      const l2 = g.children[1], src = g.querySelector('.sa-src'); if(l2 && src){ l2.classList.add('x43l'); l2.appendChild(document.createTextNode(' · ')); l2.appendChild(src); const w = l2.nextElementSibling; }
      g.querySelectorAll('.tags .chip.green').forEach(c => { if(/^\W*Agreement$/.test(c.textContent.trim())) c.classList.add('x43ok'); });
      g.querySelectorAll(':scope > div').forEach(d => { if(!d.textContent.trim() && !d.querySelector('svg')) d.style.display = 'none'; });
      const t = g.querySelector('.tags'); if(t && ![...t.children].some(c => !c.classList.contains('x43ok'))) t.style.display = 'none'; }); }
  new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
