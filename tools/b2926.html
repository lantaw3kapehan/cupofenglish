<style id="css2926">
/* 2926 (Misty 17:57): List, Timeline and Open slots in the same look as Month and Deadlines.
   No light logo teal: dark teal #0E6F68 for "now / today", navy for coming, faded for done, red outline for cancelled,
   chips in the Birthday / New Book style (white, light grey outline, coloured words). */
/* the day strip: the chosen day in dark teal, today ringed */
#v-schedule .s2-d.on:not(#z2926):not(#y2926):not(#x2926):not(#w2926){background:#0E6F68!important;border-color:#0E6F68!important;box-shadow:0 6px 16px rgba(14,111,104,.22)!important}
#v-schedule .s2-d.td:not(.on){border-color:#0E6F68!important}
/* Day at a glance: done faded, live dark teal, coming navy, cancelled red outline */
#v-schedule .dg16 i[style*="#9ED9DD"]{background:#C9C6DA!important}
#v-schedule .dg16 i[style*="#00A3AD"]{background:#0E6F68!important}
#v-schedule .dg16 i[style*="#F0C9BF"]{background:#fff!important;box-shadow:inset 0 0 0 1.5px #C0392B}
#v-schedule .dg16 .c:hover{background:#F6F5FA}
/* chips: outlined, coloured words */
#v-schedule .chip.teal,#v-schedule .chip.green,#v-schedule .chip.red,#v-schedule .s2-sum .chip,#v-schedule .card .chip{background:#fff!important;border:1px solid #E4E2EC!important;font-weight:600}
#v-schedule .chip.teal{color:#0E6F68!important}#v-schedule .chip.green{color:#1D7A52!important}#v-schedule .chip.red{color:#C0392B!important;border-color:#F1C6BD!important}
#v-schedule .cxwho{background:#fff!important;border:1px solid #E4E2EC;color:#2B6CB0!important}
#v-schedule .card[style*="FFFCF3"],#v-schedule .card{background:#fff}
/* Timeline: solid bars in the book colour (set below), done faded, live ringed, cancelled red outline */
#v-schedule .t7b.s26{color:#fff!important;border:0!important}
#v-schedule .t7b.s26 i{color:rgba(255,255,255,.85)!important}
#v-schedule .t7b.dn{opacity:.4}
#v-schedule .t7b.lv{box-shadow:0 0 0 2px #fff,0 0 0 4px #0E6F68!important}
#v-schedule .t7b.cx{background:#fff!important;border:1.5px solid #C0392B!important;color:#C0392B!important}
#v-schedule .t7b.cx i{color:#C0392B!important;opacity:.8}
#v-schedule .tl97k i[style*="#E6F6F7"]{background:#fff!important;box-shadow:0 0 0 2px #0E6F68!important}
/* Open slots: open times as solid green blocks (green = free), cards white, today in dark teal */
#v-schedule .fr24 .r{background:#3B7D23!important;color:#fff!important;border-radius:7px}
#v-schedule .fr24 .r i{color:rgba(255,255,255,.85)!important}
#v-schedule .fr24 .full{color:#C0392B}
#v-schedule .fr24 .st{background:#fff!important;border:1px solid #ECEAF1;border-radius:16px}
#v-schedule .fr24 th.td{color:#0E6F68}
</style>
<script id="b2926">
/* Timeline bars: solid in the book's own colour (the left stripe colour), white words */
(function(){
  function paint(){ try{ document.querySelectorAll('#v-schedule .t7b:not(.s26)').forEach(b => { if(b.classList.contains('cx')){ b.classList.add('s26'); b.style.background = ''; return; }
    const c = b.style.borderLeftColor; if(c){ b.style.background = c; b.classList.add('s26'); } }); }catch(e){} }
  (function w(){ const v = document.getElementById('v-schedule'); if(!v){ setTimeout(w, 800); return; } new MutationObserver(paint).observe(v, { childList: true, subtree: true }); paint(); })();
})();
</script>
