<script id="b2933">
/* 2933: Class videos' line under the title began "· yesterday…" and a style hid its first letters; it now reads "Yesterday …" */
(function(){
  function fix(){ const sp = document.querySelector('#vid1882 > b + span.small'); if(!sp) return; const t = sp.textContent; if(/^\s*·\s*/.test(t)){ const r = t.replace(/^\s*·\s*/, ''); sp.textContent = r.charAt(0).toUpperCase() + r.slice(1); } }
  new MutationObserver(fix).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
