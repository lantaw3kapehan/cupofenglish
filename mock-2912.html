<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>CupOfEnglish · Design Options · Deadlines, Families, Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2F2752;--teal:#01B0BF;--teal-d:#0E6F68;--ink:#2F2752;--tx:#3B3757;--mu:#6F6B85;--mu2:#8A879C;--ln:#ECEAF1;--ln2:#F3F2F7;--bg:#F7F7FA;
  --pay:#2F2752;--pay-b:#EEEDF5;--gov:#9A5512;--gov-b:#FCF1E3;--fb:#0E6F68;--fb-b:#E3F5F6;--memo:#4A3FB0;--memo-b:#EEEDFE;--tr:#1D7A52;--tr-b:#E3F4EC;--hol:#B4472F;--hol-b:#FCECE7;--pkg:#5E5A76;--pkg-b:#F1F0F5;--warn:#B4472F;--warn-b:#FFF4F1}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.45 Inter,system-ui,-apple-system,sans-serif;color:var(--tx);background:#ECEBF2;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--ln);padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.bar h1{font:20px 'Fredoka One',Inter,sans-serif;color:var(--navy);margin:0;letter-spacing:.2px}
.bar .note{color:var(--mu);font-size:13px}
.seg{display:inline-flex;background:var(--ln2);border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--mu)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(47,39,82,.12)}
.seg.dir button{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:7px 14px}
.seg.dir button small{font-weight:500;font-size:11.5px;color:var(--mu2)}
.stage{padding:24px;display:flex;justify-content:center}
.desc{max-width:1360px;margin:0 auto;padding:18px 24px 0;color:var(--mu);font-size:14px}
.desc b{color:var(--navy)}
/* app frame */
.app{width:1360px;max-width:100%;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(47,39,82,.14);display:grid;grid-template-columns:240px minmax(0,1fr);min-height:900px}
.side{background:#fff;border-right:1px solid var(--ln);padding:20px 14px}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px 18px}
.logo i{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7FD6DE,#01B0BF);display:block}
.logo b{font:17px 'Fredoka One',sans-serif;color:var(--navy);letter-spacing:.3px}
.ng{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--mu2);margin:16px 10px 6px}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--tx);font-size:15px}
.ni svg{color:var(--mu)}.ni.on{background:#E6F6F7;color:var(--teal-d);font-weight:600}.ni.on svg{color:var(--teal-d)}
.top{height:64px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.top .who{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy)}
.top .who small{display:block;font-weight:500;color:var(--mu);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:#E9F7EF;color:#1D7A52}
.main{padding:28px 32px 40px}
.ttl{font:30px 'Fredoka One',Inter,sans-serif;color:var(--navy);margin:0;letter-spacing:.2px}
.sub{color:var(--mu);font-size:14.5px;margin-top:4px}
.ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic.s{width:28px;height:28px;border-radius:8px}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;box-shadow:0 0 0 2px #fff}
.avs{display:inline-flex}.avs .av+.av{margin-left:-9px}
.av.l{width:52px;height:52px;font-size:20px}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--ln);background:#fff;border-radius:10px;height:36px;padding:0 14px;font-size:14px;font-weight:600;color:var(--navy);display:inline-flex;align-items:center;gap:6px}
.btn.i{width:36px;padding:0;justify-content:center}
.tag{white-space:nowrap;display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px}
.t-late{background:var(--warn-b);color:var(--warn)}.t-ok{background:#E3F4EC;color:#1D7A52}.t-soon{background:#FCF1E3;color:#8A4B0F}.t-n{background:var(--ln2);color:var(--mu)}.t-teal{background:#E3F5F6;color:var(--teal-d)}.t-pur{background:#EEEDFE;color:#3C3489}
.wrap{display:none}.wrap.on{display:block}
a.lnk{color:var(--teal-d);font-weight:600;text-decoration:none}

/* ============ A · Calm Cards ============ */
.A .card{background:#fff;border-radius:20px;box-shadow:0 1px 2px rgba(47,39,82,.05),0 8px 24px rgba(47,39,82,.05);padding:20px 22px}
.A .hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.A .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.A .kpi{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(47,39,82,.05),0 8px 24px rgba(47,39,82,.05);display:flex;gap:14px;align-items:flex-start}
.A .kpi .l{font-size:13px;color:var(--mu);font-weight:600}
.A .kpi .v{font-size:30px;font-weight:700;color:var(--navy);line-height:1.15;margin:2px 0}
.A .kpi .v.sm{font-size:19px;margin:6px 0 4px}
.A .kpi .s{font-size:13px;color:var(--mu)}
.A .kpi.warn{background:linear-gradient(180deg,#FFF6F3,#fff)}.A .kpi.warn .v{color:var(--warn)}
.A .two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.A .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.A .dw{font-size:12px;font-weight:700;color:var(--mu2);letter-spacing:.06em;padding:0 8px 4px}
.A .dc{min-height:104px;border-radius:12px;padding:8px;background:#FAFAFC;display:flex;flex-direction:column;gap:4px}
.A .dc.o{background:transparent}.A .dc.past{opacity:.55}.A .dc.t{background:#fff;box-shadow:inset 0 0 0 2px var(--teal)}
.A .dn{font-size:13px;font-weight:700;color:var(--tx)}.A .dc.t .dn{color:var(--teal-d)}
.A .ev{font-size:12px;font-weight:600;border-radius:8px;padding:4px 7px;display:flex;align-items:center;gap:6px;line-height:1.2}
.A .ev i{width:6px;height:6px;border-radius:50%;flex:none}
.A .ev.late{box-shadow:inset 0 0 0 1.5px #E9A08C}
.A .agh{font-size:12px;font-weight:700;color:var(--mu2);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 6px}
.A .agh:first-of-type{margin-top:6px}
.A .ag{display:flex;gap:12px;align-items:center;padding:10px 0}
.A .ag b{display:block;color:var(--navy);font-size:15px;font-weight:600}.A .ag small{display:block;color:var(--mu);font-size:13px}
.A .ag .r{margin-left:auto}
.A .flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.A .chip{border:0;background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--tx);display:inline-flex;gap:7px;align-items:center;box-shadow:0 1px 2px rgba(47,39,82,.06)}
.A .chip i{width:8px;height:8px;border-radius:50%}.A .chip small{color:var(--mu2);font-weight:600}
.A .chip.on{background:var(--navy);color:#fff}.A .chip.on small{color:#C9C5E0}
.A .fam{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.A .fi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer}
.A .fi:hover{background:#fff}.A .fi.on{background:#fff;box-shadow:0 1px 2px rgba(47,39,82,.06),0 6px 18px rgba(47,39,82,.07)}
.A .fi b{display:block;color:var(--navy)}.A .fi small{color:var(--mu);font-size:13px}.A .fi .u{margin-left:auto;text-align:right}.A .fi .u b{font-size:16px}
.A .srch{width:100%;height:44px;border-radius:12px;border:0;background:#fff;box-shadow:0 1px 2px rgba(47,39,82,.06);padding:0 14px;font-size:15px;margin-bottom:10px}
.A .kids{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.A .kid{background:#FAFAFC;border-radius:16px;padding:16px}
.A .kid .big{font-size:26px;font-weight:700;color:var(--navy)}
.A .meter{height:6px;border-radius:99px;background:#ECEAF1;overflow:hidden;margin:8px 0 10px}.A .meter i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.A .sec h3{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--navy);margin:0 0 8px}
.A .row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln2)}.A .row:first-of-type{border-top:0}
.A .row b{color:var(--navy);font-weight:600}.A .row small{display:block;color:var(--mu);font-size:13px}.A .row .r{margin-left:auto;text-align:right;white-space:nowrap}
.A .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

/* ============ B · Navy Hero ============ */
.B .hero{background:radial-gradient(1200px 300px at 85% -20%,rgba(1,176,191,.35),transparent 60%),linear-gradient(135deg,#2F2752,#3D3470);color:#fff;border-radius:24px;padding:26px 30px 24px;margin-bottom:22px;position:relative;overflow:hidden}
.B .hero .ttl{color:#fff}.B .hero .sub{color:#C9C5E0}
.B .hero .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.B .hk{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:24px;border-top:1px solid rgba(255,255,255,.14);padding-top:18px}
.B .hk > div{padding:0 20px;border-left:1px solid rgba(255,255,255,.14)}.B .hk > div:first-child{padding-left:0;border-left:0}
.B .hk .l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B9B4D6;font-weight:700}
.B .hk .v{font-size:34px;font-weight:700;line-height:1.1;margin:6px 0 4px}.B .hk .v.sm{font-size:20px;margin:10px 0 6px}
.B .hk .s{font-size:13px;color:#D8D5EA}
.B .hk .warn .v{color:#FFB7A3}
.B .hbtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
.B .card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px 20px}
.B .two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.B .cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ln2);border-left:1px solid var(--ln2)}
.B .dw{font-size:11.5px;font-weight:700;color:var(--mu2);letter-spacing:.08em;padding:10px;border-right:1px solid var(--ln2);border-bottom:1px solid var(--ln2)}
.B .dc{min-height:108px;padding:8px;border-right:1px solid var(--ln2);border-bottom:1px solid var(--ln2);display:flex;flex-direction:column;gap:4px}
.B .dc.o{background:#FBFBFD}.B .dc.past .dn{color:#B5B2C3}.B .dc.past .ev{opacity:.55}
.B .dn{font-size:13px;font-weight:700}.B .dc.t .dn{background:var(--teal);color:#fff;border-radius:999px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.B .ev{font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;border-left:3px solid;line-height:1.25}
.B .ev.late{background:var(--warn-b)!important;color:var(--warn)!important;border-color:var(--warn)!important}
.B .ag{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--ln2)}.B .ag:first-of-type{border-top:0}
.B .ag .d{width:44px;text-align:center;flex:none}.B .ag .d b{display:block;font-size:20px;color:var(--navy);line-height:1}.B .ag .d small{font-size:11px;font-weight:700;color:var(--mu2);letter-spacing:.06em}
.B .ag .x b{display:block;color:var(--navy);font-weight:600}.B .ag .x small{color:var(--mu);font-size:13px}
.B .ag .r{margin-left:auto}
.B h3{font-size:17px;color:var(--navy);margin:0 0 10px}
.B .fam{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.B .fl{background:#fff;border:1px solid var(--ln);border-radius:18px;overflow:hidden}
.B .fl .q{padding:12px;border-bottom:1px solid var(--ln2)}.B .fl input{width:100%;height:40px;border:1px solid var(--ln);border-radius:10px;padding:0 12px;font-size:14.5px}
.B .fi{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln2)}
.B .fi.on{background:#F4FBFC;box-shadow:inset 3px 0 0 var(--teal)}
.B .fi b{display:block;color:var(--navy);font-size:15px}.B .fi small{color:var(--mu);font-size:13px}.B .fi .u{margin-left:auto;text-align:right}
.B .tbl{width:100%;border-collapse:collapse;font-size:14px}.B .tbl td{padding:10px 0;border-top:1px solid var(--ln2)}.B .tbl tr:first-child td{border-top:0}.B .tbl td.r{text-align:right;white-space:nowrap}
.B .tbl b{color:var(--navy);font-weight:600}.B .tbl small{display:block;color:var(--mu);font-size:12.5px}
.B .kids{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.B .kid{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.B .kid b{color:var(--navy);font-size:16px}.B .kid small{display:block;color:var(--mu);font-size:13px}
.B .kid .big{font-size:28px;font-weight:700;color:var(--navy);text-align:right;line-height:1}.B .kid .big small{font-size:12px;font-weight:600}
.B .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}

/* ============ C · Timeline & Gallery ============ */
.C .hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.C .strip{display:flex;gap:10px;margin-bottom:22px}
.C .st{flex:1;background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.C .st b{font-size:24px;color:var(--navy);display:block;line-height:1.1}.C .st small{color:var(--mu);font-size:13px}
.C .st.warn{border-color:#F1C6BA;background:var(--warn-b)}.C .st.warn b{color:var(--warn)}
.C .weeks{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:6px 22px}
.C .wk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:16px 0;border-top:1px solid var(--ln2)}.C .wk:first-child{border-top:0}
.C .wk .wl b{display:block;color:var(--navy);font-size:15px}.C .wk .wl small{color:var(--mu);font-size:12.5px}
.C .wk.now .wl b{color:var(--teal-d)}
.C .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.C .dd{min-height:64px;border-radius:12px;padding:6px 8px;background:#FAFAFC}
.C .dd.o{background:transparent}.C .dd.past{opacity:.5}.C .dd.t{background:#E9F8F9;box-shadow:inset 0 0 0 1.5px var(--teal)}
.C .dd .n{font-size:11.5px;font-weight:700;color:var(--mu2)}.C .dd .n span{color:var(--tx);font-size:13px;margin-left:4px}
.C .dot{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;margin-top:4px;line-height:1.2}
.C .dot i{width:8px;height:8px;border-radius:3px;flex:none}
.C .dot.late{color:var(--warn)}
.C .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.C .fc{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.C .fc.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(1,176,191,.12)}
.C .fc .h{display:flex;align-items:center;gap:12px}.C .fc .h b{display:block;color:var(--navy);font-size:16px}.C .fc .h small{color:var(--mu);font-size:13px}
.C .bars{display:grid;gap:8px}
.C .kb{display:grid;grid-template-columns:60px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.C .kb .m{height:8px;border-radius:99px;background:#F0EFF5;overflow:hidden}.C .kb .m i{display:block;height:100%;border-radius:99px}
.C .kb .v{text-align:right;font-weight:700;color:var(--navy)}
.C .fc .ft{display:flex;justify-content:space-between;border-top:1px solid var(--ln2);padding-top:10px;font-size:13px;color:var(--mu)}
.C .drawer{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:22px;margin-top:20px}
.C .tl{position:relative;padding-left:22px}.C .tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--ln)}
.C .tli{position:relative;padding:8px 0}.C .tli:before{content:"";position:absolute;left:-21px;top:13px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--c,#B5B2C3)}
.C .tli b{color:var(--navy);font-weight:600}.C .tli small{display:block;color:var(--mu);font-size:13px}
.C .tli .when{font-size:12px;font-weight:700;color:var(--mu2);letter-spacing:.05em;text-transform:uppercase}
.C .funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-bottom:20px}
.C .fs{padding:22px 22px 20px;position:relative}
.C .fs + .fs{border-left:1px solid var(--ln2)}
.C .fs .l{font-size:13px;font-weight:600;color:var(--mu)}.C .fs .v{font-size:36px;font-weight:700;color:var(--navy);line-height:1.1;margin:6px 0}
.C .fs .bar2{height:10px;border-radius:99px;background:#F0EFF5;margin:10px 0 8px;overflow:hidden}.C .fs .bar2 i{display:block;height:100%;border-radius:99px}
.C .fs .s{font-size:13px;color:var(--mu)}
.C .fs .arr{position:absolute;right:-13px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;color:var(--mu2);z-index:2}
.C .sm4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.C .card{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px 20px}
.C h3{font-size:16px;color:var(--navy);margin:0 0 4px}.C .card .sub{margin:0 0 12px;font-size:13px}

/* ============ D · Workspace ============ */
.D .ws{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0;background:#fff;border:1px solid var(--ln);border-radius:20px;overflow:hidden;min-height:720px}
.D .rail{border-right:1px solid var(--ln);padding:20px;background:#FCFCFE}
.D .pane{padding:22px 26px}
.D .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.D .mh b{color:var(--navy)}
.D .mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12.5px}
.D .mini .w{font-size:11px;font-weight:700;color:var(--mu2);padding:4px 0}
.D .mini .d{height:34px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--tx);font-weight:600;position:relative}
.D .mini .d.o{color:transparent}.D .mini .d.past{color:#B5B2C3}
.D .mini .d.t{background:var(--navy);color:#fff}.D .mini .d.sel{box-shadow:inset 0 0 0 1.5px var(--teal)}
.D .mini .d .ds{display:flex;gap:2px;position:absolute;bottom:4px}.D .mini .d .ds i{width:4px;height:4px;border-radius:50%}
.D .leg{margin-top:18px;display:grid;gap:6px}
.D .lg{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 8px;border-radius:9px}.D .lg:hover{background:#F4F3F8}
.D .lg i{width:10px;height:10px;border-radius:3px}.D .lg span{margin-left:auto;color:var(--mu2);font-weight:600}
.D .tabs{display:flex;gap:6px;border-bottom:1px solid var(--ln);margin:-4px 0 16px}
.D .tab{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--mu);border-bottom:2px solid transparent;font-size:14.5px}
.D .tab.on{color:var(--navy);border-color:var(--teal)}
.D .alert{display:flex;gap:12px;align-items:center;background:var(--warn-b);border:1px solid #F1C6BA;border-radius:14px;padding:12px 14px;margin-bottom:16px}
.D .alert b{color:var(--warn)}.D .alert small{display:block;color:var(--tx);font-size:13px}
.D .tl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0}
.D .tl .d{padding:14px 0;border-top:1px solid var(--ln2);font-size:12.5px;font-weight:700;color:var(--mu2);letter-spacing:.04em;text-transform:uppercase}
.D .tl .d b{display:block;font-size:22px;color:var(--navy);letter-spacing:0;line-height:1.1}
.D .tl .d.t b{color:var(--teal-d)}
.D .tl .it{padding:10px 0;border-top:1px solid var(--ln2)}
.D .tli{display:flex;gap:12px;align-items:center;padding:6px 0}
.D .tli b{display:block;color:var(--navy);font-weight:600}.D .tli small{color:var(--mu);font-size:13px}.D .tli .r{margin-left:auto}
.D .fs{display:grid;grid-template-columns:300px minmax(0,1fr)}
.D .fi{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px}
.D .fi.on{background:#fff;box-shadow:0 0 0 1px var(--ln),0 4px 14px rgba(47,39,82,.06)}
.D .fi b{display:block;color:var(--navy);font-size:14.5px}.D .fi small{color:var(--mu);font-size:12.5px}.D .fi .u{margin-left:auto;font-weight:700;color:var(--navy)}
.D .facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ln);border-radius:16px;overflow:hidden;margin:18px 0}
.D .facts > div{padding:14px 16px}.D .facts > div + div{border-left:1px solid var(--ln)}
.D .facts .l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu2)}.D .facts .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:4px}.D .facts .v.sm{font-size:16px;margin-top:8px}.D .facts small{color:var(--mu);font-size:12.5px}
.D table{width:100%;border-collapse:collapse;font-size:14px}.D th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu2);font-weight:700;padding:8px 0;border-bottom:1px solid var(--ln)}
.D td{padding:11px 0;border-bottom:1px solid var(--ln2)}.D td.r,.D th.r{text-align:right}.D td b{color:var(--navy);font-weight:600}
.D .kr{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.D .kr > div{padding:16px 18px;border-bottom:1px solid var(--ln)}.D .kr > div:nth-child(odd){border-right:1px solid var(--ln)}
.D .kr .l{font-size:13px;color:var(--mu);font-weight:600}.D .kr .v{font-size:28px;font-weight:700;color:var(--navy)}
.D .grow{display:grid;grid-template-columns:300px minmax(0,1fr)}
</style>

/* ---------- Growth shared ---------- */
function chart(h=300){
  const W=900,H=h<400?260:300,pad=36,bw=18,mx=32,cols=[['tr','#BFE7EB','Trials Held'],['st','#3FB3BE','Became Students'],['pk','#2F2752','New Packages'],['rn','#9A8FD6','Renewals']];
  let s=`<div style="display:flex;gap:16px;font-size:13px;color:var(--mu);margin-bottom:6px">${cols.map(c=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c[1]};margin-right:6px"></i>${c[2]}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let g=0;g<=4;g++){const y=H-pad-(g/4)*(H-pad-10); s+=`<line x1="30" x2="${W}" y1="${y}" y2="${y}" stroke="#F1F0F5"/><text x="0" y="${y+4}" font-size="11" fill="#8A879C">${g*8}</text>`;}
  GM.forEach((m,i)=>{const gx=60+i*(W-80)/6; cols.forEach((c,j)=>{const v=G[c[0]][i]; if(!v) return; const hh=v/mx*(H-pad-10); s+=`<rect x="${gx+j*(bw+4)}" y="${H-pad-hh}" width="${bw}" height="${hh}" rx="5" fill="${c[1]}"/>`;}); s+=`<text x="${gx+40}" y="${H-12}" font-size="12" text-anchor="middle" fill="${i===5?'#2F2752':'#8A879C'}" font-weight="${i===5?700:500}">${m}</text>`;});
  return s+'</svg>';
}
function growthBottom(){
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><div class="card"><h3 style="margin:0 0 4px;color:var(--navy);font-size:16px">Trial Results by Teacher</h3><div class="sub" style="margin:0 0 12px;font-size:13px">Last 3 months</div>${TCH.map(t=>`<div style="display:grid;grid-template-columns:120px 1fr 60px;gap:12px;align-items:center;padding:7px 0;font-size:14px"><b style="color:var(--navy);font-weight:600">${t[0]}</b><div style="height:10px;border-radius:99px;background:#F0EFF5;overflow:hidden"><i style="display:block;height:100%;width:${t[1]/t[2]*100}%;background:var(--teal);border-radius:99px"></i></div><span class="num" style="text-align:right">${t[1]} of ${t[2]}</span></div>`).join('')}</div>

}
function growthCommon(d){

   <div class="hk"><div><div class="l">Trials Held</div><div class="v">18</div><div class="s">23 in October</div></div><div><div class="l">Became Students</div><div class="v">15 <span style="font-size:18px;color:#7FE3EC">83%</span></div><div class="s">Up from 70% in October</div></div><div><div class="l">New Packages</div><div class="v">29</div><div class="s">Up from 20 in October</div></div><div><div class="l">Renewals</div><div class="v">6</div><div class="s">9 renewing now</div></div></div></div>
   <div class="card" style="margin-bottom:20px"><h3>The Last 6 Months</h3>${chart()}</div>${growthBottom()}`;
  const k = (ic,l,v,s,tg) => `<div class="kpi"><span class="ic" style="background:#E3F5F6;color:var(--teal-d)">${sv(KI[ic],17)}</span><div><div class="l">${l}</div><div class="v num">${v}</div><div class="s">${s} ${tg||''}</div></div></div>`;
  return `<div class="hd"><div><h2 class="ttl">Growth</h2><div class="sub">How families come in, become students and stay. November so far.</div></div><span class="btn">Refresh</span></div>
   <div class="kpis">${k('star','Trials Held',18,'23 in October','<span class="tag t-late">−5</span>')}${k('user','Became Students','15 <span style="font-size:16px;color:var(--teal-d)">83%</span>','70% in October','<span class="tag t-ok">+13 pts</span>')}${k('pkg','New Packages',29,'20 in October','<span class="tag t-ok">+9</span>')}${k('grow','Renewals',6,'9 renewing now','')}</div>
   <div class="card" style="margin-bottom:20px"><div style="font-size:17px;font-weight:700;color:var(--navy);margin-bottom:8px">The Last 6 Months</div>${chart()}</div>${growthBottom()}`;
}

/* ---------- switcher ---------- */
const DIRS = [['A','Calm Cards','Soft shadows, no lines'],['B','Navy Hero','Brand band with key numbers'],['C','Timeline & Gallery','Weeks, family cards, funnel'],['D','Workspace','Split panes and tabs']];
const DESC = {A:'<b>A · Calm Cards.</b> The closest to today, refined: no borders, soft shadows, more white space, icons on every number, progress bars for units.',
 B:'<b>B · Navy Hero.</b> Each screen opens with a navy brand band that holds the four key numbers, like a premium dashboard. Detail sits below in clean tables.',
 C:'<b>C · Timeline & Gallery.</b> Different shapes for different jobs: the month read week by week, families as a card gallery with a history timeline, growth as a funnel.',
 D:'<b>D · Workspace.</b> A tool-like layout: a small calendar or list on the left, details on the right, with tabs so nothing is long. Very fast to scan on a laptop.'};
const SCR = [['dl','Deadlines'],['fam','Families'],['gr','Growth']];
let dir = (location.hash.match(/d=([A-D])/)||[])[1] || 'A', scr = (location.hash.match(/s=(dl|fam|gr)/)||[])[1] || 'dl';
function paint(){
  document.getElementById('dirs').innerHTML = DIRS.map(d=>`<button class="${d[0]===dir?'on':''}" onclick="dir='${d[0]}';paint()">${d[0]} · ${d[1]}<small>${d[2]}</small></button>`).join('');
  document.getElementById('scr').innerHTML = SCR.map(s=>`<button class="${s[0]===scr?'on':''}" onclick="scr='${s[0]}';paint()">${s[1]}</button>`).join('');
  document.getElementById('desc').innerHTML = DESC[dir];
  const R = {A,B,C,D}[dir], act = {dl:'Deadlines',fam:'Families',gr:'Growth'}[scr];
  document.getElementById('app').innerHTML = side(act) + `<div>${TOPBAR}<div class="main ${dir}">${R[scr]()}</div></div>`;
  history.replaceState(null,'','#d='+dir+'&s='+scr);
}
paint();
