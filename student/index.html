*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

.lc{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:28px 22px;box-shadow:0 8px 30px rgba(43,36,80,.08)}
.lc .logo{display:block;margin:0 auto 12px;width:186px;height:54px}

.lc p.lead{color:var(--mute);font-size:14px;text-align:center;margin:10px 0 16px}
label{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}label .en{display:inline;margin-left:6px}

.btn:focus-visible,.nav button:focus-visible,.chipb:focus-visible{outline:3px solid var(--teal2);outline-offset:2px}
.btn.block{width:100%;margin-top:18px}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.6}
.err{color:var(--red);font-size:14px;margin-top:10px;text-align:center;min-height:21px}
.pw{position:relative}.pw input{padding-right:100px!important}.eye{position:absolute;right:2px;top:2px;height:44px;min-width:44px;padding:0 10px;display:flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--teal);font-weight:700;font-size:13px;border-radius:10px}
/* frame */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);height:58px}
.hd{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;height:58px}
.hd .logo{width:110px;height:32px;flex:none}.hd .who{flex:1;min-width:0;text-align:right}.hd .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .who span{font-size:12px;color:var(--soft)}
.iconb{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
main{max-width:720px;margin:0 auto;padding:6px 16px calc(var(--nav) + 28px + env(safe-area-inset-bottom));min-height:calc(100vh - 58px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:720px;margin:0 auto;display:flex;height:var(--nav)}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--soft);min-height:44px;padding:4px 0}
.nav button b{font-size:13px;font-weight:700;line-height:1.1}.nav button i{font-style:normal;font-size:10px;line-height:1.1;font-weight:500}
.nav button[aria-selected=true]{color:var(--teal)}.nav button[aria-selected=true] b{color:var(--teal)}
@media (min-width:900px){.nav{top:58px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:rgba(255,255,255,.97)}.nav .in{height:52px}.nav button{flex-direction:row;gap:6px}.nav button i{font-size:12px}main{padding-top:64px;padding-bottom:40px}}
/* blocks */
h2{font-size:18px;font-weight:800;margin:22px 0 10px;line-height:1.3;display:flex;align-items:baseline;gap:8px}h2 .en{display:inline;font-size:12.5px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px rgba(43,36,80,.04),0 4px 14px rgba(43,36,80,.05)}
.card+.card{margin-top:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;padding:12px 14px;min-height:96px;box-shadow:0 1px 2px rgba(43,36,80,.04),0 4px 14px rgba(43,36,80,.05)}
.kpi .l{font-size:13px;color:var(--mute);font-weight:600}.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}.kpi .v small{font-size:13px;font-weight:600;color:var(--mute);margin-left:3px}
.kpi .s{font-size:12px;color:var(--soft);margin-top:2px}.kpi .v.sm{font-size:16.5px;margin-top:9px;white-space:nowrap;letter-spacing:-.01em}
.kpi.red .v{color:var(--coral)}.kpi.teal .v{color:var(--teal)}
.hero{background:linear-gradient(135deg,#00707A,#5B4B9E);color:#fff;border-radius:20px;padding:16px 18px;min-height:132px;box-shadow:0 8px 22px rgba(43,36,80,.16)}
.hero .l{font-size:13px;opacity:.92;font-weight:600}.hero .big{font-size:26px;font-weight:800;line-height:1.25;margin:6px 0 2px;font-variant-numeric:tabular-nums}.hero .sub{font-size:14px;opacity:.95}.hero .en{color:rgba(255,255,255,.82)}

.greet{margin:14px 2px 12px;font-size:19px;font-weight:800;line-height:1.3;min-height:46px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--tealT);color:var(--teal);line-height:1.35}
.tag.green{background:var(--greenT);color:var(--green)}.tag.red{background:var(--redT);color:var(--red)}.tag.grey{background:#EEF0F4;color:#4C4868}.tag.purple{background:var(--purpleT);color:var(--purple)}.tag.amber{background:var(--amberT);color:var(--amber)}
.note{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5}.note b{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.note.amber{background:var(--amberT);color:var(--amber)}.note.teal{background:var(--tealT);color:var(--teal)}.note.grey{background:#EEF0F4;color:#4C4868}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:56px}.li:first-child{border-top:0}
.dt{width:52px;flex:none;text-align:center;border-radius:12px;background:var(--tealT);color:var(--teal);padding:5px 0;line-height:1.15}.dt b{display:block;font-size:19px;font-weight:800}.dt span{font-size:11px;font-weight:600}
.li .t{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}.li .m{font-size:13px;color:var(--mute)}
.bar{height:10px;border-radius:99px;background:#E6F4F4;overflow:hidden}.bar i{display:block;height:100%;background:#3FA7A8;border-radius:99px}
.mrow{display:grid;grid-template-columns:96px 42px 1fr;align-items:center;gap:8px;padding:6px 0;font-size:14px}.mrow .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:#EEF0F4;border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--mute);font-size:14px}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(43,36,80,.12)}
.ring{position:relative;width:62px;height:62px;flex:none;border-radius:50%;background:conic-gradient(var(--teal2) calc(var(--p)*1%),#E6F6F8 0);display:flex;flex-direction:column;align-items:center;justify-content:center}.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}.ring b,.ring span{position:relative}.ring b{font:400 19px/1 var(--fh);color:var(--ink)}.ring span{font-size:11px;color:var(--mute)}
.skl{display:grid;gap:6px;margin-top:12px}.skl>div{display:grid;grid-template-columns:86px 1fr 46px 50px;align-items:center;gap:8px;font-size:13.5px}.skl small{color:var(--mute);font-weight:400;font-size:11px}.skl b{text-align:right}.skd{text-align:right}.skd .dl{padding:1px 5px}.sdbar{height:8px;border-radius:8px;background:#E6F6F8;overflow:hidden}.sdbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#01B0BF,#5B9EA6)}
.fbo{border-top:1px solid var(--line);padding:10px 0}.fbo:first-child{border-top:0}.fbo summary{list-style:none;cursor:pointer;min-height:44px}.fbo summary::-webkit-details-marker{display:none}.fbo[open] summary{margin-bottom:4px}.tag.grey{background:#EEF0F4;color:#4C4868}
.dl{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700;font-style:normal;white-space:nowrap;line-height:1.5;vertical-align:middle}.dl svg{flex:none}.dl.up{background:#E5F3EB;color:#24683F}.dl.dn{background:#F9E3DD;color:#9A3A26}.dl.eq{background:#EEF0F4;color:#5E5A76}
.sec{background:#F6F7FA;border-radius:12px;padding:10px 12px;margin-top:8px}.sec b{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--teal);margin-bottom:2px}.sec p{margin:0;white-space:pre-wrap;font-size:14.5px;line-height:1.55}

.done.on{background:var(--greenT);border-color:#BFE3D2;color:var(--green)}
.mute{color:var(--mute)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.skel{border-radius:18px;background:linear-gradient(90deg,#ECEDF2 25%,#F6F7FA 50%,#ECEDF2 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:26px}
.chipb{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;color:var(--teal)}

.stair{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:150px;margin-top:6px}
.stp{border-radius:10px 10px 4px 4px;background:#F1F2F6;color:#6E6B84;text-align:center;padding-top:6px;position:relative;font-size:11px;line-height:1.2}
.stp b{display:block;font-size:12px;font-weight:800}.stp.dn{background:#DDF2F1;color:var(--teal)}.stp.now{background:#2E6E78;color:#fff}.stp.nx{background:#fff;border:2px dashed #E3B341;color:#7A5A00}

.pic{width:100%;border-radius:12px;border:1px solid var(--line);display:block;background:#fff}
#stage{position:fixed;left:-10000px;top:0;width:760px;background:#fff}
</style>

async function call(op, body) {
  const ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(() => ctl.abort(), 30000) : 0;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ op }, body || {})), signal: ctl ? ctl.signal : undefined });
    const j = await r.json().catch(() => ({ ok: false }));
    if (j && j.error === 'AUTH') { put(KEY, ''); put(DKEY, ''); S.d = null; show(false); throw new Error('AUTH'); }
    return j;
  } finally { clearTimeout(t); }
}
function show(app) { $('login').classList.toggle('hide', !!app); $('app').classList.toggle('hide', !app); if (!app) setTimeout(() => { try { $('u').focus(); } catch (e) {} }, 50); }
async function signIn() {
  const b = $('go'), e = $('err'); e.textContent = ''; b.disabled = true; b.textContent = '正在登录…';
  try {
    const r = await call('login', { code: $('u').value, password: $('p').value });
    if (!r || !r.ok) { e.textContent = (r && r.msg) || '登录失败，请重试 · Could not sign in'; return; }
    put(KEY, r.token); $('p').value = ''; $('p').type = 'password'; document.querySelectorAll('.eye').forEach(x => { x.setAttribute('aria-pressed', 'false'); x.innerHTML = EYE(false); }); S.d = null; start();
  } catch (x) { if (String(x && x.message) !== 'AUTH') e.textContent = '网络连接失败，请稍后再试 · Network problem'; }
  finally { b.disabled = false; b.innerHTML = '登录<span class="sr"> Sign in</span>'; }
}

function start() { show(true); try { const c = JSON.parse(get(DKEY) || 'null'); if (c && c.ok) S.d = c; } catch (e) {} const t = get(TKEY); if (TABS.some(x => x[0] === t)) S.tab = t; nav(); paint(); load(); }
let LOADING = false;
async function load(quiet) {   // quiet: the 60-second / back-to-the-page refresh — repaints only if something changed, keeps the scroll position
  if (LOADING) return; LOADING = true;
  const sig = x => { try { const { at, ...r } = x || {}; return JSON.stringify(r, (k, v) => k === 'html' ? undefined : v); } catch (e) { return ''; } };   // the Lesson summary picture carries its own time; its numbers are compared instead
  try { const r = await call('all', { token: get(KEY) }); if (r && r.ok) { const same = quiet && S.d && sig(S.d) === sig(r) && (S.d.hw || []).length <= (r.hw || []).length;
      if (quiet && S.d && (S.d.hw || []).length > (r.hw || []).length) r.hw = (r.hw || []).concat(S.d.hw.slice((r.hw || []).length));   /* keep notes already loaded with 加载更多 */
      S.d = r; S.err = 0; try { put(DKEY, JSON.stringify(r)); } catch (e) {} if (same) { LOADING = false; return; } } else if (!S.d) S.err = 1; }
  catch (e) { if (e.message !== 'AUTH' && !S.d) S.err = 1; }
  LOADING = false; paint();
}

async function snap(el, w) {
  const css = [...document.querySelectorAll('style')].map(s => s.textContent).join('\n').replace(/@font-face\{[^}]*\}/g, '');
  const html = new XMLSerializer().serializeToString(el), h = Math.ceil(el.getBoundingClientRect().height) + 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;background:#fff;font:15px/1.55 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#2B2450"><style>${css.replace(/</g, '\\3c ')}</style>${html}</div></foreignObject></svg>`;
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  try { const img = new Image(); img.src = src; await (img.decode ? img.decode() : new Promise((a, b) => { img.onload = a; img.onerror = b; }));
    const c = document.createElement('canvas'), k = 2; c.width = w * k; c.height = h * k; const x = c.getContext('2d'); x.scale(k, k); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0); return c.toDataURL('image/png'); }
  catch (e) { return src; }
}

const EYE = on => '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (on ? '<path d="M3 3l18 18"/><path d="M10.6 5.6A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3.2 3.9M6.2 6.9A17 17 0 0 0 2.5 12S6 18.5 12 18.5a9.5 9.5 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>' : '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>') + '</svg>' + (on ? '隐藏 Hide' : '显示 Show');
function eye(b) { const i = $(b.getAttribute('aria-controls')); if (!i) return; const sh = i.type === 'password'; i.type = sh ? 'text' : 'password'; b.setAttribute('aria-pressed', sh ? 'true' : 'false'); b.setAttribute('aria-label', sh ? '隐藏密码 Hide password' : '显示密码 Show password'); b.innerHTML = EYE(sh); try { i.focus({ preventScroll: true }); } catch (e) {} }
function eyes() { document.querySelectorAll('.eye').forEach(b => { if (!b.innerHTML) b.innerHTML = EYE(false); }); }
function closeSh() { $('sh').classList.add('hide'); }
function pwSheet() { $('shIn').innerHTML = `<h3>设置新密码<span class="en">Set my own password</span></h3><p class="small mute" style="margin:0">设置后，学员英文名将不能再用来登录。忘记密码请联系运营老师重置。${en('After this, the English name no longer works for signing in.')}</p>
  <label for="np">新密码<span class="en">New password · at least 6</span></label><div class="pw"><input id="np" type="password" autocomplete="new-password"><button type="button" class="eye" aria-pressed="false" aria-controls="np" aria-label="显示密码 Show password" onclick="eye(this)"></button></div><label for="np2">再输入一次<span class="en">Type it again</span></label><div class="pw"><input id="np2" type="password" autocomplete="new-password"><button type="button" class="eye" aria-pressed="false" aria-controls="np2" aria-label="显示密码 Show password" onclick="eye(this)"></button></div>
  <div id="pe" class="err"></div><button id="pg" class="btn block" onclick="setPw()">保存 · Save</button><button class="btn ghost block" style="margin-top:8px" onclick="closeSh()">取消 · Cancel</button>`; $('sh').classList.remove('hide'); eyes(); }
async function setPw() { const a = $('np').value, b = $('np2').value, e = $('pe'); e.textContent = '';
  if (a.length < 6) { e.textContent = '密码至少6位 · At least 6 characters'; return; } if (a !== b) { e.textContent = '两次输入不一致 · The two passwords differ'; return; }
  $('pg').disabled = true; try { const r = await call('setpw', { token: get(KEY), password: a }); if (r && r.ok) { closeSh(); S.d.own = true; alert('新密码已保存 · New password saved'); } else e.textContent = (r && r.msg) || '没有保存 · Not saved'; }
  catch (x) { if (x.message !== 'AUTH') e.textContent = '网络连接失败 · Network problem'; } finally { const g = $('pg'); if (g) g.disabled = false; } }
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSh(); });
logos(); eyes();
if (get(KEY)) start(); else show(false);
</script>
