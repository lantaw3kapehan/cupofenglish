async function snap(el, w) {

  const html = new XMLSerializer().serializeToString(el), h = Math.ceil(el.getBoundingClientRect().height) + 2;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;background:#fff;font:15px/1.55 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#2B2450"><style>${css.replace(/</g, '\\3c ')}</style>${html}</div></foreignObject></svg>`;
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  try { const img = new Image(); img.src = src; await (img.decode ? img.decode() : new Promise((a, b) => { img.onload = a; img.onerror = b; }));
    const c = document.createElement('canvas'), k = 2; c.width = w * k; c.height = h * k; const x = c.getContext('2d'); x.scale(k, k); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0); return c.toDataURL('image/png'); }
  catch (e) { return src; }
}

  h += phH2('Attendance · last 4 months') + `<div class="kpis"><div class="kpi"><div class="l">Attended</div><div class="v">${dn}</div><div class="s">This month ${dM(m0)} ${dl(dM(m0) - dM(m1), '', 'vs last month')}</div></div><div class="kpi teal"><div class="l">Attendance</div><div class="v">${all ? Math.round(100 * dn / all) + '%' : '—'}</div><div class="s">${ab ? ab + ' absent' : 'No absences'}</div></div></div>`;
  h += phReports();
  return h + phFoot('CupOfEnglish · It\'s more than English. It\'s your next chapter.'); }
