<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>CupOfEnglish Assessment</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--navy:#2B2253;--ink:#2B2450;--teal:#0E7C7B;--teal7:#00707A;--mute:#6B6880;--line:#E8E6EF;--page:#F1F5F6;--card:#fff;--tint:#EEF7F7;--lav:#F2F0FA;--warm:#FFF6E8;--bad:#B42318;
  --f:'COE Card Inter',Inter,'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--b:'COE Card Fredoka','Fredoka One',var(--f)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:28px;padding:28px 28px 24px;box-shadow:0 1px 2px rgba(43,36,80,.05),0 12px 32px -18px rgba(43,36,80,.25)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.top img{height:52px;display:block}
.pill{background:#ECE9F7;color:var(--navy);font-weight:700;font-size:14px;border-radius:999px;padding:9px 16px;white-space:nowrap}
hr{border:0;height:2px;background:var(--line);margin:18px 0}
.lab{color:var(--mute);font-size:14px}
h1{font-family:var(--b);font-weight:400;color:var(--navy);font-size:36px;line-height:1.15;margin:4px 0 4px}
.sub{color:#4A4766;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0 12px}
.tile{border-radius:20px;padding:18px 20px;background:var(--tint)}.tile.w{background:var(--lav)}
.tile .l{color:var(--mute);font-weight:600;font-size:14px}.tile .n{font-family:var(--b);font-size:58px;color:var(--navy);line-height:1.05;margin:4px 0}.tile .c{color:var(--teal);font-weight:700;font-size:15px}
.comb{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#fff;border-radius:18px;padding:14px 20px;margin-bottom:8px}
.comb b{font-family:var(--b);font-weight:400;font-size:28px}
h2{font-size:17px;color:var(--navy);margin:22px 0 10px}
.bar{display:grid;grid-template-columns:minmax(150px,1.3fr) 2fr 30px;gap:12px;align-items:center;margin:9px 0;font-size:14.5px;color:#4A4766}
.bar i{display:block;height:12px;border-radius:8px;background:#EEEDF3;overflow:hidden}.bar i s{display:block;height:100%;background:var(--teal);border-radius:8px}
.bar b{text-align:right;color:var(--navy)}
.box{border-radius:18px;padding:16px 20px;margin:10px 0;line-height:1.55;font-size:15.5px;white-space:pre-wrap}
.box .k{display:block;white-space:normal;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#8A86A0;border-top:0}
tr.on td{background:var(--tint);color:#00575F;font-weight:700}
.note{color:var(--mute);font-size:13px;line-height:1.5;margin-top:12px}
.tag{display:block;width:220px;margin:22px auto 4px}
.btn{border:0;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:var(--teal7);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D8D5E3}
.btn:disabled{opacity:.55;cursor:default}
.prompt{background:var(--tint);border-radius:18px;padding:16px 20px;line-height:1.6;white-space:pre-wrap;font-size:15.5px}
.bar2{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--page);padding:10px 0}
.clk{font-family:var(--b);font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums;min-width:96px}.clk.low{color:var(--bad)}
.wc{font-weight:700;font-size:14px;border-radius:999px;padding:6px 12px;background:var(--warm);color:#7A4A00}.wc.ok{background:#E6F4EC;color:#1E6E4C}
.st{color:var(--mute);font-size:13px;margin-left:auto}
textarea{width:100%;min-height:52vh;border:1px solid #D8D5E3;border-radius:18px;padding:16px 18px;font:inherit;font-size:16px;line-height:1.65;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:2px solid rgba(0,112,122,.45);border-color:var(--teal7)}
.center{text-align:center}
.msg{padding:40px 10px;text-align:center;color:#4A4766;font-size:16px;line-height:1.6}
@media(max-width:560px){.card{padding:22px 18px 20px;border-radius:22px}.top img{height:42px}h1{font-size:30px}.tile .n{font-size:46px}.tiles{gap:8px}.tile{padding:14px}.bar{grid-template-columns:1fr 1.2fr 24px;font-size:13.5px}}
@media print{body{background:#fff}.wrap{padding:0}.card{box-shadow:none}.noprint{display:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><div class="msg">Loading…</div></div></div>
<script>
(function(){
  var URL = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/coe-assess';
  var q = new URLSearchParams(location.search), W = (q.get('w') || '').trim(), R = (q.get('r') || '').trim(), $app = document.getElementById('app');
  var E = function(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var call = function(o){ return fetch(URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(o) }).then(function(r){ return r.json(); }); };
  var b1 = function(v){ return v == null || v === '' ? '—' : (+v).toFixed(1); };
  var head = function(pill){ return '<div class="top"><img src="logo.png" alt="CupOfEnglish"><span class="pill">' + E(pill) + '</span></div><hr>'; };
  var foot = '<img class="tag" src="tag.png" alt="Learn with the best to be the best">';
  var ESSAY = 'Some people believe that universities should focus primarily on providing students with academic knowledge, while others argue that developing practical skills, such as communication and critical thinking, is equally important.\n\nDiscuss both views and give your own opinion.\n\nGive reasons for your answer and include relevant examples from your own knowledge or experience.\n\nWrite at least 250 words.';
  var SP = [['fc', 'Fluency and Coherence'], ['lr', 'Lexical Resource'], ['gra', 'Grammatical Range and Accuracy'], ['p', 'Pronunciation']];
  var WR = [['tr', 'Task Response'], ['cc', 'Coherence and Cohesion'], ['lr', 'Lexical Resource'], ['gra', 'Grammatical Range and Accuracy']];
  var GUIDE = [[4, 4.5, '4.0–4.5', 'Limited communication; frequent language difficulties', 'B1 range'], [5, 5.5, '5.0–5.5', 'Developing communication; noticeable limitations in accuracy and complexity', 'B1–B2'], [6, 6.5, '6.0–6.5', 'Generally effective communication; some inconsistencies', 'B2'], [7, 7.5, '7.0–7.5', 'Good command; can communicate complex ideas effectively', 'C1 range'], [8, 9, '8.0–9.0', 'Very good to expert command', 'C1–C2']];
  function fail(m){ $app.innerHTML = head('English Assessment') + '<div class="msg">' + E(m) + '</div>' + foot; }

  // ---------------- result ----------------
  function result(){
    call({ op: 'result', rkey: R }).then(function(r){ if(!r || !r.ok) return fail(r && r.msg || 'This result is not available.'); var a = r.a;
      var bars = function(C, v){ return C.map(function(x){ var n = v && v[x[0]]; return '<div class="bar"><span>' + E(x[1]) + '</span><i><s style="width:' + (n == null ? 0 : Math.max(3, n / 9 * 100)) + '%"></s></i><b>' + (n == null ? '—' : n) + '</b></div>'; }).join(''); };
      var box = function(k, t, bg){ return String(t || '').trim() ? '<div class="box" style="background:' + bg + '"><span class="k">' + E(k) + '</span>' + E(t) + '</div>' : ''; };
      var c = a.combined;
      $app.innerHTML = head('English Assessment') +
        '<div class="lab">Initial English Proficiency Assessment · IELTS-aligned</div><h1>' + E(a.name) + '</h1>' +
        '<div class="sub">' + E(new Date(a.assess_date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })) + (a.assessor ? ' · Assessor: ' + E(a.assessor) : '') + '</div>' +
        '<div class="tiles"><div class="tile"><div class="l">Speaking</div><div class="n">' + b1(a.sp_band) + '</div><div class="c">' + (a.cefr_sp ? 'CEFR ' + E(a.cefr_sp) : '') + '</div></div>' +
        '<div class="tile w"><div class="l">Academic Writing · Task 2</div><div class="n">' + b1(a.wr_band) + '</div><div class="c">' + (a.cefr_wr ? 'CEFR ' + E(a.cefr_wr) : '') + '</div></div></div>' +
        (c != null ? '<div class="comb"><span>Speaking + Writing estimate</span><b>' + b1(c) + (a.cefr ? ' · ' + E(a.cefr) : '') + '</b></div>' : '') +
        '<h2>Speaking criteria</h2>' + bars(SP, a.sp) + '<div class="note" style="margin-top:4px">The four criteria carry equal weight.</div>' +
        '<h2>Writing criteria</h2>' + bars(WR, a.wr) + '<div class="note" style="margin-top:4px">Task 2 only' + (a.essay_words ? ' · ' + a.essay_words + ' words written' : '') + '. A full IELTS Writing score also includes Task 1, and Task 2 counts twice as much as Task 1.</div>' +
        '<h2>Your results</h2>' + box('Observed strengths', a.strengths, 'var(--tint)') + box('Areas for improvement', a.improve, 'var(--warm)') + box('Recommended learning pathway', a.pathway, 'var(--lav)') +
        '<h2>What the bands mean</h2><table><tr><th>IELTS band</th><th>General interpretation</th><th>Approx. CEFR</th></tr>' + GUIDE.map(function(g){ return '<tr class="' + (c != null && +c >= g[0] && +c <= g[1] ? 'on' : '') + '"><td>' + g[2] + '</td><td>' + E(g[3]) + '</td><td>' + E(g[4]) + '</td></tr>'; }).join('') + '</table>' +
        '<div class="note">This is an internal estimate that follows the IELTS band descriptors (whole bands 0–9 for each criterion). It is not an official IELTS result. CEFR comparisons are approximate, not exact conversions; IELTS band 4.0 can also overlap A2/B1 depending on the skill.</div>' +
        '<div class="center noprint" style="margin-top:16px"><button class="btn ghost" onclick="print()">Print / save as PDF</button></div>' + foot;
      document.title = a.name + ' · CupOfEnglish Assessment';
    }, function(){ fail('Could not load. Check the connection and open the link again.'); });
  }

  // ---------------- essay ----------------
  var S = { st: null, sub: null, off: 0, t: 0, saving: 0, dirty: 0, done: 0, name: '' };
  var LK = 'coe.essay.' + W;
  var words = function(t){ t = String(t || '').trim(); return t ? t.split(/\s+/).length : 0; };
  function essay(){
    call({ op: 'cget', wkey: W }).then(function(r){ if(!r || !r.ok) return fail(r && r.msg || 'This link is not valid.'); S.name = r.name || ''; S.off = Date.parse(r.now) - Date.now();
      if(r.closed) return closed(r.submitted_at ? 'Your essay has been submitted. Thank you!' : 'The writing time has ended. Thank you!');
      if(r.started_at){ S.st = Date.parse(r.started_at); return write(r.essay); }
      $app.innerHTML = head('Academic Writing · Task 2') + '<div class="lab">Hello' + (S.name ? ' ' + E(S.name) : '') + ',</div><h1>Writing assessment</h1>' +
        '<div class="sub" style="line-height:1.6">You have <b>40 minutes</b>. Write at least <b>250 words</b>. Your writing is saved as you type. When the time ends, your essay is sent automatically. Spell-check is off, as in the IELTS test, and pasting is not allowed.</div>' +
        '<div class="center" style="margin:24px 0 4px"><button class="btn" id="go">Start · 40 minutes</button></div>' + foot;
      document.getElementById('go').onclick = function(){ this.disabled = true; this.textContent = 'Starting…'; call({ op: 'cget', wkey: W, start: 1 }).then(function(x){ if(!x || !x.ok || !x.started_at) return fail(x && x.msg || 'Could not start. Open the link again.'); S.off = Date.parse(x.now) - Date.now(); S.st = Date.parse(x.started_at); write(x.essay); }, function(){ fail('Could not start. Check the connection.'); }); };
    }, function(){ fail('Could not load. Check the connection and open the link again.'); });
  }
  function closed(m){ try{ localStorage.removeItem(LK); }catch(e){} $app.innerHTML = head('Academic Writing · Task 2') + '<div class="msg"><h1 style="font-size:30px">Thank you' + (S.name ? ', ' + E(S.name) : '') + '!</h1>' + E(m) + '<br>Your assessor will go through the results with you.</div>' + foot; }
  function write(server){
    var draft = ''; try{ draft = localStorage.getItem(LK) || ''; }catch(e){}
    var text = draft.length > (server || '').length ? draft : (server || '');
    $app.innerHTML = head('Academic Writing · Task 2') + '<div class="prompt">' + E(ESSAY) + '</div>' +
      '<div class="bar2"><span class="clk" id="clk">40:00</span><span class="wc" id="wc">0 words</span><span class="st" id="st"></span></div>' +
      '<textarea id="ta" spellcheck="false" autocorrect="off" autocapitalize="sentences" autocomplete="off" placeholder="Start writing your essay here…"></textarea>' +
      '<div class="center" style="margin-top:14px"><button class="btn" id="send">Submit my essay</button></div>' + foot;
    var ta = document.getElementById('ta'); ta.value = text; count();
    ['paste', 'drop'].forEach(function(ev){ ta.addEventListener(ev, function(e){ e.preventDefault(); stat('Pasting is not allowed — please type your answer'); }); });
    ta.addEventListener('input', function(){ S.dirty = 1; try{ localStorage.setItem(LK, ta.value); }catch(e){} count(); clearTimeout(S.t); S.t = setTimeout(save, 1200); });
    document.getElementById('send').onclick = function(){ if(words(ta.value) < 250 && !confirm('You have ' + words(ta.value) + ' words (at least 250 are expected). Submit anyway?')) return; if(words(ta.value) >= 250 && !confirm('Submit your essay now? You cannot change it after this.')) return; save(1); };
    if(text !== (server || '')) { S.dirty = 1; save(); }
    tick(); S.iv = setInterval(tick, 500); setInterval(function(){ if(S.dirty && !S.saving) save(); }, 8000);
    window.addEventListener('beforeunload', function(e){ if(S.dirty && !S.done){ e.preventDefault(); e.returnValue = ''; } });
  }
  function count(){ var n = words(document.getElementById('ta').value), w = document.getElementById('wc'); w.textContent = n + ' words'; w.className = 'wc' + (n >= 250 ? ' ok' : ''); }
  function stat(t){ var s = document.getElementById('st'); if(s) s.textContent = t; }
  function tick(){ if(S.done) return; var left = Math.max(0, S.st + 40 * 60000 - (Date.now() + S.off)) / 1000, c = document.getElementById('clk'); if(!c) return;
    c.textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0'); c.className = 'clk' + (left < 300 ? ' low' : '');
    if(left <= 0){ clearInterval(S.iv); var ta = document.getElementById('ta'); ta.readOnly = true; stat('Time is up — sending your essay…'); save(1); } }
  function save(submit){ var ta = document.getElementById('ta'); if(!ta || S.done) return; if(S.saving){ if(submit) setTimeout(function(){ save(1); }, 600); return; }
    S.saving = 1; S.dirty = 0; stat(submit ? 'Sending…' : 'Saving…'); var b = document.getElementById('send'); if(submit && b) b.disabled = true;
    call({ op: 'csave', wkey: W, essay: ta.value, submit: submit ? 1 : 0 }).then(function(r){ S.saving = 0;
      if(r && r.ok){ if(submit || r.submitted_at){ S.done = 1; clearInterval(S.iv); return closed('Your essay has been submitted (' + (r.words || 0) + ' words).'); } stat('Saved'); return; }
      if(r && r.closed){ S.done = 1; return closed(r.msg || 'The writing time has ended.'); }
      S.dirty = 1; stat('Not saved yet — check the connection'); if(b) b.disabled = false; if(submit) setTimeout(function(){ save(1); }, 3000);
    }, function(){ S.saving = 0; S.dirty = 1; stat('Offline — your writing is kept on this device and will be sent'); if(b) b.disabled = false; if(submit) setTimeout(function(){ save(1); }, 3000); });
  }

  if(/^[0-9a-f]{32}$/.test(R)) result(); else if(/^[0-9a-f]{32}$/.test(W)) essay(); else fail('This link is not valid.');
})();
</script>
</body>
</html>
