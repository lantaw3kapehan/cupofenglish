<style id="s2535">
#be2501 .t.f2535 .it{display:none}
#be2501 .t.h2535{display:none}
#be2501 .s2535{font-size:13px;color:#6B6880;margin:2px 0 0;cursor:pointer}
#be2501 .s2535 em{font-style:normal;color:#A2462C}
#be2501 .s2535 u{text-decoration:none;color:#2B2253;margin-left:6px}
#be2501 .more2535{display:inline-block;font-size:13px;color:#2B2253;cursor:pointer;margin-top:8px}
#pd2360 .k2474{gap:8px;margin-top:8px}
#pd2360 .k2474>div[role]{padding:8px 12px!important;min-height:0!important}
#pd2360 .k2474 b{font-size:19px!important}
@media(min-width:520px){#pd2360 .k2474{grid-template-columns:repeat(4,minmax(0,1fr))!important}}
#pd2360 .k2474 span{font-size:12.5px}
#pd2360 .g2535{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid #EEF0F3;cursor:pointer;font-size:14px}
#pd2360 .g2535 span{font-size:13px;color:#6B6880}
#pd2360 .g2535 i{font-style:normal;font-size:13px;color:#2B2253;white-space:nowrap}
#pd2360 .x2535{display:none!important}
#pd2360 details.r2360{padding-top:6px;padding-bottom:6px}
</style>
<script id="b2535">
/* 2535 (Misty 16:39 "build it and make it live"): Overview is shorter.
   Behind: each teacher is one line ("3 overdue · oldest 42 days"), longest waiting first, first 3 shown; tap the line to see the items.
   From Operations: only what still waits for an answer stays open; answered items, Solved today and Her week fold to one line each. */
(function(){
  const OPEN = window.__op2535 = window.__op2535 || {};
  const days = el => { let m = 0; el.querySelectorAll('.it .dd').forEach(d => { const x = /(\d+)\s*days?/.exec(d.textContent); if(x) m = Math.max(m, +x[1]); }); return m; };
  function behind(sec){
    const all = [...sec.querySelectorAll(':scope > .t')]; if(!all.length) return;
    const nud = t => /Nudged\s*\d/.test(t.textContent);
    const live = all.filter(t => !nud(t)), rest = all.filter(nud);
    live.forEach(t => {
      const tn = t.querySelector('.tn'); if(!tn) return;
      const name = (tn.firstChild && tn.firstChild.textContent || '').trim();
      const n = t.querySelectorAll('.it').length, d = days(t);
      let s = t.querySelector(':scope > .s2535');
      const key = name, open = !!OPEN['b:' + key];
      const txt = n + ' overdue' + (d ? ' · <em>oldest ' + d + ' day' + (d === 1 ? '' : 's') + '</em>' : '') + '<u>' + (open ? 'Hide' : 'Show') + '</u>';
      if(!n) return;
      if(!s){ s = document.createElement('div'); s.className = 's2535'; tn.after(s); s.onclick = () => { OPEN['b:' + key] = !OPEN['b:' + key]; run(); }; }
      if(s.innerHTML !== txt) s.innerHTML = txt;
      t.classList.toggle('f2535', !open); t.dataset.d2535 = d;
    });
    const sorted = live.slice().sort((a, b) => (+b.dataset.d2535 || 0) - (+a.dataset.d2535 || 0));
    const more = sec.querySelector(':scope > .more');
    const anchor = sec.querySelector(':scope > .more, :scope > .more2535') || null;
    const want = sorted.concat(rest);
    if(want.some((t, i) => all[i] !== t)) want.forEach(t => sec.insertBefore(t, anchor));
    const showAll = (more && /fewer/i.test(more.textContent)) || window.__be2535all;
    sorted.forEach((t, i) => t.classList.toggle('h2535', !showAll && i >= 3));
    const hidden = !showAll && sorted.length > 3;
    let m2 = sec.querySelector(':scope > .more2535');
    if(more){ if(m2) m2.remove(); return; }
    if(sorted.length <= 3 && !window.__be2535all){ if(m2) m2.remove(); return; }
    if(!m2){ m2 = document.createElement('span'); m2.className = 'more2535'; sec.appendChild(m2); m2.onclick = () => { window.__be2535all = !window.__be2535all; run(); }; }
    const t2 = hidden ? 'Show all ' + sorted.length + ' to nudge' : 'Show fewer';
    if(m2.textContent !== t2) m2.textContent = t2;
  }
  function ops(pd){
    const solved = [...pd.querySelectorAll(':scope > .p2452')].find(p => /^Solved today/.test((p.querySelector('b') || {}).textContent || ''));
    if(solved) fold(pd, solved, 'solved', 'Solved today · ' + solved.querySelectorAll('.pr').length, [...solved.querySelectorAll('.pr')].map(p => ((p.querySelector('.small') || p).textContent || '').trim().split(/\s|·/)[0]).filter(Boolean).slice(0, 4).join(' · '));
    const ans = [...pd.querySelectorAll(':scope > .r2360')].filter(r => r.querySelector('.ans') && /You answered/.test(r.textContent));
    if(ans.length) fold(pd, ans, 'ans', 'Answered by you · ' + ans.length, ans.map(r => ((r.querySelector('b') || {}).textContent || '').trim()).join(' · '));
    else { const g = pd.querySelector(':scope > .g2535[data-k="ans"]'); if(g) g.remove(); }
    const wk = [...pd.querySelectorAll(':scope > .r2360')].find(r => r.querySelector('table.wk2474'));
    if(wk){ const tr = wk.querySelectorAll('tr')[1]; fold(pd, wk, 'week', 'Her week', tr ? [...tr.children].map(c => c.textContent.trim()).filter(Boolean).slice(0, 1).concat(['done ' + (tr.children[1] || {}).textContent, 'found ' + (tr.children[2] || {}).textContent, 'fixed ' + (tr.children[3] || {}).textContent]).join(' · ') : ''); }
  }
  function fold(pd, els, k, title, sub){
    els = [].concat(els); const open = !!OPEN['o:' + k];
    let g = pd.querySelector(':scope > .g2535[data-k="' + k + '"]');
    if(!g){ g = document.createElement('div'); g.className = 'g2535'; g.dataset.k = k; g.onclick = () => { OPEN['o:' + k] = !OPEN['o:' + k]; run(); }; }
    if(g.nextElementSibling !== els[0]) els[0].before(g);
    const h = '<div><b style="font-weight:600">' + title + '</b>' + (sub ? '<br><span>' + sub.replace(/[<>&]/g, '') + '</span>' : '') + '</div><i>' + (open ? 'Hide' : 'Show') + '</i>';
    if(g.innerHTML !== h) g.innerHTML = h;
    els.forEach(e => e.classList.toggle('x2535', !open));
  }
  let busy = 0, q = 0;
  function run(){ if(busy) return; busy = 1; try{ const b = document.getElementById('be2501'); if(b) behind(b); const p = document.getElementById('pd2360'); if(p) ops(p); }catch(e){ console.warn('2535', e); } finally { busy = 0; } }
  window.run2535 = run;
  document.addEventListener('click', e => { if(e.target.closest && e.target.closest('#be2501 .more')) setTimeout(run, 0); }, true);
  const mo = new MutationObserver(() => { if(busy || q) return; q = requestAnimationFrame(() => { q = 0; run(); }); });
  function start(){ const v = document.getElementById('v-home') || document.body; mo.observe(v, { childList: true, subtree: true }); run(); }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
