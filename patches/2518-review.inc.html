<script id="b2518">
/* 2518 (Misty 20 Nov): Performance Improvement Plan and Accountability Review (Annex A), for office staff under the Regular Employment Contract.
   President: Overview card "Celine · Performance review" → write the notice, log concerns (Annex A category, occurrence, contract step), send, weekly check-ins, decide.

(function(){
  const URL0 = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/coe-review', STAFF = 'Celine';
  const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const dt = s => { if(!s) return ''; const d = new Date(new Date(s).getTime() + 8 * 3600e3); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); };
  const today = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const ord = n => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');
  let R = null, busy = false, AT = 0;
  async function call(body){ const r = await fetch(URL0, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ token: tok() }, body)) }); const j = await r.json().catch(() => ({ ok: false, error: 'No answer. Try again.' })); if(!j.ok) throw new Error(j.error || 'Not saved'); return j; }
  async function load(force){ if(!mgr()) return null; if(!force && R && Date.now() - AT < 60000) return R; if(busy) return R; busy = true;
    try{ R = await call({ op: 'get', staff: STAFF }); AT = Date.now(); }catch(x){} busy = false; return R; }
  const NOTICE = 'We have repeatedly addressed the same operational concerns through formal memoranda, direct reminders, and corrective instructions. Unfortunately, despite these efforts, the same lapses continue to occur and affect our daily operations.\n\nYour promotion and salary increase were given in recognition of the responsibilities entrusted to you and our expectation that you would demonstrate greater independence, accountability, and sound judgment.\n\nHowever, the recurring mistakes have continued to require unnecessary management intervention. This is no longer simply a matter of correcting isolated errors, but of evaluating whether the responsibilities of your position are being consistently fulfilled.\n\nWe cannot continue operating under circumstances where the same concerns must be addressed almost daily despite previous corrective measures.\n\nWe will therefore be conducting a formal review of your performance and responsibilities under your Regular Employment Contract of 3 July 2025 (Clause 5 and Annex A) and the Addendum of 22 March 2026. The documented concerns are listed below this notice, each with its date and what was expected. You will be given an opportunity to respond to the documented concerns before any further action is determined.\n\nWe expect you to take this matter seriously and demonstrate meaningful, consistent, and sustained improvement.';
  const DUTIES = [
    ['Communication (Annex A)', 'Respond to emails and messages promptly and professionally. Keep zero unanswered messages every day. Schedule and coordinate virtual classes and meetings.'],

    ['Problem resolution (Annex A)', 'Resolve minor issues independently. Escalate unresolved problems appropriately.'],
    ['Calendar and data entry (Annex A)', 'Schedule classes and meetings for students, teachers and management. Log completed lessons. Prepare simple reports.'],
    ['Administrative support (Annex A)', 'Expense logs, invoicing and compliance filing.'],
    ['Clause 5 · Addendum', 'Work with loyalty, independence and professionalism. As Operations Coordinator, report directly to the President.'],
    ['During this review', 'Before cancelling any class, check whether a swap or a move solves it, and write which you chose and why. No repeat of a concern already recorded here. Decide schedule, payment and cover matters yourself, with the reason written in the app.']];
  const AREAS = [['punct', 'Punctuality'], ['comm', 'Communication'], ['accuracy', 'Task accuracy'], ['collab', 'Collaboration']], SCL = ['', 'Needs work', 'OK', 'Good', 'Strong'];
  function page(){ let o = document.getElementById('rv2518'); if(!o){ o = document.createElement('div'); o.id = 'rv2518'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); document.body.appendChild(o); } return o; }
  function close(){ const o = document.getElementById('rv2518'); if(o) o.remove(); document.removeEventListener('keydown', esc); place(); }
  function esc(ev){ if(ev.key === 'Escape' && !/TEXTAREA|INPUT|SELECT/.test((document.activeElement || {}).tagName || '')) close(); }
  function draw(){ const o = page(), P = R && R.role === 'pres', rv = R && R.review, it = (R && R.items) || [], W = (R && R.weeks) || [], open = rv && rv.status === 'sent', L = (R && R.ladder) || {};
    const head = '<div class="rh"><div style="flex:1;min-width:0"><b>Performance Improvement Plan and Accountability Review</b><br><span>' + e(STAFF) + ' · Operations Coordinator · Annex A of the Regular Employment Contract</span></div><button class="bt" type="button" data-x="close">Close</button></div>';
    if(!rv){ o.innerHTML = head + '<div class="rw"><div class="rc">' + (P ? '<h2>No review for ' + e(STAFF) + ' yet</h2><p class="rs">Starting one makes a draft only you can see. Write the notice and log the concerns first; she sees nothing until you press Send.</p><div class="bts"><button class="bt p" type="button" data-x="create">Start the review (draft)</button></div>' : '<h2>No review</h2><p class="rs">Nothing to show.</p>') + '</div></div>'; return bind(); }
    const st = rv.status === 'draft' ? '<span class="pl pn">Draft · only you see it</span>' : rv.status === 'closed' ? '<span class="pl pg">Closed · ' + e(((R.outcomes || {})[rv.outcome]) || '') + '</span>' : !rv.response_at ? '<span class="pl pa">Open · waiting for her answer</span>' : '<span class="pl pa">Open · answer received</span>';
    const rep = it.filter(x => x.occ >= 2).length, ans = it.filter(x => x.her_reply).length;
    let h = head + '<div class="rw">';
    h += '<div class="rc"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>' + e(rv.title) + '</h2>' + st + '</div>'
      + '<p class="rs" style="margin:6px 0 0">Basis: Regular Employment Contract of 3 July 2025 (Clause 5 Duties, Clause 15 Termination) · Annex A Performance Evaluation and Performance Penalties · Addendum of 22 March 2026 (Operations Coordinator, reports to the President).' + (rv.sent_at ? ' Sent ' + dt(rv.sent_at) + '.' : '') + '</p>'
      + '<div class="st4"><div><b>' + it.length + '</b><span>concerns documented</span></div><div><b>' + rep + '</b><span>repeat occurrences</span></div><div><b>' + (rv.response_due ? dd(rv.response_due).replace(/ \d{4}$/, '') : '5 days') + '</b><span>' + (rv.response_due ? 'her answer due' : 'to answer, from Send') + '</span></div><div><b>' + (rv.ends_at ? dd(rv.ends_at).replace(/ \d{4}$/, '') : '30 days') + '</b><span>' + (rv.ends_at ? 'review ends' + (rv.extended ? ' (extended)' : '') : 'review length') + '</span></div></div></div>';
    /* 1 · notice */
    h += '<div class="rc"><p class="rk">1 · Notice</p>';
    if(P && rv.status === 'draft') h += '<textarea id="rvN" rows="12">' + e(rv.notice) + '</textarea><div class="bts"><button class="bt" type="button" data-x="notice">Save the notice</button><button class="bt p" type="button" data-x="send">Send to ' + e(STAFF) + '</button><span class="rs" style="align-self:center">Sending starts 5 calendar days for her answer and 30 days for the review.</span></div>';
    else { h += '<div class="nt">' + e(rv.notice) + '</div><p class="rs" style="margin:0">' + (rv.read_at ? 'Read ' + dt(rv.read_at) : 'Not read yet') + ' · ' + (rv.ack_at ? 'Acknowledged ' + dt(rv.ack_at) : 'Not acknowledged yet') + '</p>';
      if(!P && open && !rv.ack_at) h += '<div class="bts"><button class="bt p" type="button" data-x="ack">I have received this notice</button><span class="rs" style="align-self:center">Acknowledging means you received it. You can still answer and explain.</span></div>'; }
    h += '</div>';
    /* 2 · concerns */
    h += '<div class="rc"><p class="rk">2 · Documented concerns · Annex A category, occurrence and the step the contract gives</p>';
    h += it.length ? it.map(x => '<div class="ci"><span class="d">' + dd(x.day) + '</span><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="t">' + e(x.title) + '</span><span class="pl ' + (x.occ >= 3 ? 'pr' : x.occ === 2 ? 'pa' : 'pn') + '">' + e(x.catName) + (x.cat !== 'other' ? ' · ' + ord(x.occ) + ' occurrence' : '') + '</span>' + (x.prior ? '<span class="pl pn">Earlier memo' + (x.memo_ref ? ' · ' + e(x.memo_ref) : '') + '</span>' : '') + '</div>'
        + (x.step ? '<div class="x">Annex A step for this occurrence: <b style="color:#7A4A00">' + e(x.step) + '</b></div>' : '')
        + (x.expected ? '<div class="x"><b>Expected:</b> ' + e(x.expected) + '</div>' : '') + (x.detail ? '<div class="x">' + e(x.detail) + '</div>' : '')
        + (P ? (x.her_reply ? '<div class="hr"><b>Her answer</b> · ' + dt(x.replied_at) + '<br>' + e(x.her_reply) + '</div>' : (rv.status !== 'draft' ? '<div class="x" style="color:#8A87A0">No answer from her on this yet.</div>' : '')) + (rv.status !== 'closed' ? '<div class="bts"><button class="bt" type="button" data-ed="' + x.id + '">Edit</button><button class="bt r" type="button" data-del="' + x.id + '">Remove</button></div>' : '')
           : (open ? '<label class="rs" style="display:block;margin-top:8px">Your side (optional)</label><textarea data-rp="' + x.id + '" rows="2">' + e(x.her_reply || '') + '</textarea><div class="bts"><button class="bt" type="button" data-rps="' + x.id + '">Save my answer</button>' + (x.replied_at ? '<span class="rs" style="align-self:center">Saved ' + dt(x.replied_at) + '</span>' : '') + '</div>' : (x.her_reply ? '<div class="hr">' + e(x.her_reply) + '</div>' : '')))
        + '</div></div>').join('') : '<p class="rs">No concerns logged yet.' + (P ? ' Add each case with its date and what was expected. Add your earlier memos too: they count as the 1st and 2nd occurrence.' : '') + '</p>';
    if(P && rv.status !== 'closed') h += '<details id="rvAdd" style="margin-top:10px"' + (it.length ? '' : ' open') + '><summary class="bt" style="display:inline-block;list-style:none">+ Log a concern</summary><div id="rvF">' + form() + '</div></details>';
    h += '<details style="margin-top:12px"><summary class="rs" style="cursor:pointer">Annex A · Performance Penalties (the ladder this review counts)</summary><table class="lad"><tr><th>Category</th><th>1st</th><th>2nd</th><th>3rd</th><th>Repeated</th></tr>' + Object.keys(L).filter(k => k !== 'other').map(k => '<tr><td>' + e(L[k].name) + '</td>' + L[k].steps.map(s => '<td>' + e(s) + '</td>').join('') + '<td>Termination</td></tr>').join('') + '</table><p class="rs" style="margin:6px 0 0">Termination needs a written notice, her written answer and a written decision first (Clause 15 and the Labor Code), even where Annex A says "immediate".' + (P ? ' This review applies no salary deduction; check any deduction with your lawyer first.' : '') + '</p></details>';
    h += '</div>';
    /* 3 · duties */
    h += '<div class="rc"><p class="rk">3 · Duties and standards · from the contract</p><div class="du">' + DUTIES.map(d => '<div><b>' + e(d[0]) + '</b>' + e(d[1]) + '</div>').join('') + '</div></div>';
    /* 4 · her answer */
    h += '<div class="rc"><p class="rk">4 · ' + (P ? 'Her written answer' : 'Your written answer') + '</p>';
    if(rv.response) h += '<div class="nt">' + e(rv.response) + '</div><p class="rs" style="margin:0">Sent ' + dt(rv.response_at) + '</p>';
    if(!P && open) h += '<textarea id="rvR" rows="6" placeholder="Answer the notice in your own words. You can explain, add context, or say what you will change.">' + e(rv.response && !rv.response_at ? rv.response : '') + '</textarea><div class="bts"><button class="bt p" type="button" data-x="respond">' + (rv.response ? 'Send an updated answer' : 'Send my answer') + '</button><span class="rs" style="align-self:center">Due ' + dd(rv.response_due) + '</span></div>';
    else if(!rv.response) h += '<p class="rs" style="margin:0">' + (rv.status === 'draft' ? 'She can answer once you send the notice.' : 'Not received yet · due ' + dd(rv.response_due) + '.') + '</p>';
    h += '<p class="rs" style="margin:8px 0 0">' + (P ? 'She has answered ' + ans + ' of ' + it.length + ' concerns one by one.' : '') + '</p></div>';
    /* 5 · check-ins */
    const nW = rv.extended ? 8 : 4;
    h += '<div class="rc"><p class="rk">5 · Weekly check-ins · scored on the four Annex A evaluation areas</p><div class="wk">';
    for(let w = 1; w <= nW; w++){ const r = W.find(x => x.week === w) || {};
      h += '<div><b>Week ' + w + '</b>' + (r.at ? ' <span class="rs">· ' + dd(r.at).replace(/ \d{4}$/, '') + '</span>' : '')
        + (P && open ? '<div class="sc">' + AREAS.map(a => '<span>' + a[1] + '</span><select data-w="' + w + '" data-a="' + a[0] + '"><option value=""></option>' + [1, 2, 3, 4].map(n => '<option value="' + n + '"' + (r[a[0]] === n ? ' selected' : '') + '>' + SCL[n] + '</option>').join('') + '</select>').join('') + '</div><textarea data-wn="' + w + '" rows="2" placeholder="Your note" style="margin-top:6px">' + e(r.note_pres || '') + '</textarea><button class="bt" type="button" data-ws="' + w + '" style="margin-top:6px">Save week ' + w + '</button>'

    h += '</div></div>';
    /* 6 · outcome */
    h += '<div class="rc"><p class="rk">6 · Outcome</p>';

    if(P && open) h += '<textarea id="rvO" rows="3" placeholder="The reason for the decision. She sees it."></textarea><div class="bts">' + Object.keys(R.outcomes || {}).filter(k => !(k === 'extend' && rv.extended)).map(k => '<button class="bt' + (k === 'improved' ? ' g' : k === 'further' ? ' r' : '') + '" type="button" data-oc="' + k + '">' + e(R.outcomes[k]) + '</button>').join('') + '</div><p class="rs" style="margin:8px 0 0">A written warning or further action only after her written answer, or once ' + dd(rv.response_due) + ' has passed. Further action under Clause 15 starts the termination steps; check them with your lawyer before acting.</p>';

    o.innerHTML = h; bind();
    if(!P && open && !rv.read_at) call({ op: 'read', id: rv.id }).then(j => { R = Object.assign(R, j); }).catch(() => {}); }
  function form(x){ x = x || {}; const L = (R && R.ladder) || {};
    return '<div class="fr"><label>Date</label><input type="date" id="rfD" value="' + e(x.day || today()) + '" max="' + today() + '">'

  async function run(body, ok){ try{ const j = await call(body); R = Object.assign(R || {}, j); AT = Date.now(); draw(); if(ok) say(ok); }catch(x){ say(x.message); } }

      if(x === 'notice') return run({ op: 'notice', id: rv.id, notice: v('rvN') }, 'Notice saved.');
      if(x === 'send'){ if(v('rvN') !== rv.notice){ try{ await call({ op: 'notice', id: rv.id, notice: v('rvN') }); }catch(y){ return say(y.message); } }
        if(!confirm('Send this review to ' + STAFF + ' now? She will see the notice and every concern, and has 5 calendar days to answer.')) return;
        return run({ op: 'send', id: rv.id }, 'Sent to ' + STAFF + '.'); }
      const item = () => ({ day: v('rfD'), cat: v('rfC'), title: v('rfT'), expected: v('rfE'), detail: v('rfX'), prior: !!(o.querySelector('#rfP') || {}).checked, memo_ref: v('rfM') });
      if(x === 'add') return run(Object.assign({ op: 'item_add', id: rv.id }, item()), 'Concern added.');
      if(x && x.indexOf('save:') === 0) return run(Object.assign({ op: 'item_edit', iid: +x.slice(5) }, item()), 'Saved.');
      if(x === 'cancel') return draw();
      if(b.dataset.ed){ const it = R.items.find(y => String(y.id) === b.dataset.ed); const box = b.closest('.ci'); box.innerHTML = '<div style="grid-column:1/-1">' + form(it) + '</div>'; return; }
      if(b.dataset.del){ if(!confirm('Remove this concern from the review?')) return; return run({ op: 'item_del', iid: +b.dataset.del }, 'Removed.'); }
      if(x === 'ack') return run({ op: 'ack', id: rv.id }, 'Acknowledged.');
      if(b.dataset.rps){ const t = o.querySelector('[data-rp="' + b.dataset.rps + '"]'); return run({ op: 'reply', iid: +b.dataset.rps, text: t ? t.value : '' }, 'Your answer is saved.'); }
      if(x === 'respond') return run({ op: 'respond', id: rv.id, text: v('rvR') }, 'Your answer was sent.');
      if(b.dataset.ws){ const w = b.dataset.ws, sc = {}; o.querySelectorAll('[data-w="' + w + '"]').forEach(s => { sc[s.dataset.a] = s.value; }); const n = o.querySelector('[data-wn="' + w + '"]');
        return run(Object.assign({ op: 'week', id: rv.id, week: +w, note: n ? n.value : '' }, sc), 'Week ' + w + ' saved.'); }
      if(b.dataset.ss){ const n = o.querySelector('[data-sn="' + b.dataset.ss + '"]'); return run({ op: 'week_note', id: rv.id, week: +b.dataset.ss, note: n ? n.value : '' }, 'Your note is saved.'); }
      if(b.dataset.oc){ const oc = b.dataset.oc; if(!confirm('Record "' + R.outcomes[oc] + '"? ' + (oc === 'extend' ? 'The review runs 30 more days.' : 'This closes the review and she sees the decision and your reason.'))) return;
        return run({ op: 'decide', id: rv.id, outcome: oc, note: v('rvO') }, 'Decision recorded.'); } }; }
  async function openRv(){ document.addEventListener('keydown', esc); const o = page(); o.innerHTML = '<div class="rh"><b>Performance Improvement Plan and Accountability Review</b></div><div class="rw"><div class="rc rs">Loading…</div></div>'; await load(true); if(!R){ o.innerHTML = '<div class="rw"><div class="rc">Could not load. <button class="bt" type="button" onclick="document.getElementById(\'rv2518\').remove()">Close</button></div></div>'; return; } draw(); }
  window.rev2518 = openRv;
  /* the Overview card: President · always (start, draft, open, closed); Operations · only once sent */
  function card(){ const rv = R && R.review, P = pres();
    if(P){ if(!rv) return '<div class="grow"><b>' + STAFF + ' · Performance review</b><br><span class="s">Annex A of her Regular Employment Contract · none started</span></div><button class="btn sm" type="button" onclick="rev2518()">Open</button>';
      const it = R.items || []; const line = rv.status === 'draft' ? 'Draft · ' + it.length + ' concern' + (it.length === 1 ? '' : 's') + ' logged · not sent' : rv.status === 'closed' ? 'Closed · ' + ((R.outcomes || {})[rv.outcome] || '') : (rv.response_at ? 'Answer received' : 'Waiting for her answer · due ' + dd(rv.response_due)) + ' · ' + (rv.ack_at ? 'acknowledged' : rv.read_at ? 'read, not acknowledged' : 'not read yet') + ' · ends ' + dd(rv.ends_at);
      return '<div class="grow"><b>' + STAFF + ' · Performance review</b><br><span class="s">' + e(line) + '</span></div><button class="btn sm" type="button" onclick="rev2518()">Open</button>'; }
    if(!rv || rv.status === 'draft') return '';
    if(rv.status === 'closed') return '<div class="grow"><b>Your performance review</b><br><span class="s">Closed · ' + e((R.outcomes || {})[rv.outcome] || '') + '</span></div><button class="btn sm" type="button" onclick="rev2518()">Open</button>';
    return '<div class="grow"><b>Performance Improvement Plan and Accountability Review</b><br><span class="s">' + (rv.response_at ? 'Your answer was received · review ends ' + dd(rv.ends_at) : 'Please read, acknowledge and answer by ' + dd(rv.response_due)) + '</span></div><button class="btn sm teal" type="button" onclick="rev2518()">Open</button>'; }
  function place(){ try{ if(!mgr()) return; const home = document.getElementById('v-home'); if(!home) return; const h = R ? card() : '';
      let c = document.getElementById('ov2518'); if(!h){ if(c) c.remove(); return; }
      if(!c){ c = document.createElement('section'); c.id = 'ov2518'; const be = home.querySelector('#be2501'); if(be && be.parentElement === home) be.after(c); else home.prepend(c); }
      c.classList.toggle('st', !pres()); if(c.dataset.h !== h){ c.innerHTML = h; c.dataset.h = h; } }catch(x){} }
  const rh = window.renderHome; if(typeof rh === 'function') window.renderHome = function(){ const r = rh.apply(this, arguments); place(); load(false).then(place); return r; };
  setInterval(() => { if(mgr() && document.getElementById('v-home') && !document.hidden) load(false).then(place); }, 60000);
  setTimeout(() => load(false).then(place), 3000);
})();
</script>
