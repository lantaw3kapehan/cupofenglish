<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupOfEnglish · Guides</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--teal:#00707A;--navy:#2F2753;--ink:#1F2937;--ink2:#5B5870;--line:#E4E2EC;--soft:#F4F6F8;--red:#D92D20}
*{box-sizing:border-box}html,body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 'COE Card Inter',Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.top img{height:38px}
h1{margin:0;font:400 28px/1.2 'COE Card Fredoka',sans-serif;color:var(--navy)}.crumb{font-size:14px;color:var(--ink2)}.crumb a{color:var(--teal);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;transition:border-color .15s}
a.card:hover{border-color:var(--teal)}.card.soon{opacity:.6}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:#E6F5F6;color:var(--teal);display:flex;align-items:center;justify-content:center}
.card b{display:block;color:var(--navy);font-size:16px}.card span{font-size:14px;color:var(--ink2)}
.bd{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.bd.new{background:#FEF3F2;color:var(--red)}.bd.soon{background:#EEF0F3;color:#6B7280}
.gv{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.gv h2{margin:0;font:400 26px 'COE Card Fredoka',sans-serif;color:var(--navy)}.gv .meta{font-size:13px;color:var(--ink2);margin:2px 0 12px}
.rule{background:#FEF3F2;border:1px solid #F3C9C4;color:#B42318;border-radius:12px;padding:10px 14px;font-weight:600}
.gv h3{font-size:17px;color:var(--navy);margin:26px 0 4px}.gv h3.r{color:var(--red)}.gv p{margin:0 0 8px;color:var(--ink2);font-size:15px}
.gv img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;cursor:zoom-in}
.gv ul{margin:6px 0 0;padding:0;list-style:none}.gv li{padding:6px 0 6px 30px;position:relative}.gv li:before{content:'';position:absolute;left:4px;top:10px;width:16px;height:16px;border:2px solid var(--teal);border-radius:5px}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid #CFCBDD;background:#fff;font:600 15px inherit;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="../reader/logo.png" alt="CupOfEnglish"><div><div class="crumb" id="crumb">Teacher help</div><h1 id="h1">Guides</h1></div></div>
  <div id="root"></div>
</div>
<script src="guides.js?v=2885"></script>
<script>
(function(){
const G=window.COE_GUIDES||[],root=document.getElementById('root');
const IC={check:'<path d="M20 6 9 17l-5-5"/>',star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>'};
const svg=k=>'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(IC[k]||IC.book)+'</svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const seen=id=>{try{return JSON.parse(localStorage.getItem('coe.guides.seen')||'{}')[id]}catch(e){return null}};
const mark=g=>{try{const o=JSON.parse(localStorage.getItem('coe.guides.seen')||'{}');o[g.id]=g.updated;localStorage.setItem('coe.guides.seen',JSON.stringify(o))}catch(e){}};
const fresh=g=>g.updated&&!g.soon&&(Date.now()-new Date(g.updated))<14*864e5&&seen(g.id)!==g.updated;
const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function list(){
  document.getElementById('h1').textContent='Guides';document.getElementById('crumb').textContent='Teacher help';
  root.innerHTML='<div class="grid">'+G.map(g=>(g.soon?'<div class="card soon">':'<a class="card" href="#'+g.id+'">')+
   '<div class="ic">'+svg(g.icon)+'</div><div><b>'+esc(g.title)+(g.soon?'<i class="bd soon">Coming soon</i>':fresh(g)?'<i class="bd new">'+(seen(g.id)?'Updated':'New')+'</i>':'')+'</b><span>'+esc(g.sum)+'</span></div>'+(g.soon?'</div>':'</a>')).join('')+'</div>';
}
function one(g){
  document.getElementById('h1').textContent=g.title;document.getElementById('crumb').innerHTML='<a href="#">Guides</a> · How to';
  let h='<div class="gv"><h2>How to: '+esc(g.title)+'</h2><div class="meta">Updated '+fmt(g.updated)+'</div>'+(g.rule?'<div class="rule">'+esc(g.rule)+'</div>':'');
  for(const p of g.parts){h+='<h3'+(p.red?' class="r"':'')+'>'+esc(p.h)+'</h3>'+(p.p?'<p>'+esc(p.p)+'</p>':'')+(p.img?'<img src="'+p.img+'?v=2885" alt="'+esc(p.h)+'" loading="lazy">':'')+(p.list?'<ul>'+p.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')}
  h+='<div class="row"><a class="btn" href="#">All guides</a>'+(g.open?'<a class="btn pri" href="'+g.open+'">Open '+esc(g.title)+'</a>':'')+'</div></div>';
  root.innerHTML=h;mark(g);scrollTo(0,0);
}
function go(){const id=location.hash.slice(1),g=G.find(x=>x.id===id&&!x.soon);g?one(g):list()}
root.addEventListener('click',e=>{const im=e.target.closest('img');if(im)open(im.src,'_blank')});
addEventListener('hashchange',go);go();
})();
</script>
</body>
</html>
