<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CupOfEnglish · Guides</title>
<link rel="icon" href="../icon-192.png">
<style>
@font-face{font-family:'COE Card Inter';src:url(../fonts/card-inter-var.woff2) format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'COE Card Fredoka';src:url(../fonts/card-fredoka-one.woff2) format('woff2');font-weight:400;font-display:swap}
:root{--teal:#00707A;--teal2:#01B0BF;--tint:#E6F5F6;--navy:#2F2752;--ink:#1F2937;--ink2:#5B5870;--line:#E4E2EC;--soft:#F5F6F8;--red:#D92D20}
*{box-sizing:border-box}html,body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.55 'COE Card Inter',Inter,system-ui,sans-serif}
a{color:inherit}
.bar{background:#fff;border-bottom:1px solid var(--line)}
.bar .in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:14px}
.bar img{height:34px}.bar .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;text-decoration:none;font-weight:600;font-size:14px;color:var(--navy)}
.back:hover{border-color:var(--teal)}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 64px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
h1{margin:2px 0 0;font:400 34px/1.15 'COE Card Fredoka',sans-serif;color:var(--navy)}
.hero p{margin:6px 0 0;color:var(--ink2);max-width:560px}
.sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:34px 0 12px}
.ready{display:grid;grid-template-columns:1fr;gap:18px}
.gc{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;transition:box-shadow .15s,border-color .15s,transform .15s}
.gc:hover{border-color:#99D5D9;box-shadow:0 10px 30px rgba(47,39,82,.10);transform:translateY(-2px)}
.gc .cv{aspect-ratio:2/1;background:var(--tint) center/cover no-repeat;border-bottom:1px solid var(--line)}
@media(min-width:760px){.gc{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.gc .cv{aspect-ratio:auto;min-height:250px;border-bottom:0;border-right:1px solid var(--line)}.gc .bd{padding:26px 28px;gap:10px}.gc h3{font-size:22px}}
.gc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc h3{margin:0;font-size:19px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gc p{margin:0;color:var(--ink2);font-size:15px}
.gc .ft{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--ink2)}
.gc .go{color:var(--teal);font-weight:700;font-size:14.5px}
.new{font-size:11.5px;font-weight:700;color:var(--red);background:#FEF3F2;border:1px solid #FECDCA;border-radius:999px;padding:1px 9px;letter-spacing:.02em}
.soon{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.soon .r{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}.soon .r:first-child{border-top:0}
.ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--teal);display:flex;align-items:center;justify-content:center}
.soon b{display:block;color:var(--navy);font-size:15.5px}.soon span{font-size:14px;color:var(--ink2)}.soon .g{flex:1;min-width:0}
.tag{flex:none;font-size:12px;font-weight:600;color:#6B7280;background:#F1F2F5;border-radius:999px;padding:3px 10px}
/* one guide */
.gv{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start}
.toc{position:sticky;top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.toc b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px 6px}
.toc a{display:flex;gap:10px;align-items:center;padding:7px 6px;border-radius:9px;text-decoration:none;font-size:14px;color:var(--navy)}
.toc a:hover{background:var(--soft)}.toc a i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--teal);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.toc a.r i{background:#FEF3F2;color:var(--red)}
.meta{font-size:14px;color:var(--ink2);margin-top:6px}
.rule{display:flex;gap:12px;align-items:flex-start;background:#FEF3F2;border:1px solid #F3C9C4;color:#B42318;border-radius:14px;padding:14px 16px;font-weight:600;margin-top:18px}
.rule svg{flex:none;margin-top:2px}
.pt{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-top:18px;scroll-margin-top:16px}
.pt h2{margin:0;font-size:19px;color:var(--navy);display:flex;align-items:center;gap:10px}
.pt h2 i{font-style:normal;flex:none;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.pt.r h2{color:var(--red)}.pt.r h2 i{background:var(--red)}
.pt p{margin:6px 0 0 38px;color:var(--ink2);font-size:15px}
.pt figure{margin:14px 0 0;position:relative}
.pt img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;cursor:zoom-in;background:var(--soft)}
.pt figcaption{font-size:12.5px;color:var(--ink2);margin-top:6px;text-align:right}
.pt ul{margin:12px 0 0;padding:0;list-style:none}.pt li{padding:8px 0 8px 36px;position:relative;border-top:1px solid #F0EEF5}.pt li:first-child{border-top:0}
.pt li:before{content:'';position:absolute;left:6px;top:11px;width:18px;height:18px;border:2px solid var(--teal);border-radius:6px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}.btn.pri:hover{background:#005E66}
.zoom{position:fixed;inset:0;background:rgba(20,18,40,.88);z-index:50;display:none;overflow:auto;cursor:zoom-out}.zoom.on{display:block}
.zoom img{display:block;max-width:none;width:min(2400px,180vw);margin:20px auto}
@media(min-width:900px){.zoom img{width:min(2400px,96vw)}}
@media(max-width:820px){.gv{grid-template-columns:1fr}.toc{display:none}h1{font-size:28px}.pt{padding:16px}.pt p{margin-left:0}.wrap{padding:20px 14px 48px}.bar .in{padding:12px 14px}}
.cats{display:flex;flex-direction:column;gap:30px;margin-top:8px}
.cat h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.gk{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s,transform .15s}
a.gk:hover{border-color:#99D5D9;box-shadow:0 10px 28px rgba(47,39,82,.10);transform:translateY(-2px)}
.gk .tp{position:relative;height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#E6F5F6,#F1EEFB)}
.gk .tp .big{width:64px;height:64px;border-radius:18px;background:#fff;color:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,39,82,.10)}
.gk .tp .nw{position:absolute;top:12px;right:12px}
.gk .bd2{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.gk h3{margin:0;font-size:18px;color:var(--navy)}
.gk p{margin:0;font-size:14.5px;color:var(--ink2)}
.gk .ft2{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink2)}
.gk .ft2 b{color:var(--teal);font-size:14.5px}
.gk.off{opacity:.62}.gk.off .tp{background:#F1F2F5}.gk.off .big{color:#8A8FA0;box-shadow:none}
</style>
</head>
<body>
<div class="bar"><div class="in"><img src="../reader/logo.png" alt="CupOfEnglish"><span class="sp"></span><a class="back" id="back" href="../">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span>Back to the App</span></a></div></div>
<div class="wrap" id="root"></div>
<div class="zoom" id="zoom"><img alt=""></div>
<script src="guides.js?v=2894"></script>
<script>
(function(){
const G=window.COE_GUIDES||[],root=document.getElementById('root'),Z=document.getElementById('zoom');
const IC={check:'<path d="M20 6 9 17l-5-5"/>',star:'<path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/>',video:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',book:'<path d="M2 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/>'};
const svg=(k,n)=>'<svg width="'+(n||20)+'" height="'+(n||20)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(IC[k]||IC.book)+'</svg>';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SK='coe.guides.seen',seenAll=()=>{try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){return{}}};
const mark=g=>{try{const o=seenAll();o[g.id]=g.updated;localStorage.setItem(SK,JSON.stringify(o))}catch(e){}};
const fresh=g=>g.updated&&(Date.now()-new Date(g.updated))<14*864e5&&seenAll()[g.id]!==g.updated;
const fmt=d=>new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const SMALL=/^(a|an|the|and|or|but|in|on|to|of|for|with|as|at|by|from)$/;const tc=t=>String(t).split(' ').map((w,i)=>(i&&SMALL.test(w))?w:w.replace(/^([a-z])/,c=>c.toUpperCase())).join(' ');
const pics=g=>(g.parts||[]).filter(p=>p.img).length;
function list(){
  document.title='CupOfEnglish · Guides';
  let h='<div class="hero"><div><div class="eyebrow">Teacher Help</div><h1>Guides</h1><p>Short picture guides for the app. When something changes, the new guide shows up here first.</p></div></div><div class="cats">';
  const cats=[...new Set(G.map(g=>g.cat||'Other'))];
  cats.forEach(c=>{ const L=G.filter(g=>(g.cat||'Other')===c).sort((a,b)=>(a.soon?1:0)-(b.soon?1:0));
    h+='<section class="cat"><h2>'+esc(c)+'</h2><div class="grid3">'+L.map(g=>{
      const top='<div class="tp"><div class="big">'+svg(g.icon,30)+'</div>'+(g.soon?'<span class="tag nw">Soon</span>':fresh(g)?'<span class="new nw">'+(seenAll()[g.id]?'UPDATED':'NEW')+'</span>':'')+'</div>';
      const body='<div class="bd2"><h3>'+esc(g.title)+'</h3><p>'+esc(g.sum)+'</p><div class="ft2">'+(g.soon?'<span>Coming soon</span>':'<span>'+pics(g)+' pictures'+(g.mins?' · '+g.mins+' min':'')+'</span><b>Open guide ›</b>')+'</div></div>';
      return g.soon?'<div class="gk off">'+top+body+'</div>':'<a class="gk" href="#'+g.id+'">'+top+body+'</a>'; }).join('')+'</div></section>'; });
  root.innerHTML=h+'</div>';scrollTo(0,0);
}
function one(g){
  document.title='How to: '+g.title+' · CupOfEnglish';
  const P=g.parts||[];
  let toc='<nav class="toc"><b>In This Guide</b>'+P.map((p,i)=>'<a href="#'+g.id+'/'+(i+1)+'" data-s="'+(i+1)+'"'+(p.red?' class="r"':'')+'><i>'+(i+1)+'</i>'+esc(tc(p.h))+'</a>').join('')+'<a href="#" style="margin-top:6px;color:var(--teal);font-weight:600">‹ All Guides</a></nav>';
  let h='<div class="eyebrow"><a href="#" style="text-decoration:none">Guides</a> · How To</div><h1>'+esc(g.title)+'</h1><div class="meta">'+pics(g)+' pictures'+(g.mins?' · about '+g.mins+' min':'')+' · updated '+fmt(g.updated)+'</div>';
  if(g.rule) h+='<div class="rule"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg><span>'+esc(g.rule)+'</span></div>';
  P.forEach((p,i)=>{h+='<section class="pt'+(p.red?' r':'')+'" id="s'+(i+1)+'"><h2><i>'+(i+1)+'</i>'+esc(tc(p.h))+'</h2>'+(p.p?'<p>'+esc(p.p)+'</p>':'')+(p.img?'<figure><img src="'+p.img+'?v=2894" alt="'+esc(p.h)+'" loading="eager"><figcaption>Tap the picture to see it bigger</figcaption></figure>':'')+(p.list?'<ul>'+p.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+'</section>'});
  h+='<div class="cta"><a class="btn" href="#">‹ All Guides</a>'+(g.open?'<a class="btn pri" href="'+g.open+'">Open '+esc(g.title)+' ›</a>':'')+'</div>';
  root.innerHTML='<div class="gv">'+toc+'<div>'+h+'</div></div>';mark(g);
}
function go(){const [id,sec]=location.hash.slice(1).split('/'),g=G.find(x=>x.id===id&&!x.soon);
  if(g){if(!root.querySelector('.gv')||document.title.indexOf(g.title)<0)one(g);const el=sec&&document.getElementById('s'+sec);el?el.scrollIntoView({behavior:'smooth'}):scrollTo(0,0)}else list()}
root.addEventListener('click',e=>{const im=e.target.closest('figure img');if(im){Z.firstChild.src=im.src;Z.classList.add('on');document.body.style.overflow='hidden'}});
Z.addEventListener('click',()=>{Z.classList.remove('on');document.body.style.overflow=''});
addEventListener('keydown',e=>{if(e.key==='Escape')Z.click()});
try{if(window.opener||history.length<2){const b=document.getElementById('back');b.onclick=e=>{if(window.opener){e.preventDefault();window.close()}}}}catch(e){}
addEventListener('hashchange',go);go();
})();
</script>
</body>
</html>
