<!DOCTYPE html>
<html lang="zh-CN" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>合作伙伴专区 · Partner portal · CupOfEnglish</title>
<link rel="icon" href="../icon-192.png">
<style>
/* 27 Oct 2026 · CupOfEnglish partner portal. Works from mainland China: no Google, no outside fonts or scripts. */
@font-face{font-family:"Fredoka One";src:url(fredoka-one.woff2) format("woff2");font-display:swap}
:root{--ink:#2B2450;--teal:#00707A;--teal2:#16BCB0;--tealT:#E3F4F5;--purple:#5B4B9E;--mute:#5E5A76;--line:#E7E5EF;--bg:#F4F5F8;--card:#fff;--amber:#8A5300;--amberT:#FFF0D2;--red:#B42318;--redT:#FDECEA;--green:#1F7A55;--greenT:#E7F5EE}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
.brand{font-family:"Fredoka One","PingFang SC","Microsoft YaHei",sans-serif;font-weight:400}
.w{max-width:760px;margin:0 auto;padding:0 16px 48px}
/* sign-in */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lc{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:28px 22px;box-shadow:0 8px 30px rgba(43,36,80,.08)}
.lc img{display:block;height:54px;margin:0 auto 14px}
.lc h1{margin:0;text-align:center;font-size:24px;line-height:1.25}.lc h1 small{display:block;font:600 14px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--teal);letter-spacing:.04em;margin-top:4px}
.lc p{color:var(--mute);font-size:13.5px;text-align:center;margin:10px 0 18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}label span{color:var(--mute);font-weight:400}
input[type=text],input[type=password],input[type=search]{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font-size:16px;outline:none}
input:focus{border-color:var(--teal2);box-shadow:0 0 0 3px rgba(22,188,176,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:700;cursor:pointer}
.btn.block{width:100%;margin-top:18px}.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--red);font-size:13.5px;margin-top:10px;text-align:center;min-height:20px}
/* header */
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(6px)}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:60px}
.hd img{height:34px;width:auto}.hd .who{flex:1;min-width:0}.hd .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hd .who span{font-size:12px;color:var(--mute)}
.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:0 12px}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--teal)}
/* content */
h2{font-size:18px;margin:22px 0 10px;line-height:1.3}h2 small{font:400 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--mute);margin-left:6px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.st{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 2px 10px rgba(43,36,80,.05)}.st b{display:block;font-size:24px;line-height:1.2}.st span{font-size:12.5px;color:var(--mute)}
.st.amber b{color:var(--amber)}
.tools{display:flex;gap:10px;align-items:center;margin-top:16px}.tools input{flex:1}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 2px 12px rgba(43,36,80,.06)}
a.card,button.card{display:block;width:100%;text-align:left;border:0;cursor:pointer;color:inherit;text-decoration:none}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.nm{font-size:16.5px;font-weight:700}.nm small{font-weight:400;color:var(--mute);margin-left:6px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--tealT);color:var(--teal);white-space:nowrap}
.chip.amber{background:var(--amberT);color:var(--amber)}.chip.red{background:var(--redT);color:var(--red)}.chip.green{background:var(--greenT);color:var(--green)}.chip.grey{background:#EEF0F4;color:#4C4868}.chip.purple{background:#EEEAF8;color:var(--purple)}
.meta{font-size:13.5px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.bar{height:8px;border-radius:99px;background:#EEF0F4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--teal));border-radius:99px}
.mute{color:var(--mute)}.small{font-size:13px}
.back{margin:16px 0 4px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.kv div{background:#F6F7FA;border-radius:12px;padding:8px 10px}.kv span{display:block;font-size:12px;color:var(--mute)}.kv b{font-size:18px}
.cl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.cl:first-child{border-top:0}
.cl .d{width:112px;flex:none;font-weight:700;white-space:nowrap}.cl .t{width:52px;flex:none;color:var(--mute)}
.jr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}.jr i{font-style:normal;color:var(--mute)}
.rp h3{margin:0;font-size:16px}.sk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sk div{background:#F6F7FA;border-radius:12px;padding:8px 10px;text-align:center}.sk b{display:block;font-size:20px}.sk span{font-size:12px;color:var(--mute)}
.sec{margin-top:12px}.sec b{display:block;font-size:13.5px;color:var(--teal);margin-bottom:2px}.sec p{margin:0;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--teal);font-weight:700;font-size:13.5px;margin-top:10px}
.days{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.days button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;text-align:center;cursor:pointer;min-width:62px}
.days button b{display:block;font-size:14px}.days button span{font-size:11.5px;color:var(--mute)}.days button em{display:block;font-style:normal;font-size:11px;color:var(--teal);font-weight:700}
.days button.on{border-color:var(--teal);background:var(--tealT)}.days button.none em{color:#A3A0B5}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}.slots span{background:var(--tealT);color:var(--teal);font-weight:700;border-radius:10px;padding:5px 10px;font-size:14px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--teal2),var(--purple));color:#fff;font-size:20px}
.ul{margin:6px 0 0;padding-left:18px}.ul li{margin:2px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.skel{height:76px;border-radius:18px;background:linear-gradient(90deg,#ECEDF2 25%,#F6F7FA 50%,#ECEDF2 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
@media (max-width:520px){.hide-s{display:none}.cl{flex-wrap:wrap;row-gap:2px}.cl .grow{flex-basis:100%;order:3;padding-left:0;font-size:13.5px;color:var(--mute)}.sum{gap:8px}.st{padding:10px 12px}.st b{font-size:21px}.kv{grid-template-columns:repeat(2,1fr)}.cl .d{width:auto;margin-right:2px}}
</style>
</head>
<body>
<div id="login" class="login hide">
  <form class="lc" onsubmit="event.preventDefault();signIn()">
    <img src="__LOGO__" alt="CupOfEnglish 一杯英语">
    <h1 class="brand">合作伙伴专区<small>PARTNER PORTAL</small></h1>
    <p>查看您推荐学员的课程、学习进度与老师可约时间<br>Your students' lessons, progress and teachers' open times</p>
    <label for="u">用户名 <span>Username</span></label><input id="u" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="p">密码 <span>Password</span></label><input id="p" type="password" autocomplete="current-password" required>
    <button id="go" class="btn block" type="submit">登录 · Sign in</button>
    <div id="err" class="err" role="alert"></div>
  </form>
</div>
<div id="app" class="hide">
  <header>
    <div class="hd"><img src="__LOGO__" alt="CupOfEnglish"><div class="who"><b id="pname">—</b><span>合作伙伴专区 · Partner portal</span></div>
      <button class="btn ghost sm" onclick="signOut()" title="Sign out">退出 <span class="hide-s">· Sign out</span></button></div>
    <nav class="tabs" role="tablist"><button id="tS" class="on" role="tab" onclick="tab('s')">学生 · Students</button><button id="tT" role="tab" onclick="tab('t')">老师 · Teachers</button></nav>
  </header>
  <main class="w" id="main"></main>
</div>
<script>
'use strict';
const API = 'https://rlxkiahqjsabopmuhern.supabase.co/functions/v1/coe-partner';
const KEY = 'coe.partner.token', NKEY = 'coe.partner.name';
const S = { tab: 's', list: null, teachers: null, q: '', past: false, stu: null, tday: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const get = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const put = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
const WZ = '日一二三四五六', WE = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], ME = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const dOf = d => new Date(d + 'T12:00:00+08:00');
const dCn = d => { if (!d) return ''; const x = dOf(d), m = +d.slice(5, 7), dd = +d.slice(8, 10); return m + '月' + dd + '日 周' + WZ[x.getUTCDay()]; };
const dEn = d => { if (!d) return ''; const x = dOf(d); return WE[x.getUTCDay()] + ' ' + (+d.slice(8, 10)) + ' ' + ME[+d.slice(5, 7) - 1]; };
const yCn = d => d ? d.slice(0, 4) + '年' + (+d.slice(5, 7)) + '月' + (+d.slice(8, 10)) + '日' : '';
const mCn = m => m ? m.slice(0, 4) + '年' + (+m.slice(5, 7)) + '月' : '';
const mEn = m => m ? ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][+m.slice(5, 7) - 1] + ' ' + m.slice(0, 4) : '';
const today = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const num = n => (Math.round((+n || 0) * 10) / 10).toString();
const tidy = s => /^[A-Z0-9 &·\-–]+$/.test(String(s || '')) && /[A-Z]{3}/.test(String(s || '')) ? String(s).toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()) : String(s || '');
async function call(op, body) {
  const ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(() => ctl.abort(), 30000) : 0;
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(Object.assign({ op }, body || {})), signal: ctl ? ctl.signal : undefined });
    const j = await r.json().catch(() => ({ ok: false }));
    if (j && j.error === 'AUTH') { put(KEY, ''); show(false); throw new Error('AUTH'); }
    return j;
  } finally { clearTimeout(t); }
}
function show(app) { $('login').classList.toggle('hide', !!app); $('app').classList.toggle('hide', !app); if (!app) setTimeout(() => { try { $('u').focus(); } catch (e) {} }, 50); }
async function signIn() {
  const b = $('go'), e = $('err'); e.textContent = ''; b.disabled = true; b.textContent = '正在登录… · Signing in…';
  try {
    const r = await call('login', { username: $('u').value.trim().toLowerCase(), password: $('p').value });
    if (!r || !r.ok) { e.textContent = (r && r.msg) || '登录失败，请重试 · Could not sign in, try again'; return; }
    put(KEY, r.token); put(NKEY, r.name || ''); $('p').value = ''; start();
  } catch (x) { if (String(x && x.message) !== 'AUTH') e.textContent = '网络连接失败，请稍后再试 · Network problem, please try again'; }
  finally { b.disabled = false; b.textContent = '登录 · Sign in'; }
}
async function signOut() { const t = get(KEY); put(KEY, ''); put(NKEY, ''); S.list = S.teachers = S.stu = null; show(false); if (t) call('logout', { token: t }).catch(() => {}); }
function tab(t) { S.tab = t; S.stu = null; $('tS').classList.toggle('on', t === 's'); $('tT').classList.toggle('on', t === 't'); paint(); window.scrollTo(0, 0); if (t === 't' && !S.teachers) loadTeachers(); }
function start() { show(true); $('pname').textContent = get(NKEY) || '—'; paint(); loadList(); }
async function loadList() { try { const r = await call('list', { token: get(KEY) }); if (r && r.ok) { S.list = r; if (r.partner && r.partner.name) { $('pname').textContent = r.partner.name; put(NKEY, r.partner.name); } } else S.list = { err: 1 }; } catch (e) { if (e.message !== 'AUTH') S.list = { err: 1 }; } if (S.tab === 's' && !S.stu) paint(); }
async function loadTeachers() { try { const r = await call('teachers', { token: get(KEY) }); S.teachers = r && r.ok ? r : { err: 1 }; } catch (e) { if (e.message !== 'AUTH') S.teachers = { err: 1 }; } if (S.tab === 't') paint(); }
async function openStu(code) { S.stu = { code, loading: 1 }; paint(); window.scrollTo(0, 0);
  try { const r = await call('student', { token: get(KEY), code }); S.stu = r && r.ok ? r : { code, err: 1 }; } catch (e) { if (e.message !== 'AUTH') S.stu = { code, err: 1 }; }
  if (S.stu && S.stu.code === code || (S.stu && S.stu.student && S.stu.student.code === code)) paint(); }
function paint() { const m = $('main'); if (S.tab === 't') m.innerHTML = teachersHtml(); else m.innerHTML = S.stu ? stuHtml() : listHtml(); }
const skel = n => '<div class="list">' + Array.from({ length: n }, () => '<div class="skel"></div>').join('') + '</div>';
const errBox = () => '<div class="card empty">暂时无法加载，请稍后刷新 · Could not load right now — please refresh in a moment</div>';
function pkLine(p) { if (!p) return '<span class="chip grey">暂无有效课时包 · No active package</span>';
  const exp = p.valid && p.valid < today(); return `<span>剩余 <b>${num(p.left)}</b> / ${num(p.total)} 课时 · ${num(p.left)} of ${num(p.total)} lessons left</span>` + (p.valid ? `<span>${exp ? '已过期 · expired' : '有效期至 · valid until'} ${esc(yCn(p.valid))}</span>` : ''); }
function listHtml() {
  const L = S.list; if (!L) return skel(5); if (L.err) return errBox();
  const all = L.students || [], act = all.filter(x => x.active), due = act.filter(x => x.pk && x.pk.left <= 4), wk = act.filter(x => x.next && x.next.day <= dayAdd(today(), 6));
  const q = S.q.trim().toLowerCase(), shown = all.filter(x => (S.past || x.active) && (!q || [x.name, x.cn, x.code].join(' ').toLowerCase().includes(q)));
  return `<div class="sum"><div class="st"><b>${act.length}</b><span>在读学生 · Active</span></div><div class="st"><b>${wk.length}</b><span>本周有课 · This week</span></div><div class="st ${due.length ? 'amber' : ''}"><b>${due.length}</b><span>需续费 · Renew</span></div></div>
  <div class="tools"><input id="q" type="search" placeholder="搜索学生姓名 · Search a student" value="${esc(S.q)}" oninput="S.q=this.value;paintList()"></div>
  <div id="lst">${listBody(shown, all.length - act.length)}</div><footer>时间均为北京时间 · All times are Beijing time · CupOfEnglish 一杯英语</footer>`; }
function paintList() { const L = S.list; if (!L || L.err) return; const all = L.students || [], q = S.q.trim().toLowerCase();
  $('lst').innerHTML = listBody(all.filter(x => (S.past || x.active) && (!q || [x.name, x.cn, x.code].join(' ').toLowerCase().includes(q))), all.filter(x => !x.active).length); }
function listBody(shown, nPast) {
  const rows = shown.map(x => { const p = x.pk, due = p && p.left <= 4, pct = p && p.total ? Math.max(0, Math.min(100, 100 * p.used / p.total)) : 0;
    return `<button class="card" onclick="openStu('${esc(x.code)}')"><div class="row"><div class="grow"><div class="nm">${esc(x.name)}${x.cn ? `<small>${esc(x.cn)}</small>` : ''}</div></div>${x.level ? `<span class="chip purple">${esc(x.level)}</span>` : ''}${due ? '<span class="chip amber">需续费 · Renew</span>' : ''}${!x.active ? '<span class="chip grey">已结课 · Past</span>' : ''}</div>
    <div class="meta">${pkLine(p)}${x.next ? `<span>下次上课 · Next: ${esc(dCn(x.next.day))} ${esc(x.next.time)}</span>` : (x.active ? '<span>近3周暂无排课 · No class in the next 3 weeks</span>' : '')}</div>${p ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}</button>`; }).join('');
  return `<div class="list">${rows || '<div class="card empty">没有找到学生 · No students found</div>'}</div>` + (nPast ? `<div style="text-align:center;margin-top:12px"><button class="btn ghost sm" onclick="S.past=!S.past;paintList();this.textContent=S.past?'隐藏已结课学生 · Hide past students':'显示已结课学生 (${nPast}) · Show past students'">${S.past ? '隐藏已结课学生 · Hide past students' : `显示已结课学生 (${nPast}) · Show past students`}</button></div>` : ''); }
function dayAdd(d, n) { return new Date(Date.parse(d + 'T12:00:00+08:00') + n * 864e5 + 8 * 3600e3).toISOString().slice(0, 10); }
const kindChip = k => k === 'trial' ? '<span class="chip purple">试听 · Trial</span>' : k === 'sub' ? '<span class="chip grey">代课 · Substitute</span>' : '';
function stuHtml() {
  const D = S.stu, back = '<div class="back"><button class="btn ghost sm" onclick="S.stu=null;paint()">‹ 返回学生列表 · All students</button></div>';
  if (D.loading) return back + skel(4); if (D.err) return back + errBox();
  const st = D.student, pk = (D.packages || []).filter(p => p.total > 0 || p.valid), lim = dayAdd(today(), 60), up = (D.upcoming || []).filter(x => x.day <= lim).slice(0, 8);
  const att = D.attendance || [], done = att.filter(x => x.status === 'done').length, cx = att.filter(x => x.status === 'cancelled').length, J = D.journey;
  let h = back + `<div class="card"><div class="row"><div class="grow"><div class="nm" style="font-size:20px">${esc(st.name)}${st.cn ? `<small>${esc(st.cn)}</small>` : ''}</div><div class="small mute">${esc(st.code)}</div></div>${J && J.now ? `<span class="chip purple">当前水平 · Level ${esc(J.now)}</span>` : ''}</div></div>`;
  h += '<h2>课时包<small>Lessons &amp; package</small></h2>' + (pk.length ? pk.map((p, i) => { const exp = p.valid && p.valid < today();
    return `<div class="card" style="margin-bottom:10px">${pk.length > 1 ? `<div class="small mute">课时包 ${i + 1} · Package ${i + 1}${p.buy ? ' · ' + esc(yCn(p.buy)) + '购买 bought' : ''}</div>` : (p.buy ? `<div class="small mute">${esc(yCn(p.buy))} 购买 · bought ${esc(p.buy)}</div>` : '')}
    <div class="kv"><div><span>总课时 · Total</span><b>${num(p.total)}</b></div><div><span>已上 · Used</span><b>${num(p.used)}</b></div><div><span>剩余 · Left</span><b>${num(p.left)}</b></div><div><span>${exp ? '已过期 · Expired' : '有效期至 · Valid until'}</span><b style="font-size:15px">${esc(p.valid ? yCn(p.valid) : '—')}</b></div></div>
    <div class="bar"><i style="width:${p.total ? Math.min(100, 100 * p.used / p.total) : 0}%"></i></div>${p.left <= 4 ? '<div class="small" style="color:var(--amber);font-weight:700;margin-top:8px">剩余课时不多，请提醒家长续费 · Few lessons left — time to renew</div>' : ''}</div>`; }).join('') : '<div class="card mute">暂无有效课时包 · No active package</div>');
  h += '<h2>即将上课<small>Upcoming classes</small></h2><div class="card">' + (up.length ? up.map(x => `<div class="cl"><span class="d">${esc(dCn(x.day))}</span><span class="t">${esc(x.time)}</span><span class="grow">${esc(x.book) || '—'} <span class="mute small">· ${x.mins} 分钟 min</span></span>${kindChip(x.kind)}</div>`).join('') : '<div class="mute">近期暂无排课 · No classes scheduled soon</div>') + '</div>';
  if (J) { const path = (J.path || []).map(esc).join(' <i>→</i> ');
    h += `<h2>学习历程<small>Learning journey</small></h2><div class="card"><div class="jr"><span class="chip grey">${esc(J.start && J.start.date ? yCn(J.start.date) : '')} 入学 · Started${J.start && J.start.level ? ' ' + esc(J.start.level) : ''}</span>${path ? '<i>→</i> ' + path : ''}<i>→</i><span class="chip purple">现在 · Now ${esc(J.now || '—')}</span></div>${J.start && J.start.book ? `<div class="small mute" style="margin-top:8px">入学教材 · First book: ${esc(J.start.book)}</div>` : ''}${(J.checks || []).length ? `<div class="small mute" style="margin-top:6px">阶段测评 · Progress checks: ${J.checks.map(x => esc(yCn(x.date)) + ' ' + esc(x.level)).join(' · ')}</div>` : ''}</div>`; }
  const R = D.reports || [];
  h += '<h2>月度学习报告<small>Monthly reports</small></h2>' + (R.length ? R.map(r => `<div class="card rp" style="margin-bottom:10px"><div class="row"><div class="grow"><h3>${esc(mCn(r.classMonth))}学习报告</h3><div class="small mute">${esc(mEn(r.classMonth))} report · 覆盖${+r.classMonth.slice(5, 7)}月课程 covers ${esc(mEn(r.classMonth).split(' ')[0])} classes · Teacher ${esc(r.teacher)}${r.course ? ' · ' + esc(tidy(r.course)) : ''}</div></div><span class="chip ${r.total >= 80 ? 'green' : r.total >= 60 ? '' : 'amber'}" style="font-size:15px">${r.total}/100</span></div>
    <div class="sk"><div><b>${r.l ?? '—'}</b><span>听 Listening</span></div><div><b>${r.s ?? '—'}</b><span>说 Speaking</span></div><div><b>${r.r ?? '—'}</b><span>读 Reading</span></div><div><b>${r.w ?? '—'}</b><span>写 Writing</span></div></div>
    ${r.cn.strengths ? `<div class="sec"><b>本月亮点 · Strengths</b><p>${esc(r.cn.strengths)}</p></div>` : ''}${r.cn.areas ? `<div class="sec"><b>待提升 · To work on</b><p>${esc(r.cn.areas)}</p></div>` : ''}${r.cn.next ? `<div class="sec"><b>下一步计划 · Next steps</b><p>${esc(r.cn.next)}</p></div>` : ''}
    ${r.en.strengths || r.en.areas || r.en.next ? `<details><summary>查看英文原文 · Teacher's English original</summary>${r.en.strengths ? `<div class="sec"><b>Strengths</b><p>${esc(r.en.strengths)}</p></div>` : ''}${r.en.areas ? `<div class="sec"><b>To work on</b><p>${esc(r.en.areas)}</p></div>` : ''}${r.en.next ? `<div class="sec"><b>Next steps</b><p>${esc(r.en.next)}</p></div>` : ''}</details>` : ''}</div>`).join('') : '<div class="card mute">暂无已发送的月度报告 · No monthly report sent yet</div>');
  h += `<h2>上课记录<small>Attendance · last 4 months</small></h2><div class="card"><div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:6px"><span class="chip green">已上课 · Done ${done}</span>${cx ? `<span class="chip grey">已取消 · Cancelled ${cx}</span>` : ''}</div>` + (att.length ? att.slice(0, 30).map(x => `<div class="cl"><span class="d">${esc(dCn(x.day))}</span><span class="t">${esc(x.time)}</span><span class="grow">${esc(x.book) || '—'}</span>${kindChip(x.kind)}${x.status === 'done' ? '<span class="chip green">已上课</span>' : '<span class="chip grey">已取消</span>'}</div>`).join('') : '<div class="mute">暂无记录 · No classes yet</div>') + '</div>';
  return h + '<footer>时间均为北京时间 · All times are Beijing time</footer>'; }
function teachersHtml() {
  const T = S.teachers; if (!T) return skel(4); if (T.err) return errBox();
  const list = T.teachers || []; if (!list.length) return '<div class="card empty" style="margin-top:16px">暂无老师信息 · No teachers to show</div>';
  return `<p class="small mute" style="margin:16px 0 0">以下为各位老师未来3周的可约时间（北京时间，每节25分钟）。如需预约，请联系 CupOfEnglish 运营老师。<br>Open times for the next 3 weeks (Beijing time, 25-minute classes). To book, message CupOfEnglish Operations.</p>
  <div class="list">${list.map((t, i) => tCard(t, i)).join('')}</div><footer>时间均为北京时间 · All times are Beijing time</footer>`; }
function tCard(t, i) {
  const dsel = S.tday[t.name] || ((t.days || []).find(d => d.slots.length) || (t.days || [])[0] || {}).date, D = (t.days || []).find(d => d.date === dsel) || { slots: [] };
  const skills = String(t.skills || '').split('\n').map(s => s.trim()).filter(Boolean), creds = String(t.creds || '').split('\n').map(s => s.trim()).filter(Boolean);
  return `<div class="card"><div class="row" style="align-items:flex-start"><div class="av brand">${esc(String(t.name || '?').charAt(0))}</div><div class="grow"><div class="nm">Teacher ${esc(t.name)}</div>${t.sub ? `<div class="small mute">${esc(t.sub)}</div>` : ''}<span class="chip" style="margin-top:6px">${t.open} 个可约时段 · ${t.open} open times</span></div></div>
  ${creds.length ? `<div class="meta">${creds.slice(0, 4).map(esc).map(x => `<span>✓ ${x}</span>`).join('')}</div>` : ''}
  ${skills.length ? `<div class="sec"><b>擅长领域 · Specialties</b><ul class="ul">${skills.slice(0, 6).map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
  ${(t.books || []).length ? `<div class="sec"><b>教授教材 · Books taught</b><div class="row" style="flex-wrap:wrap;gap:6px;margin-top:4px">${t.books.map(b => `<span class="chip grey">${esc(b)}</span>`).join('')}</div></div>` : ''}
  <div class="sec"><b>学生 · Students</b><p>${t.students ? `目前教授 ${t.students} 位学生 · teaches ${t.students} students` : '—'}${(t.mine || []).length ? `<br>您的学生 · Your students: ${t.mine.map(s => esc(s.name) + (s.cn ? '（' + esc(s.cn) + '）' : '')).join('、')}` : ''}</p></div>
  ${t.style ? `<details><summary>课堂风格 · Classroom style</summary><p class="small" style="margin:6px 0 0">${esc(t.style)}</p></details>` : ''}
  <div class="sec"><b>可约时间 · Open times</b><div class="days">${(t.days || []).map(d => `<button class="${d.date === dsel ? 'on' : ''} ${d.slots.length ? '' : 'none'}" onclick="S.tday['${esc(t.name)}']='${d.date}';paint()"><b>${+d.date.slice(8, 10)}</b><span>${+d.date.slice(5, 7)}月 周${WZ[dOf(d.date).getUTCDay()]}</span><em>${d.slots.length ? d.slots.length + ' 个' : d.full ? '已满' : '—'}</em></button>`).join('')}</div>
  <div class="small mute" style="margin-bottom:6px">${esc(dCn(dsel))} · ${esc(dEn(dsel))}</div><div class="slots">${D.slots.length ? D.slots.map(s => `<span>${esc(s)}</span>`).join('') : `<span style="background:#EEF0F4;color:#8C89A3">${D.full ? '已约满 · Fully booked' : '当天无可约时间 · No open time'}</span>`}</div></div></div>`; }
if (get(KEY)) start(); else show(false);
</script>
