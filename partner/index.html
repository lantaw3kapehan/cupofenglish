.bz-ch{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:8px}
.bz-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0;cursor:pointer;border:0;background:transparent;padding:0;font:inherit;color:inherit}
.bz-v{font-size:10.5px;font-weight:600;color:#2F2C45;margin-bottom:3px;white-space:nowrap}
.bz-c.best .bz-v{color:#00737B;font-weight:800}.bz-c.cur .bz-v{color:#00A3AD;font-weight:600}
.bz-bar{width:62%;max-width:30px;background:#00A3AD;border-radius:6px 6px 3px 3px;display:block;min-height:2px}
.bz-c.cur .bz-bar{background:#00D2B4}.bz-c.best .bz-bar{background:var(--purple)}.bz-c.zero .bz-bar{background:#E7E5EF}
.bz-c>span{font-size:11px;color:#8A87A0;margin-top:5px;height:15px;white-space:nowrap}
.bz-c:focus-visible{outline:3px solid var(--teal2);outline-offset:2px;border-radius:8px}
@media(max-width:760px){.bz-v{font-size:9px}.bz-c>span{font-size:9.5px;letter-spacing:-.02em}}
.yrs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 2px;scrollbar-width:none}.yrs button{min-height:44px;min-width:72px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:15px;color:var(--mute)}
.yrs button[aria-pressed=true]{border-color:var(--teal);background:var(--tealT);color:var(--teal)}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.hl .kpi{min-height:84px}.hl .kpi .v{font-size:21px}
.up{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--green);background:var(--greenT);border-radius:999px;padding:2px 9px;margin-top:4px}
</style>

async function call(op, body) {
  const ctl = window.AbortController ? new AbortController() : null, t = ctl ? setTimeout(() => ctl.abort(), 30000) : 0;

  $('shIn').innerHTML = `<h3>${esc(label)}</h3><img class="pic2" src="${S.pic.url}" alt="${esc(label)}"><p class="small mute" style="text-align:center;margin:10px 0 0">${copied ? '已复制，可直接粘贴到微信 · Copied — paste it in WeChat' : '长按图片 → 发送给朋友或保存 · Long-press the picture to send or save'}</p>
  <button class="btn block" onclick="savePic()">${ic('img')}保存图片 · Save picture</button><button class="btn ghost block" style="margin-top:8px" onclick="closeSh()">关闭 · Close</button>`;
  $('sh').classList.remove('hide'); if (copied) toast('图片已复制 · Picture copied'); }
window.savePic = async () => { const P = S.pic; if (!P) return; const f = typeof File === 'function' ? new File([P.blob], P.name, { type: 'image/png' }) : null;
  if (f && navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f] }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = P.url; a.download = P.name; document.body.appendChild(a); a.click(); a.remove(); toast('已保存 · Saved'); };
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSh(); });
document.querySelectorAll('.eye').forEach(b => { if (!b.innerHTML) b.innerHTML = EYE(false); }); logos();
if (get(KEY)) start(); else show(false);
// never keep an old version open (shared with the student portal): version.txt check + quiet data refresh every 5 min
if (window.PortalUpdate) PortalUpdate.init({ busy: () => !$('sh').classList.contains('hide'), refresh: () => quiet() });
</script>
